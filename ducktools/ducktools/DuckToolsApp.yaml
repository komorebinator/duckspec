description: Python application that implements the DuckTools CLI commands and MCP server for loading and navigating @DuckspecProject files.
extends: @Application
platform: Python
src: ducktools/src/
tests:
  - id: load-project
    description: loads the root project file content and lists all reachable terms, recipes, cross-project references, and project-wide rules (guidelines + ai_instructions)
    command: "python3 -m ducktools load-project Duckspec.yaml"
    expect: output contains the root file content followed by a Workflow section naming @DuckspecWorkflow, then Terms, Recipes, References, and Rules (project-wide) markdown tables
  - id: list-terms
    description: lists reachable term names, file paths, and descriptions
    command: "python3 -m ducktools list-terms Duckspec.yaml"
    expect: output contains at least one `| @<TermName> |` row with a non-empty description column
  - id: load-terms
    description: loads specific terms, each with its `extends` chain, naming the other terms it mentions without loading them
    command: "python3 -m ducktools load-terms Duckspec.yaml DuckToolsApp"
    expect: output contains `--- @DuckToolsApp [` followed by the blocks of its ancestors `@Application`, `@Software`, `@DesignPattern` and `@Term`, and a References line naming mentioned terms; contains no `--- @` block for a term outside that chain
  - id: grep
    description: searches term content by keyword and prints matching term names
    command: "python3 -m ducktools grep Duckspec.yaml resolver"
    expect: output contains a Reference/Line/Match table in which every reference is a `#`-path opening with a term name, at least one of them starting with `@DuckToolsApp#`
  - id: resolve-path
    description: resolves a Term#path reference to a single nested element's raw block, without loading the whole term or its transitive dependencies
    command: "python3 -m ducktools resolve-path Duckspec.yaml DuckspecProject#validate"
    expect: output contains the `- id: validate` block and its `instructions:`, and does not contain unrelated recipes such as `create_readme`
  - id: list-projects
    description: lists every registered project grouped by workspace, as a markdown table, read-only
    command: "python3 -m ducktools list-projects"
    expect: exits successfully; prints `(no workspaces registered)` if ~/.duckspec/settings.json has no workspaces, otherwise a `## workspace-name` heading per workspace (active one marked) followed by a Project/Repository/Path/Description table, or `(empty)` if that workspace has no projects
  - id: verify-project
    description: runs the mechanical consistency pass over @Duckspec's own spec — the framework validating itself
    command: "python3 -m ducktools verify-project Duckspec.yaml"
    expect: exits 0 and prints `no findings` — the framework's own spec is internally consistent
  - id: wiring
    description: "every public resolver method is reachable from both front ends, and every CLI command and MCP tool has a spec entry and every entry names one that exists — a method can exist, be documented, and still be unreachable from outside, and a command can exist and go undescribed, which the source check cannot see since it looks only from the spec towards the code"
    command: "python3 ducktools/check_wiring.py"
    expect: "prints `no orphans` and exits 0; on failure names each front end with the methods it does not call, and each command or tool missing from the spec or described but absent"
  - id: operations
    description: every public resolver method returns what it claims to on a known project, and every CLI command and MCP tool shows it — reachability is check-wiring's job, correctness is this one's
    command: python3 ducktools/check_operations.py
    expect: prints one line per method, command and tool with its verdict, then `all operations pass`, and exits 0; on failure names each one and how its result differed, and names any public method, CLI command or listed MCP tool that no check ran
components:
  - id: resolver
    src: ducktools/src/ducktools/resolver.py
    type: @Singleton
    description: Single shared instance holding every read operation over @DuckspecProject and @Term files — discovery, term-map construction, reachability, rule collection, path resolution, mechanical verification, and workspace registry access. Owns all file and settings I/O; cli and mcp_server are thin presentation layers over it and hold no logic of their own, which is what keeps the two interfaces from drifting apart.
    functions:
      - id: _parse_list_block
        description: "Module-level pure function. Finds the block matching `pattern` in `content`, returns a list of strings — one per item (lines starting with `- `, stripped of the leading `- `). Returns an empty list if the block is absent. Used by callers to extract `guidelines:` and `ai_instructions:` from already-read file content."
        arguments:
          - id: content
            description: raw text content of a term .yaml file
          - id: pattern
            description: compiled regex matching the target block (e.g. _GUIDELINES_BLOCK or _AI_INSTRUCTIONS_BLOCK)
      - id: _parse_dict_list_block
        description: "Module-level pure function. Parses a `<key>:\\n  - <key_field>: ...\\n    description: ...` block into a list of `{key_field: value, description: value}` dicts, splitting on item boundaries. Shared by _parse_recipes (key_field='name', block=_RECIPES_BLOCK) and _parse_references (key_field='repository', block=_REFERENCES_BLOCK) so the two identically-shaped list-of-dicts formats aren't parsed twice. Returns an empty list if the block is absent."
        arguments:
          - id: content
            description: raw text content of a term .yaml file
          - id: pattern
            description: compiled regex matching the target block (_RECIPES_BLOCK or _REFERENCES_BLOCK)
          - id: key_field
            description: "name of the first sub-field per item — 'name' for recipes, 'repository' for references; also the key each result is stored under"
          - id: key_pattern
            description: "optional regex alternative matched instead of `key_field` when reading the item, while the result is still stored under `key_field`. Recipes use `(?:id|name)` so entries renamed to `id:` and entries still on `name:` both parse, and callers keep reading results under 'name'"
      - id: _parse_recipes
        description: "Module-level pure function. Thin wrapper — calls _parse_dict_list_block(content, _RECIPES_BLOCK, 'name', key_pattern='(?:id|name)')."
        arguments:
          - id: content
            description: raw text content of a term .yaml file
      - id: _parse_extends
        description: "Module-level pure function. Returns the value of this term's `extends:` field with any leading `@` stripped, or None if absent."
        arguments:
          - id: content
            description: raw text content of a term .yaml file
      - id: _own_rules
        description: "Module-level pure function. Extracts this one term's own `guidelines:` and `ai_instructions:` (via _parse_list_block), tagged with `term_name` and type 'Guideline'/'AI Instruction'. Does not walk `extends` — inheritance is the caller's job (see _rules_tree, _project_wide_rules)."
        arguments:
          - id: content
            description: raw text content of a term .yaml file
          - id: term_name
            description: name to tag each returned rule with
      - id: _parse_references
        description: "Module-level pure function. Thin wrapper — calls _parse_dict_list_block(content, _REFERENCES_BLOCK, 'repository'). `references:` entries are never resolved to a file or loaded — they're pure data (a repository URL + a description) surfaced as-is, the counterpart to `uses:` for connections that are informational only."
        arguments:
          - id: content
            description: raw text content of a term .yaml file
      - id: _load_settings
        description: "Reads `~/.duckspec/settings.json` (stdlib `json`, no YAML parser needed — this file is tool-managed, never hand-authored). Returns `{active_workspace: str|None, workspaces: dict, ducktools: dict}`; missing keys are defaulted to empty/None so callers never need to guard. Returns the same default shape if the file is absent or unparseable."
      - id: _save_settings
        description: "Writes the given settings dict back to `~/.duckspec/settings.json` as indented JSON, creating the parent `~/.duckspec/` directory if needed."
        arguments:
          - id: settings
            description: the full settings dict, as returned by _load_settings
      - id: _active_projects
        description: "Extracts the active workspace's `projects` map from a settings dict (as returned by _load_settings) and returns it as `dict[str, Path]`. Returns an empty dict if there is no active workspace or it has no `projects` entry."
        arguments:
          - id: settings
            description: settings dict, as returned by _load_settings
      - id: _resolve_project
        description: "Turns whatever a command was given into a project file path. A value containing a path separator or ending in `.yaml` is used as a filesystem path, as before. Anything else is looked up in the active @Workspace by the stem of each registered project's path, so `Duckspec` and `Borshevik` work as arguments from any directory. Returns the value unchanged when no registration matches, which keeps the failure a plain missing-file error rather than a confusing lookup one. The point is that no command's meaning depends on the working directory."
        arguments:
          - id: value
            description: a filesystem path or the identifier of a project registered in the active workspace
      - id: _resolve_entry
        description: "Resolves a single `uses:` entry to a local Path. If `sub` starts with `http://` or `https://`, looks it up in `workspace` — the active workspace's projects, which every caller reads fresh via _load_settings/_active_projects rather than caching, so use_workspace/add_project take effect immediately; prints a warning and returns None if not found. Otherwise resolves `sub` relative to `base` (the directory of the current file) and normalizes it via `.resolve()`, so a `../`-containing entry (e.g. a sub-project's `uses:` circularly referencing back to its own parent) yields the canonical absolute path rather than a literal `ducktools/../Duckspec.yaml`-style string. Returns None if the entry cannot be resolved."
        arguments:
          - id: sub
            description: raw string from the `uses:` list — either a relative path or a repository URL
          - id: base
            description: directory of the file containing the `uses:` entry
          - id: workspace
            description: repository URL -> local path map to look URL entries up in, as returned by _active_projects
      - id: _collect
        description: "BFS from `project_path`, deduped by resolved path. For each visited file: if it declares `terms_folder:`, records the resolved directory (if it exists) as a term folder; if it has a `uses:` block, resolves each entry via _resolve_entry (against the active workspace's projects) into `project_files` and queues the resolved files for further traversal. Returns `(term_folders, project_files)` — the raw ingredients _build_term_map combines into the name→path map."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
      - id: _build_term_map
        description: "The root project file itself is entered first, keyed by its own filename stem — it is a term of its own project like any other, and every other entry is discovered by reading *its* content, so nothing else can add it. Calls _collect, then builds the rest of the name→path map: `project_files` (from `uses:`) are added next via setdefault, so they win on conflict; then every `.yaml` file in each term folder is added in sorted order, printing a warning (not an error) if a name collides with a different file already in the map."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
      - id: _reachable
        description: "BFS from `project_path` computing the subset of `term_map` actually reachable — distinct from _collect/_build_term_map's raw discovery. For each visited file's content: resolves every `uses:` entry the same way as _collect and queues newly found files; separately, scans the entire content for any `@<TermName>` mention — not only inside a `uses:`/`software:` list, anywhere in prose (a guideline, a description, an instruction) — and for each name present in `term_map`, adds it to the reachable set and queues its file too. This mention-based half is why a term becomes reachable simply by being referenced in passing, without being formally declared in any structured list. Used by _walk_terms unless include_all is set, in which case the full term_map is used instead and this function is skipped entirely."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: term_map
            description: name→path map, as returned by _build_term_map
      - id: _extends_chain_from
        description: "Walks a term's `extends:` chain upward starting from an already-known (name, content) pair, stopping at a name with no `extends`, a name not in `term_map`, or a cycle. Returns `[(name, content), ...]` starting with the given term itself. The caller supplies the starting content directly (rather than looking it up via term_map) so this also works for a root project file, which is often not itself a key in its own term_map."
        arguments:
          - id: start_name
            description: name of the term to start from
          - id: start_content
            description: that term's already-read content
          - id: term_map
            description: name→path map, as returned by _build_term_map
      - id: _rules_tree
        description: "Own + inherited rules for one term, kept separate rather than flattened. Looks up term_name in term_map, walks its extends chain via _extends_chain_from, and returns `{own: [...], inherited: [{term, rules}, ...]}` — own is term_name's own _own_rules, inherited is one entry per ancestor that has any (ancestors with none are omitted). Returns `{own: [], inherited: []}` if term_name isn't in term_map or its file can't be read."
        arguments:
          - id: term_name
            description: name of the term to compute the tree for
          - id: term_map
            description: name→path map, as returned by _build_term_map
      - id: _project_wide_rules
        description: "Rules that apply regardless of which term is currently in play: the root project's own extends chain (via _extends_chain_from) plus the _own_rules of every file directly named in the root's `uses:` block — one hop only, not those files' own further reachable terms. Deliberately narrower than collecting rules from every reachable term; term-scoped rules (a single extension's implementation guidelines, say) now travel with that term instead, attached by load_terms, so they surface when the term is actually loaded rather than on every load_project call."
        arguments:
          - id: root
            description: resolved path to the root @DuckspecProject file
          - id: root_content
            description: that file's already-read content
          - id: term_map
            description: name→path map, as returned by _build_term_map
      - id: _walk_terms
        description: "Generator that builds the term map and reachable set, then yields (name, path, content) for each reachable term, reading each file exactly once. All content-extraction methods use this as their single traversal primitive to avoid re-reading files. If include_all is true, yields all terms in the term map instead of only reachable ones."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: include_all
            description: if true, yield all terms in the term map; default false
      - id: load_project
        description: Reads the root project file content, then calls _walk_terms() for a single-pass extraction of descriptions, recipes, and references from all reachable terms — but not rules: those come from _project_wide_rules (root's own extends chain + direct `uses:` only), not from every reachable term, to keep a term's own detailed guidelines out of context until that term is actually loaded. Splits the reachable terms by the project they belong to. `terms` holds this project's own — every term whose file lies under the root file's directory, sub-projects included. `vocabulary` holds the rest, the terms reached through `uses:` of other projects, grouped by the project they come from: the broadest used project whose directory contains the term's file, so the whole framework groups under @Duckspec rather than under each of its sub-projects. Both keep every term's description: a project built on the framework reaches far more framework terms than terms of its own, and one mixed table buried the project among them, but the framework's descriptions are also the catalogue a writer picks a term's type from, so they are grouped apart rather than dropped. Returns a dict {root_content: str, terms: list[{name, path, description}], vocabulary: list[{project, terms: list[{name, path, description}]}], recipes: list[{term, name, description}], references: list[{term, repository, description}], rules: list[{term, type, text}], workflow: {name, note}} where type is 'Guideline' or 'AI Instruction' and `workflow` names the term describing how work is done here without reading it — see _workflow_hint. Recipes and references are still gathered from every reachable term, own or not. Intended as the primary entry point for AI assistants: gives an overview of the project without loading all term content.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
      - id: _workflow_hint
        description: "Which term the root's `workflow:` names, plus a note that it has not been read. Opening a project is not the moment to load the workflow: nothing is in hand yet, so its steps and rules would be context spent on a question nobody has asked. The name and the pointer are enough for a reader to fetch it once there is work to place among the steps. Returns {name: str|None, note: str}, with name None when the project declares no workflow or names no type in it."
        arguments:
          - id: root_content
            description: raw text of the root project file
      - id: load_workflow
        description: "The project's configured workflow — {name, configuration, terms}, where `configuration` is the root's own `workflow:` block verbatim (the overrides it sets, such as main_branch and versioning) and `terms` is load_terms of the workflow term, so its steps, properties, recipes and rules arrive with the chain they are inherited through. Separate from load_project on purpose: a workflow answers what to do next with work in hand, and there is no work in hand when a project is opened, so its steps would be context spent on a question nobody has asked. Nothing beyond locating the term is done here — which terms come back is load_terms' business, and the two behaving differently would be a difference with no reason behind it. Returns {error} when no workflow is configured or the term it names is absent from the map."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
      - id: list_terms
        description: "Calls _walk_terms() and extracts description from each file's content using regex `^description:\\s*(.+)$` (first match, stripped); returns a list of {name, path, description} sorted by name. If include_all is true, returns all terms in the term map instead of only reachable ones."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: include_all
            description: if true, return all terms in the term map regardless of @<TermName> mentions; default false
      - id: load_terms
        description: "Each requested term followed by its `extends` chain, as a list of {name, path, content} — plus, on the requested terms only, a `rules` key holding the {own, inherited} tree from _rules_tree, and a `references` key naming the terms it mentions without loading them. Unrecognised names are silently skipped. The chain is inlined because a term is incomplete without it: its inherited properties and recipes are its own members. Everything else it mentions is a neighbour, returned by name so the reader can descend into whichever branch the question is actually about. Following those mentions instead, as this did before, made every call return the whole corpus — a mention is not a dependency, and a guideline that lists `@Key` and `@Page` as examples of names taken on GitHub dragged both in as if the workflow were built on them. Measured on this project, reading @WorkflowStep cost 57 terms and 182K characters, the same figure every other term produced, because the reference graph is a dense mesh through the @Term and @DuckspecProject hubs rather than a tree; the chain costs 2 terms and 6.5K. That is what makes the corpus navigable by depth: each call shows where it is possible to step, and only the step taken is paid for."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project); used to build the term map
          - id: term_names
            description: list of term names (without @) to load
      - id: grep_terms
        description: Case-insensitive substring search across the content of every reachable term. Each hit comes back as {ref, line, text}, where `ref` is the `#`-path of the element the line sits in (see _element_paths) — the same form resolve_path, set_field and remove_element already take, so a search result can be acted on directly instead of sending the reader back into the file to work out whose line it was. `lines` is still returned alongside for callers that only want the text.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: query
            description: substring to search for (case-insensitive)
          - id: include_all
            description: if true, search all terms in the term map instead of only reachable ones; default false
      - id: _find_named_blocks
        description: "Module-level pure function. Returns every entry carrying this id, at any depth, as a list of raw blocks. `#`-paths are allowed to skip levels, so the search cannot be restricted to immediate children; counting the matches is what separates an unambiguous path from one that silently resolved to whichever entry happened to come first. Feeds both _extract_named_block and the `ambiguous-path-ref` check."
        arguments:
          - id: content
            description: raw text to search — a whole term file's content or a previously narrowed block
          - id: name
            description: the id to match
      - id: _extract_named_block
        description: Module-level pure function. The first entry carrying this id, or None — a thin wrapper over _find_named_blocks, which does the scanning and returns every match. The two were one function once, and this description still described that body long after the work moved: keeping it meant reading an account of line-by-line scanning that happens somewhere else now.
        arguments:
          - id: content
            description: raw text to search — either a whole term file's content or a block previously returned by this same function
          - id: name
            description: the value following `name:` to match
      - id: _extract_key_block
        description: "Module-level pure function. The counterpart to _extract_named_block for plain mapping keys — `functions:`, `properties:`, `guidelines:` — which are not list entries and so carry no `- id:` to match. Scans for `<name>:` at any indentation and captures that line plus every following line indented deeper than it, stopping at the first line at the same or shallower indentation. A scalar key (e.g. `src: ../src/`) yields just its own line. Returns None if no such key exists."
        arguments:
          - id: content
            description: raw text to search — a whole term file's content or a previously narrowed block
          - id: name
            description: the key name to match, without the trailing colon
      - id: _narrow
        description: Module-level pure function. Resolves a single `#`-path segment against `content` by trying _extract_named_block first and falling back to _extract_key_block. That order is the tie-breaker when a term holds both a named list item and a mapping key of the same name — a component called `settings` in a term that also has a `settings:` key stays addressable — and keeps every path that resolved before keys became addressable resolving to the same block. Used by _locate, and only by it: resolve_path and verify_project both need the candidate count in order to refuse an ambiguous segment, so they call _find_named_blocks themselves rather than going through a helper that has already discarded it.
        arguments:
          - id: content
            description: raw text to narrow
          - id: segment
            description: one `#`-separated path segment
      - id: resolve_path
        description: Splits `ref` on `#`; the first segment (leading `@` stripped if present) is the term name, the remaining segments are a path within it. Looks up the term's file via the term map — built the same way as load_terms, but only that one file is read; transitive @<TermName> dependencies are not followed. Starting from the full file content, narrows it one segment at a time, and a segment may name either a list item or a mapping key. Refuses a segment matching more than one entry rather than returning whichever came first, the way _locate already does for the editing operations: returning the first quietly turns a defect in the spec into a plausible answer, and it hid a stale duplicate of an entire recipe in @DuckspecProject across five releases. Returns {name, path, ref, content} where content is the fully-narrowed block (or the whole file when `ref` has no path segments), {name, path, ref, error} when a segment is ambiguous, or None when the term is not in the term map or a segment does not resolve.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project); used to build the term map
          - id: ref
            description: "reference in the form `TermName#segment#segment...` (e.g. `DuckspecProject#validate` or `DuckToolsApp#resolver#load_project`); leading `@` on the term name is optional"
      - id: _line_of
        description: "Module-level pure function. Converts a character offset within `content` into a 1-based line number by counting newlines before it. Used by verify_project to anchor findings to a line; only called for checks whose regex already yields an offset, so checks driven by the block parsers report no line rather than paying for one."
        arguments:
          - id: content
            description: raw text the offset refers to
          - id: pos
            description: character offset into content
      - id: _duplicate_terms
        description: "Calls _collect() and re-walks the same `*.yaml` globs it discovered, returning a list of {name, path, first_path} for every term name that appears in more than one file. Deliberately separate from _build_term_map — that method resolves collisions silently (first wins) and is on the hot path of every other operation, so it stays untouched; only directory listings are re-read here, never file contents."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
      - id: _slot_element_types
        description: "Module-level pure function. Maps slot name -> element @Term name for every slot this term's `properties:` declares with an explicit `type:`. Only slots holding named entries or a typed mapping carry one; a scalar field whose value happens to mention a term (`readme`, `graphic`, `when`) does not. That distinction is what the explicit declaration buys — it cannot be recovered from the slot's prose, which is how an earlier inference came to read `readme` as holding @Project entries. A slot without a `type:` is skipped rather than guessed at, so nothing inside it is checked."
        arguments:
          - id: content
            description: raw text content of a term .yaml file
      - id: _item_name
        description: "Module-level pure function. Reads the `- id:` value off the first line of an item block, stripping surrounding quotes. Returns an empty string when the block is a bare list value rather than a named entry."
        arguments:
          - id: item_lines
            description: the item's lines, first of which carries the `- id:` marker
      - id: _has_field
        description: "Module-level pure function. True when `field` is set on the item itself rather than on something nested inside it, matched at exactly the item's own field column — two past its `- ` marker. Matching at any indentation instead would let a nested component's `type:` satisfy a check against its parent."
        arguments:
          - id: item
            description: the item block as returned by _slot_items
          - id: field
            description: field name to look for
          - id: item_indent
            description: indentation of the item's `- ` marker
      - id: _slot_items
        description: "Module-level generator. Yields (item_name, item_block, item_indent) for every named entry under every occurrence of `<slot>:`, at any depth — a `components:` nested three levels down is walked like a top-level one. Items are split only on `- ` at the slot's own item column; splitting on any `- ` would turn a nested function's arguments into entries of the enclosing slot. Bare string entries yield no name and are skipped by callers, since those slots hold values rather than elements."
        arguments:
          - id: content
            description: raw text to scan
          - id: slot
            description: slot name whose entries to yield
      - id: _slot_mapping
        description: "Module-level generator. The mapping counterpart of _slot_items: yields (keys, own_type, indent) for every occurrence of `<slot>:` whose body is a block of `key: value` lines rather than `- ` entries, where `keys` are the mapping's own keys at its first key's column and `own_type` is the @<TermName> named by its `type:` key, if any. Occurrences whose body starts with `- ` are left to _slot_items, so a slot is read as one shape or the other and never both. This is what lets `settings:`, `workflow:` and `versioning:` be checked at all — they hold a single mapping, so the entry-based walk finds nothing in them and reports nothing, whether or not their contents are valid."
        arguments:
          - id: content
            description: raw text to scan
          - id: slot
            description: slot name whose mappings to yield
      - id: _function_sites
        description: Module-level generator. Yields (function_id, line_number, srcs, type_name) for every entry of a function-holding slot, carrying the `src:` and `type:` of the nearest enclosing component rather than the term's top-level ones — for a @Software spanning a dozen files those would name the wrong file or none. `srcs` is a list because a `src:` may name one path or several (see _src_values), and a function is looked for in all of them. Which slots hold functions is passed in, derived from the declared element types, so a slot is recognised by what it was declared to hold and not by being named `functions`; matching the name would silently skip any other slot typed @Function, which is the same silence-means-unchecked failure the `untyped-slot` check exists to end.
        arguments:
          - id: content
            description: raw text to scan
          - id: function_slots
            description: names of slots whose declared element type is @Function or a subtype
      - id: _slot_names
        description: "Module-level generator. Yields each distinct `<key>:` header name appearing in a term at any depth, in first-seen order. Feeds the `untyped-slot` check, which needs the slots a term actually uses rather than the ones some type declares."
        arguments:
          - id: content
            description: raw text to scan
      - id: _member_names
        description: "Module-level pure function. Returns the ids declared directly in a term's `properties:` block, ignoring inheritance entirely — the raw input the re-declaration check compares across an `extends` chain."
        arguments:
          - id: content
            description: raw text content of a term .yaml file
          - id: pattern
            description: compiled regex matching the target block (_PROPERTIES_BLOCK)
      - id: _schema
        description: "Every member a thing of this type may carry — the term's own `properties:` ids plus every ancestor's, collected by walking `extends` upward. Returns an empty set for a term absent from the map, which makes the caller skip that slot rather than report every field in it as unknown. Feeds the `unknown-field` check, which composes two of these: the slot's declared element type and the type named in the entry's own `type:`."
        arguments:
          - id: term
            description: name of the term whose schema to collect
          - id: term_map
            description: name->path map, as returned by _build_term_map
          - id: cache
            description: name->content map, reused and extended so no file is read twice
      - id: verify_project
        description: "Mechanical consistency pass over the whole project — everything about a spec that can be proven true or false without reading source or judging meaning. Builds the term map once, then calls _walk_terms(include_all=true) for a single-pass traversal, and returns a flat list of {severity, check, term, path, line, message} sorted by severity then path, where severity is 'error' or 'warning', `check` is a stable slug for filtering and CI diffing, and `line` is absent when the originating check does not yield an offset. An empty list means the spec is internally consistent. Complements rather than replaces @DuckspecProject#verify_source, which covers the semantic half — whether descriptions actually match the implementation — that no regex can settle. Checks: `dangling-ref` — an @<TermName> mention with no term of that name in the map; `broken-path-ref` — an @<TermName>#segment#segment reference whose segments do not resolve; `ambiguous-path-ref` — a segment matching more than one entry at the level it is searched, which the resolver would otherwise silently narrow to whichever came first; `unknown-extends` — an `extends:` naming a term absent from the map; `extends-cycle` — an `extends:` chain that revisits a term, which _extends_chain_from otherwise truncates silently; `duplicate-term` — one term name defined in several files, from _duplicate_terms; `unparsed-term` — a `.yaml` in a terms folder with no `description:` at zero indentation, which regex-based extraction would otherwise read as empty rather than as broken; `broken-uses` — a `uses:` entry that resolves to nothing, split by why: a relative path with no file at the other end is an error, since the path is simply wrong, while a repository URL absent from the active workspace is a warning, since the spec is correct and it is the environment that has not cloned or registered that project. Both were silently skipped before, which is how a sub-project could be dropped from the term map with nothing said: the entry vanished, every term it would have contributed became a dangling reference somewhere else, and the report named those instead of the one line that caused them; `broken-operation` — a workflow step whose `operation` is not a call to a recipe: not in the `@<TermName>#<recipe>(<argument>=<value>, ...)` form, naming something that is not a recipe of that term or its ancestors, or passing an argument the recipe does not declare. A reference that merely resolves is not enough here — `broken-path-ref` accepts a component that describes a pipeline file, and a step pointing at one looks implemented while nothing could ever run it; `unknown-field` — a field set on something of known type that no type it has declares, where the schema is composed from the slot's `type:` and the target's own `type:` via _schema. It covers both shapes a typed slot takes: a list of named entries, each checked on its own via _slot_items, and a single mapping such as `settings:`, `workflow:` or `versioning:`, checked as a whole via _slot_mapping, which may name its type in its own `type:` key instead of on the slot. Untyped slots are checked in neither shape — silence about a slot means nothing was verified there, not that it was found correct. A third shape is the term's own top-level fields, read against its `extends` chain: `description`, `extends`, `name` and the declaration blocks (`properties`, `recipes`, `guidelines`, `ai_instructions`) are structural and always allowed, and everything else must be declared by the term or one of its ancestors. Without this the `extends:` mechanism bought nothing at the top level — a term could set any field at all, including a whole slot no type describes, and the report stayed empty; `redeclared-member` — a `properties:` entry an ancestor already declares, which inheritance would replace silently; recipes are deliberately not checked, since re-declaring them is how a subtype implements a base term's contract; `unreachable-term` (warning, opt-in via the `unreachable` argument) — a term in the map that no reachable term mentions; off by default because a framework or library project ships terms meant for consumer projects, where every one of them is legitimately unreachable from its own root and would drown the report; `untyped-slot` (warning, opt-in via the `untyped` argument) — a slot holding named entries or a mapping whose element type no type declares, so `unknown-field` skipped it entirely. This is the check that reports the checker's own blind spots: without it a clean run is ambiguous between "everything here is correct" and "nothing here was read", and a slot can hold hundreds of unverified entries while the report stays empty. Off by default because a project mid-migration lights up everywhere. The reference checks carry no exemptions: every `@<Name>` mention must resolve, which is what makes the check trustworthy. Documentation about the reference syntax itself uses the angle-bracket placeholder form (`@<TermName>`) that is deliberately outside the reference grammar, so it never needs one."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: unreachable
            description: if true, also report unreachable terms; default false
          - id: untyped
            description: if true, also report slots whose contents no check reads; default false
      - id: verify_source
        description: The mechanical half of @DuckspecProject#verify_source — the part settled without reading code. Walks the terms living under the root project's own directory (a dependency's source is its own project's business) and returns findings shaped like verify_project's. Checks: `missing-src` — a `src:` value with no file or directory at that path, skipping the one under `settings:`, which defines the source root rather than naming somewhere inside it and would otherwise be resolved against itself, and skipping values starting with `~` — a path in the user's home, such as the settings registry, which no repository ships — or `@`, which name a term rather than a path; `absent-function` — a function entry whose id appears nowhere in the source its nearest enclosing component declares, skipping ids listed in that component's type's `implicit_functions`, which name a role rather than a symbol. The match is a plain word-boundary search, and stays one deliberately: a check that tried to recognise declarations would have to enumerate every way each language lets you write one, and the first idiom it had not thought of would be an error raised against working code. What it does control is which bytes it reads — each candidate file is searched on its own (see _source_files), never as one concatenated blob, so a name defined in one module cannot answer for a component pointing at another, and unreadable files are skipped rather than decoded, so compiled bytecode cannot vouch for a name the sources have dropped. Each term resolves paths against its owning project's source root, found by _source_root. It deliberately does not judge whether a description matches the implementation — the largest part of the recipe, where every contradiction found in the Borshevik audit lived, and which no search settles.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
      - id: term_uses
        description: "Reverse index over the term map: for one term, which terms extend it, which mention it as an @<TermName> reference, and which name it as a slot's or an entry's `type:`. The forward direction was always available by reading a term; the reverse required grepping the whole tree, which is what made questions like \"does anything extend this\" hard to answer before changing a term."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term to find references to
      - id: term_schema
        description: "Every member a term effectively has, each tagged with the ancestor that declared it — the term's own `properties:` plus the whole `extends` chain, in chain order. Answers what a term actually carries before it is edited, which otherwise means reading every file up the chain by hand."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term whose effective schema to resolve
      - id: query_terms
        description: "Filters the term map by structural predicate rather than by text: terms with no `extends:`, terms extending a given term, terms declaring a given member, terms whose file sits under a given folder. Returns the matching names, so it answers both \"which\" and \"how many\" — the count being what sizes a change before it is made."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: rootless
            description: if true, return only terms that declare no `extends:`
          - id: extending
            description: return only terms whose `extends` chain includes this term
          - id: declaring
            description: return only terms declaring a member of this id
          - id: folder
            description: return only terms whose file path contains this fragment
      - id: slot_entries
        description: "Lists the entries of one slot in one term as {id, fields}, where fields are the keys set on the entry itself rather than on anything nested inside it. Reading a slot previously meant loading the whole term and eyeballing it, or calling the internal item walker directly."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term holding the slot
          - id: slot
            description: the slot whose entries to list
      - id: _locate
        description: Returns (file, lines, start, end) for the element a `#`-path addresses, or an error string. Narrows segment by segment through _narrow, tracking line numbers so the boundaries can be edited, and refuses an ambiguous step instead of taking the first match. Shared by every editing operation — set_field, add_entry, remove_element and the four item operations — so none of them can disagree with another about what a path points at.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`TermName` or `TermName#segment#segment...`"
      - id: set_field
        description: Sets a field on the element a `#`-path addresses, or on the term itself when the path names only a term. Rewrites the value in place when the field is already there, inserts it immediately after the element's first line when it is not, always at the element's own field column. An entry's first field is written on the `- ` line itself, two columns short of its siblings, and is matched there too — looking only at the sibling column meant `id` was never found on an entry and a second `id:` was appended below the first, leaving the file with two. Structure-aware on purpose: hand-written anchors were what put a description on the wrong component and inserted the same block twice during the identity migration. Refuses when the path is ambiguous rather than editing whichever element came first. Returns the file path and whether the field was added or replaced.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`TermName` or `TermName#segment#segment...`"
          - id: field
            description: the field to set
          - id: value
            description: the value to set it to
      - id: add_entry
        description: "Appends a named entry to the slot a `#`-path addresses — the counterpart of remove_element, and the operation whose absence forced hand-editing whenever a term needed one more property, function or component. The path names the slot, not an entry: `DuckspecProjectSettings#properties`, `ImageManagerApp#progress-window#functions`. The item column is taken from the entries already there, so a nested slot lands at its own depth; an empty slot gets the slot's indent plus two. `fields` are written under the new `- id:` in the order given. Refuses an ambiguous path, and refuses an id already present among the slot's entries rather than creating a second one that `#`-paths could not tell apart. Returns the file path and the id added."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`TermName#segment...` ending at the slot to append to"
          - id: entry_id
            description: id for the new entry, unique among the slot's existing entries
          - id: fields
            description: "mapping of field name to value written under the new entry, e.g. {description: ...}; a list or mapping value is written as a nested block via _field_lines, so `arguments: [{id: ..., description: ...}]` becomes named entries"
      - id: remove_element
        description: Removes the element a `#`-path addresses, together with everything nested under it, locating its boundaries through _locate. Removing a block by regex is what left orphaned loop bodies in the resolver mid-migration; boundaries computed from indentation cannot do that. Refuses on an ambiguous path. Returns the file path and the number of lines removed.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`TermName#segment#segment...` — a bare term name is refused, since deleting a whole term file is not this operation's job"
      - id: _find_item
        description: "Line range of the single item matching a substring inside an already-located list, or an error string. Refuses on more than one match, so an item is never edited by position when the caller meant another one. Takes the range rather than a block name because the list has already been resolved by path — which is what lets the item operations reach lists at any depth."
        arguments:
          - id: lines
            description: the file's lines
          - id: start
            description: first line of the located list
          - id: end
            description: line after the located list
          - id: match
            description: substring identifying the item
      - id: _item_line
        description: "One list item rendered at the given column. Quotes the value when it holds a colon or a hash, which would otherwise read as structure, and escapes a quote already inside it rather than letting it close the quoting early and leave a line that still looks like valid YAML."
        arguments:
          - id: text
            description: the item text
          - id: indent
            description: column to write the item at
      - id: _item_text
        description: "The text of one list item, the inverse of _item_line: double quotes are undone together with the escapes inside them, single quotes with their doubled `''`, and a value continued over several lines is joined the way YAML folds it. move_item takes an item's text out and writes it back through add_item, and stripping only the outer quotes left the escapes behind to be escaped a second time, so every quote in a moved rule came back with its escape doubled."
        arguments:
          - id: item_lines
            description: the item's lines, first of which carries the `- ` marker
      - id: _term_file
        description: Path of one term's file, or None when the project's term map does not hold it. Used by remove_term to find the file it deletes.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term to locate
      - id: add_item
        description: "Appends a bare string to the list a Term#path addresses — a term's `guidelines:`, `ai_instructions:` or `goals:`, a recipe's `instructions:`, a project's `software:` or `uses:` — creating the block when absent, and inserting after a named neighbour when `after` is given. These lists hold strings rather than named entries, so set_field and remove_element have nothing to address; addressing the list by path rather than by term plus block name is what lets the same operation reach a recipe's instructions, which sit two levels down and were previously reachable by nothing."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list to append to
          - id: text
            description: the text to add, quoted automatically when it would otherwise break the line
          - id: after
            description: substring identifying the item to insert after; appended at the end when omitted
      - id: set_item
        description: "Replaces the text of the item matching a substring, in place. Without it the only way to reword an item is remove plus add, which appends — so an edit silently relocates the item to the end of its block, past whatever it was deliberately grouped with. Refuses an ambiguous match the way remove_item does."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list holding the item
          - id: match
            description: substring identifying the item
          - id: text
            description: the replacement text
      - id: remove_item
        description: "Removes the item matching a substring, deleting the block when it empties. Refuses when the substring matches more than one item rather than removing whichever came first."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list holding the item
          - id: match
            description: substring identifying the item
      - id: move_item
        description: "Moves an item verbatim from one list to another, in the same term or a different one. Reclassifying a rule — the test is whether it describes the format or directs the model — is a routine correction that by hand risks dropping or duplicating the text."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: from_ref
            description: TermName#segment... the item currently sits in
          - id: to_ref
            description: TermName#segment... to move it to
          - id: match
            description: substring identifying the item
      - id: create_term
        description: "Creates a term file in the project's terms folder with a description and a parent. The filename is the identity, so it is derived from the name rather than left to drift apart from it."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: CamelCase name, which becomes both the filename and the identity
          - id: description
            description: what the term represents
          - id: extends
            description: parent term name; defaults to Term
      - id: rename_term
        description: "Renames a term file and rewrites every `@<OldName>` reference across the project. Identity lives in the filename, so a rename is project-wide rather than a file operation; done by hand it leaves dangling references that surface only on the next check."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: old_name
            description: current term name
          - id: new_name
            description: new term name
      - id: remove_term
        description: "Deletes a term file, refusing while anything still references it. That check is the difference from deleting the file: the checker would report the dangling references afterwards, but the deletion would already have happened."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term to delete
      - id: create_workspace
        description: "Adds `name` to `workspaces` in the settings file with an empty `projects` map (no-op if it already exists). Sets `active_workspace` to `name` if `activate` is true or there was no active workspace yet."
        arguments:
          - id: name
            description: unique name for the new workspace
          - id: activate
            description: if true, also make this the active workspace; default true
      - id: use_workspace
        description: "Sets `active_workspace` to `name` and saves. Returns false without writing if `name` is not a key under `workspaces`; true otherwise."
        arguments:
          - id: name
            description: name of an existing workspace to activate
      - id: list_projects
        description: "Reads the settings file, then for every workspace reads each registered project's own file: `name` is the file's stem — the project's identity, not its `name:` display label — and `description:` is extracted via regex. Returns `{active_workspace, workspaces: {name: {projects: [{repository, path, name, description}]}}}`. A project whose file is missing or unreadable still lists (`name: None`) rather than being dropped, so a stale registry entry stays visible instead of hidden."
      - id: add_project
        description: "Reads `repository:` from the file at `project_path` via regex; returns None (no write) if absent. Otherwise resolves the target workspace (the given `workspace_name`, or the active workspace if omitted; returns None if neither resolves), creates it if missing, and sets `projects[repository] = str(project_path.resolve())`. Returns the repository URL used."
        arguments:
          - id: project_path
            description: path to the @DuckspecProject file to register
          - id: workspace_name
            description: workspace to add to; defaults to the active workspace
      - id: remove_project
        description: "Deletes `repository` from the resolved workspace's `projects` (given `workspace_name`, or the active workspace). Returns false without writing if the workspace or the entry does not exist; true otherwise."
        arguments:
          - id: repository
            description: repository URL of the project to remove
          - id: workspace_name
            description: workspace to remove from; defaults to the active workspace
      - id: _source_files
        description: The files a function id is searched in for the `absent-function` check. Returns the single file when the component points at one, and every file beneath it when it points at a folder — cached per folder, since a package's functions all resolve to the same list. Skips `__pycache__`, `.git` and the other build caches outright. The folder's content used to be concatenated into one string instead, which gave the check two ways to be satisfied by something that is not there: a name defined in a sibling module, and compiled `.pyc` bytecode — stale by days against its own source — still carrying a name the sources had dropped. Returning nothing for a folder is what made the check's first run read none of @DuckToolsApp's 103 functions and still report no findings.
      - id: _source_root
        description: The directory a term's `src:` values resolve against. Finds the project owning the term by scanning the term folder's siblings for the `.yaml` whose `terms_folder:` names that folder — matching on the declaration rather than on the folder's name, since @DuckTools keeps its terms in `ducktools/` while its file is `DuckTools.yaml`. The root is that project's `settings.src`, defaulting to `..`. A term no sibling claims — a root project file, which sits beside its terms folder rather than in it — is read as its own project, so its own `settings.src` applies; only a file that cannot be read falls back to the term's own directory.
      - id: _quoted
        description: Module-level pure function. A value about to be written into a term file, wrapped in double quotes when leaving it bare would read as structure rather than text: a colon-space inside it, a trailing colon, or a leading character carrying YAML meaning. Values already quoted are returned as they are. A bare term reference such as `@Recipe` is the exception and is left unquoted, because every other place in the format writes it that way — `extends: @Term`, `type: @Field` — and when this function quoted it, every parser of `type:` missed the slot's element type, so the slot read as untyped and unknown-field skipped every entry in it. That is how a workflow's steps went unchecked.
      - id: _src_values
        description: Module-level pure function. The paths one `src:` declares, whether it names a single path inline or lists several beneath itself. Both forms are ordinary in a spec — a component points at its own module, while the @Software above it points at every file its code is split across — but only the inline one used to be read, so every function under a list-form `src:` was left with no path at all, and a function with no path is one `absent-function` skips in silence. Five of Borshevik's image-manager functions sat in exactly that position, under a `src:` naming two files at once.
      - id: _element_paths
        description: Module-level pure function. For each line of a term, the `#`-path segments of the element that line belongs to. Keeps a stack of open elements by indentation, pushing both kinds of segment a path can name — a `key:` opening a block, and a `- id:` entry inside one — and popping whatever the current indentation has closed. Used by grep_terms to give every hit an address rather than a bare line.
      - id: _field_lines
        description: "Module-level pure function. One field written at a column, with whatever it holds nested beneath it: a mapping as keys two columns in, a list as `- ` items, and a list item that is itself a mapping with its first key on the marker line, the way every entry in the format is written. Scalars go through _quoted. What lets add_entry write an entry with nested blocks — a function with its `arguments`, a component with its `functions` — in one call instead of leaving them to be written by hand."
        arguments:
          - id: field
            description: the field name
          - id: value
            description: a scalar, a mapping or a list
          - id: column
            description: indentation of the field itself
  - id: settings
    type: @ConfigFile
    format: JSON
    src: ~/.duckspec/settings.json
    description: "Tool-managed registry, never hand-edited: `{active_workspace: str, workspaces: {name: {projects: {repository_url: local_path}}}, ducktools: {src, bin}}`. `workspaces` groups @DuckspecProject files that reference each other by repository URL, resolved via the currently active one; `ducktools.src` is the canonical framework clone's `ducktools/` directory, and `ducktools.bin` is the path to the small stdlib wrapper script that puts the `ducktools` command on PATH — no pip, no venv, no build step (see @Duckspec#install). Read fresh on every resolution, not cached; created on first write by create_workspace/add_project."
  - id: cli
    src: ducktools/src/ducktools/cli.py
    type: @Application
    description: Command-line front end. Parses argv with argparse, dispatches to the matching resolver method, and prints the result as markdown tables or raw term blocks. The two verify commands carry an exit status — 1 when any finding is an error, 0 otherwise — so either can serve as a CI or pre-commit gate; every other command exits 0.
    functions:
      - id: help
        description: "Command `ducktools help [command]`; prints the command reference held in cli itself. With no argument: a note that every project-taking command accepts either a path to a .yaml file or a registered project identifier, then a Command/Purpose markdown table per group (reading, structure, checking, editing, workspace, other). With a command name: that command's usage line, its purpose, and an Argument/Description table. An unknown name prints `no such command: <name>` and falls back to the full reference. Reads no project file and no settings, so it answers before anything is registered."
        arguments:
          - id: command
            description: optional command to describe in detail; omitted prints the full reference
      - id: load-project
        description: Command `ducktools load-project <project_path>`; calls resolver#load_project; prints the root project file content, then a Workflow section carrying the `workflow` note, followed by the Terms table of this project's own terms, one `Terms from @<project>` table per used project whose terms are reached (left out when there are none), and the Recipes, References, and Rules (project-wide) markdown tables
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
      - id: load-workflow
        description: "Command `ducktools load-workflow <project_path>`; calls resolver#load_workflow; prints the workflow term's name as a heading, the root's own `workflow:` block under `## As this project configures it`, then the term blocks load-terms would print for it — or the error when no workflow is configured"
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
      - id: list-terms
        description: "Command `ducktools list-terms <project_path> [--all]`; calls resolver#list_terms; prints a markdown table with columns Term, File, and Description"
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: --all
            description: pass to resolver#list_terms as include_all=true
      - id: load-terms
        description: Command `ducktools load-terms <project_path> <TermName> [TermName ...]`; calls resolver#load_terms; prints each term and each ancestor of its `extends` chain as `--- @<TermName> [file_path] ---\n<yaml content>`, followed, for each explicitly requested term only, by a References line naming the terms it mentions without loading them and a `## Rules for @<TermName>` own/inherited breakdown
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: term_names
            description: one or more term names (without @) to load with their `extends` chains
      - id: grep
        description: Command `ducktools grep <project_path> <query> [--all]`; calls resolver#grep_terms; prints a markdown table of Reference, Line and matching text, where the reference is the `#`-path of the element the hit sits in and can be passed straight to resolve-path or set. Only the first three hits per term are printed and the text is cut at 100 characters — a keyword common enough to appear a dozen times in one term would otherwise bury the terms below it.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: query
            description: substring to search for (case-insensitive)
          - id: --all
            description: pass to resolver#grep_terms as include_all=true
      - id: resolve-path
        description: Command `ducktools resolve-path <project_path> <ref>`; calls resolver#resolve_path; prints `--- <ref> [file_path] ---\n<content>`, `not found: <ref>` when nothing resolves, or the ambiguity message when a segment matches more than one element — which is a defect in the spec rather than in the reference, and says so.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: ref
            description: "reference in the form `TermName#segment#segment...`"
      - id: verify-project
        description: "Command `ducktools verify-project <project_path>`; calls resolver#verify_project; prints a markdown table of Severity, Check, Term, Location (path with `:line` appended when present), and Message, or `no findings` when the list is empty. Exits 1 if any finding has severity 'error', 0 otherwise, so it can be used directly as a CI or pre-commit gate."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: --unreachable
            description: pass to resolver#verify_project as unreachable=true
          - id: --untyped
            description: pass to resolver#verify_project as untyped=true
      - id: verify-source
        description: "Command `ducktools verify-source <project>`; calls resolver#verify_source; prints the same Severity/Check/Term/Location/Message table verify-project prints, or `no findings`. Exits 1 when any finding is an error, so it can gate a commit alongside verify-project."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
      - id: set
        description: "Command `ducktools set <project> <ref> <field> <value>`; calls resolver#set_field; prints the file touched and whether the field was added or replaced."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`TermName` or `TermName#segment#segment...`"
          - id: field
            description: the field to set
          - id: value
            description: the value to set it to
      - id: add
        description: "Command `ducktools add <project> <ref> <entry_id> [field=value ...]`; calls resolver#add_entry; prints the file touched and the id added. Each trailing argument is split on the first `=`, so `description='...'` reads naturally in a shell; a value starting with `[` or `{` is read as JSON and becomes a nested block, and one that is not valid JSON is refused with the parse error."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`TermName#segment...` ending at the slot to append to"
          - id: entry_id
            description: id for the new entry
          - id: fields
            description: zero or more `field=value` pairs written under the new entry
      - id: remove
        description: "Command `ducktools remove <project> <ref>`; calls resolver#remove_element; prints the file touched and how many lines went."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`TermName#segment#segment...`"
      - id: add-item
        description: "Command `ducktools add-item <project> <Term#path> <text> [--after M]`; calls resolver#add_item; prints what it returns."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list to append to
          - id: text
            description: the text to add
          - id: --after
            description: substring identifying the item to insert after
      - id: set-item
        description: "Command `ducktools set-item <project> <Term#path> <match> <text>`; calls resolver#set_item; prints what it returns."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list holding the item
          - id: match
            description: substring identifying the item
          - id: text
            description: the replacement text
      - id: remove-item
        description: "Command `ducktools remove-item <project> <Term#path> <match>`; calls resolver#remove_item; prints what it returns."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list holding the item
          - id: match
            description: substring identifying the item
      - id: move-item
        description: "Command `ducktools move-item <project> <from#path> <to#path> <match>`; calls resolver#move_item; prints what it returns."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: from_ref
            description: TermName#segment... the item currently sits in
          - id: to_ref
            description: TermName#segment... to move it to
          - id: match
            description: substring identifying the item
      - id: create-term
        description: "Command `ducktools create-term <project> <TermName> <description> [--extends T]`; calls resolver#create_term; prints what it returns."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: CamelCase name, which becomes both the filename and the identity
          - id: description
            description: what the term represents
          - id: --extends
            description: parent term name; defaults to Term
      - id: rename-term
        description: "Command `ducktools rename-term <project> <OldName> <NewName>`; calls resolver#rename_term; prints what it returns."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: old_name
            description: current term name
          - id: new_name
            description: new term name
      - id: remove-term
        description: "Command `ducktools remove-term <project> <TermName>`; calls resolver#remove_term; prints what it returns."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term to delete
      - id: uses
        description: "Command `ducktools uses <project> <TermName>`; calls resolver#term_uses; prints one line per relation — extended by, typed by, referenced by."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term to find references to
      - id: schema
        description: "Command `ducktools schema <project> <TermName>`; calls resolver#term_schema; prints a Member/Declared-by table in chain order."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term whose effective schema to resolve
      - id: query
        description: "Command `ducktools query <project> [--rootless] [--extending X] [--declaring M] [--folder F]`; calls resolver#query_terms; prints the matching terms and their count."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: --rootless
            description: only terms declaring no `extends`
          - id: --extending
            description: only terms whose `extends` chain includes this term
          - id: --declaring
            description: only terms declaring a member of this id
          - id: --folder
            description: only terms whose path contains this fragment
      - id: entries
        description: "Command `ducktools entries <project> <TermName>#<slot>`; calls resolver#slot_entries; prints an Id/Fields table."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "reference in the form `TermName#slot`"
      - id: serve
        description: "Command `ducktools serve [project_path]`; starts the MCP server in stdio mode; project_path is optional and unused — the server accepts any project_path per MCP request via the tools/call arguments"
        arguments:
          - id: project_path
            description: unused; accepted for backward compatibility with existing .mcp.json registrations
      - id: create-workspace
        description: "Command `ducktools create-workspace <name>`; calls resolver#create_workspace"
        arguments:
          - id: name
            description: unique name for the new workspace
      - id: use-workspace
        description: "Command `ducktools use-workspace <name>`; calls resolver#use_workspace; prints the new active workspace or `no such workspace: <name>`"
        arguments:
          - id: name
            description: name of an existing workspace to activate
      - id: list-projects
        description: "Command `ducktools list-projects`; calls resolver#list_projects; prints a `## workspace-name` heading per workspace (active one suffixed ` (active)`) followed by a markdown table (Project/Repository/Path/Description) of its projects, or `(empty)` if it has none"
      - id: add-project
        description: "Command `ducktools add-project <project_path> [--workspace NAME]`; calls resolver#add_project"
        arguments:
          - id: project_path
            description: path to the @DuckspecProject file to register
          - id: --workspace
            description: workspace to add to; defaults to the active workspace
      - id: remove-project
        description: "Command `ducktools remove-project <repository> [--workspace NAME]`; calls resolver#remove_project"
        arguments:
          - id: repository
            description: repository URL of the project to remove
          - id: --workspace
            description: workspace to remove from; defaults to the active workspace
  - id: mcp_server
    src: ducktools/src/ducktools/mcp_server.py
    type: @Server
    description: MCP front end over stdio, exposing the same resolver surface as cli. Implements JSON-RPC 2.0 directly — no SDK, in keeping with the zero-dependency rule — and returns the same markdown the CLI prints, so a model and a terminal see identical output; where the two drifted apart the CLI's wording is the one to match, since it is what a person reads. Each request carries its own project_path, so one server instance serves every registered project. The version it announces in `initialize` is read from the framework's own `version:` field rather than written here, after a hardcoded one told every client 0.1.0 throughout the 0.10 series.
    functions:
      - id: load_project
        description: MCP tool `load_project`; calls resolver#load_project; returns the root project file content, a Workflow section carrying the `workflow` note, the Terms table of this project's own terms, one `Terms from @<project>` table per used project whose terms are reached (left out when there are none), then Recipes, References, and Rules (project-wide) markdown tables. Primary entry point — call this first when starting work on a project.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
      - id: load_workflow
        description: "MCP tool `load_workflow`; calls resolver#load_workflow; returns the workflow term's name as a heading, the root's own `workflow:` block under `## As this project configures it`, then the same term blocks load_terms returns for it — or the error when no workflow is configured"
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
      - id: list_terms
        description: "MCP tool `list_terms`; calls resolver#list_terms; returns a markdown table with columns Term, File, and Description"
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: all
            description: pass to resolver#list_terms as include_all=true; default false
      - id: load_terms
        description: MCP tool `load_terms`; calls resolver#load_terms; returns formatted term blocks `--- @<TermName> [path] ---\n<content>` for the requested terms and each ancestor of their `extends` chains, with a References line and a `## Rules for @<TermName>` own/inherited breakdown appended for each explicitly requested term
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: term_names
            description: space-separated list of term names (without @) to load
      - id: grep_terms
        description: MCP tool `grep_terms`; calls resolver#grep_terms; returns a markdown table of Reference, Line and matching text, the reference being the `#`-path of the element the hit sits in. Same three-hits-per-term cap and 100-character cut as the CLI command.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: query
            description: substring to search for (case-insensitive)
          - id: all
            description: pass to resolver#grep_terms as include_all=true; default false
      - id: resolve_path
        description: MCP tool `resolve_path`; calls resolver#resolve_path; returns the narrowed block content for the given `Term#path` reference, a not-found message, or the ambiguity message when a segment matches more than one element.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: ref
            description: "reference in the form `TermName#segment#segment...`"
      - id: verify_project
        description: "MCP tool `verify_project`; calls resolver#verify_project; returns a markdown table of Severity, Check, Term, Location, and Message, or `no findings` when the list is empty. Unlike the CLI command it reports no exit status — the findings themselves are the result."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: unreachable
            description: pass to resolver#verify_project as unreachable=true; default false
          - id: untyped
            description: pass to resolver#verify_project as untyped=true; default false
      - id: verify_source
        description: "MCP tool `verify_source`; calls resolver#verify_source; returns a markdown table of Severity, Check, Term, Location and Message, or `no findings`. Answers only the mechanical half — that declared paths exist and named functions are present; whether the descriptions are true still requires reading the source."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
      - id: set_field
        description: "MCP tool `set_field`; calls resolver#set_field. Prefer it over editing a term file line by line: it addresses the element by `#`-path and refuses an ambiguous one."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`TermName` or `TermName#segment#segment...`"
          - id: field
            description: the field to set
          - id: value
            description: the value to set it to
      - id: add_entry
        description: "MCP tool `add_entry`; calls resolver#add_entry. Prefer it over hand-writing a new `- id:` block: the item column is derived from the slot rather than guessed, and a duplicate id is refused."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`TermName#segment...` ending at the slot to append to"
          - id: entry_id
            description: id for the new entry
          - id: fields
            description: mapping of field name to value written under the new entry
      - id: remove_element
        description: "MCP tool `remove_element`; calls resolver#remove_element. Prefer it over deleting lines by pattern: boundaries come from indentation, so nothing nested is left behind."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`TermName#segment#segment...`"
      - id: add_item
        description: "MCP tool `add_item`; calls resolver#add_item. Prefer it over hand-editing a guideline, instruction or goal list: the item is written at the list's own column and quoted when it would otherwise read as structure."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list to append to
          - id: text
            description: the text to add
          - id: after
            description: substring identifying the item to insert after; appended at the end when omitted
      - id: set_item
        description: "MCP tool `set_item`; calls resolver#set_item."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list holding the item
          - id: match
            description: substring identifying the item
          - id: text
            description: the replacement text
      - id: remove_item
        description: "MCP tool `remove_item`; calls resolver#remove_item."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list holding the item
          - id: match
            description: substring identifying the item
      - id: move_item
        description: "MCP tool `move_item`; calls resolver#move_item."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: from_ref
            description: TermName#segment... the item currently sits in
          - id: to_ref
            description: TermName#segment... to move it to
          - id: match
            description: substring identifying the item
      - id: create_term
        description: "MCP tool `create_term`; calls resolver#create_term."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: CamelCase name, which becomes both the filename and the identity
          - id: description
            description: what the term represents
          - id: extends
            description: parent term name; defaults to Term
      - id: rename_term
        description: "MCP tool `rename_term`; calls resolver#rename_term."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: old_name
            description: current term name
          - id: new_name
            description: new term name
      - id: remove_term
        description: "MCP tool `remove_term`; calls resolver#remove_term."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term to delete
      - id: term_uses
        description: "MCP tool `term_uses`; calls resolver#term_uses; returns one line per relation. Call it before changing a term to see what depends on it."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term to find references to
      - id: term_schema
        description: "MCP tool `term_schema`; calls resolver#term_schema; returns a Member/Declared-by table."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term whose effective schema to resolve
      - id: query_terms
        description: "MCP tool `query_terms`; calls resolver#query_terms; returns the matching term names and their count."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: rootless
            description: only terms declaring no `extends`; default false
          - id: extending
            description: only terms whose `extends` chain includes this term
          - id: declaring
            description: only terms declaring a member of this id
          - id: folder
            description: only terms whose path contains this fragment
      - id: slot_entries
        description: "MCP tool `slot_entries`; calls resolver#slot_entries; returns an Id/Fields table."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term holding the slot
          - id: slot
            description: the slot whose entries to list
      - id: create_workspace
        description: "MCP tool `create_workspace`; calls resolver#create_workspace"
        arguments:
          - id: name
            description: unique name for the new workspace
      - id: use_workspace
        description: "MCP tool `use_workspace`; calls resolver#use_workspace; returns the new active workspace or a not-found message"
        arguments:
          - id: name
            description: name of an existing workspace to activate
      - id: list_projects
        description: "MCP tool `list_projects`; calls resolver#list_projects; returns a `## workspace-name` heading per workspace (active one suffixed ` (active)`) followed by a markdown table (Project/Repository/Path/Description) of its projects, or `(empty)` if it has none"
      - id: add_project
        description: "MCP tool `add_project`; calls resolver#add_project"
        arguments:
          - id: project_path
            description: path to the @DuckspecProject file to register
          - id: workspace
            description: workspace to add to; defaults to the active workspace
      - id: remove_project
        description: "MCP tool `remove_project`; calls resolver#remove_project"
        arguments:
          - id: repository
            description: repository URL of the project to remove
          - id: workspace
            description: workspace to remove from; defaults to the active workspace
  - id: check-wiring
    type: @Script
    interpreter: python3
    src: ducktools/check_wiring.py
    description: "Reachability both ways round. Compares the public methods of resolver.py against the ones cli.py and mcp_server.py actually call, and the CLI commands and MCP tools the front ends define against the function entries of @DuckToolsApp#cli and @DuckToolsApp#mcp_server, failing on anything present on one side only. The first half exists because comparing the spec with the code confirms a method is *described*, not that it is *reachable*: six operations shipped in 0.10.1 and 0.10.2 fully documented and callable from neither front end. The second because verify_source only looks from the spec towards the code, so a command added without a spec entry is invisible to it: eight commands and eight tools went undescribed that way until the code was read by hand."
  - id: install-script
    type: @ShellScript
    interpreter: bash
    src: ducktools/install.sh
    description: "Classic, non-interactive, platform-agnostic installer — the scripted equivalent of the bootstrap portion of @Duckspec#install. Takes one argument, the path to clone the framework into (clones only if that path does not already exist; reuses it otherwise — idempotent). Picks the wrapper's install directory by checking which conventional bin dir is already on `$PATH` — tries `~/.local/bin`, `~/bin`, `/opt/homebrew/bin`, `/usr/local/bin` in that order (covers Linux and both Intel/Apple Silicon Homebrew layouts without any OS detection) — falling back to `~/.local/bin` if none match, and warning (non-fatally) if that fallback isn't on PATH either. Writes the same stdlib wrapper script described in @Duckspec#install there and updates `ducktools.src`/`ducktools.bin` in `~/.duckspec/settings.json` — reusing resolver#_load_settings/_save_settings via an inline `python3` call rather than reimplementing JSON handling in bash, so the schema can never drift between the two. Creates a `default` workspace and activates it only if no workspace exists yet; never touches an existing one. No `git`/`python3` are new requirements — both are already implied by working with this framework at all."
  - id: check-operations
    type: @Script
    interpreter: python3
    src: ducktools/check_operations.py
    description: Exercises every public resolver method against a throwaway project built in a temp directory, then runs every CLI command and every MCP tool once over the same project — the stdio server included, fed an initialize and a tools/list — and fails naming the ones whose result was wrong, and any method, command or tool it did not run. Complements check-wiring, which proves a method is reachable but never calls it: the operations that write to term files shipped untested, and every defect found in them so far was found by hand. The front-end half exists because a method can be right while what a reader sees is not: load_project returned a pointer to the workflow that neither front end printed. Redirects the settings path at import so the workspace methods cannot touch the real registry.
