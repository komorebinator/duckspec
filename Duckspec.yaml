description: A spec-driven development framework for building complex projects with AI.
extends: "@DuckspecProject"
terms_folder: duckspec
goals:
  - Standardize how requirements and @Term definitions are written across projects
  - Reduce the noise models introduce into the development process
  - Provide tools for describing and navigating project structure
  - Simplify repetitive development tasks
  - Describe a system's parts, how they connect and the behaviour it promises in terms that survive a change of language, framework or platform
  - Describe how a change reaches users — review, merge, release, delivery — independently of the version control, review system or tracker in use
version: 1.1.0
repository: https://github.com/komorebinator/duckspec
settings:
  src: .
  readme: README.md
workflow:
  type: "@DuckspecWorkflow"

guidelines:
  - "Every change starts in the spec, not the code. Capture the requirement — a new behavior, a fix, a rename — in the relevant @Term first, refining its existing description/properties/functions rather than replacing them, so the spec keeps accumulating the complete, current picture across every task instead of losing what earlier tasks already established. Only once the spec reflects the change, invoke @Software#recipes#build to bring the code in line with it — code is produced by build, not maintained in parallel to it. @DuckspecProject#recipes#learn and #assess_coverage exist to reconcile gaps discovered after the fact; they are recovery tools for catching up, not the default path for planned changes."
  - "A spec is read alongside the repository, not instead of it, so it holds what the repository does not say for itself. It must let a reader understand how the project works without opening every file: which parts exist, what each is for, how they connect — what calls, builds, installs, triggers or reads what — how the main flows run through them, and the behaviour the project promises its users, which is written as each @Software's `behaviour` (see @Behaviour). Beyond that map it holds what no file states: why a choice was made, the constraints a change must respect or it brings back a known failure, and the intent behind a deliberate deviation from upstream when the file does not make it evident. What a file already says plainly stays only in that file: lists, versions, values, formats, flags, styling, variable names, the steps of a short script. Restating it does not make a spec more complete, only less reliable — every edit to the file then needs a second one, and the copy starts to drift the first time it is missed — so changing such data is a change made in the file itself. Parts are described by what they are about, not by the file that happens to carry them, so one concern spread over several files is still explained once."
  - "A spec describes what the project is, plus the change in hand. While a change is being made the terms run ahead of the code — a spec-first workflow writes it there before @Software#recipes#build — and that is the one way a spec says what the code does not do yet. Work that waits longer is a plan or a known defect, and it goes to the tracker the project's @DuckWorkflow names (@DuckWorkflow#properties#tracker), not into a description or a scenario marked as not kept: a planned feature written into a term reads as what the software does, a reader cannot tell it from the rest, and no tracker ever lists it. A term may point at an open issue where a reader needs to know the gap is known — by its number, or a task's id — but the plan itself lives in the issue."
  - "Removing text from a spec is held to a higher bar than adding it: an extra line costs little, while a lost reason or a lost connection between parts costs understanding that nothing else records. Before trimming a term, write down the questions it answers about how the project works — what the part is for, what it connects to and how, what flows through it, what behaviour it promises, why anything non-obvious is the way it is — and after trimming, check that each one is still answered, by the term itself or by a path it names. Values, lists and formats the trimmed text copied from a file are not lost; they are still in the file. When it is unclear whether a detail is needed for that understanding, keep it. A sentence that carries a reason — because, otherwise, without this — is never simply dropped: the reason stays, in the place it belongs. A note that some code looks unused or mistaken is dropped only once that work is tracked in the project's @DuckWorkflow or the author has said it is not needed. A named element another term points at is a connection even when it looks trivial on its own, and that term may live in another project: after trimming, invoke @DuckToolsApp#components#resolver#functions#verify_project() on this project and on every registered project that reaches it through `uses:`, and treat a reference to a removed element as a lost connection to restore, not a path to delete. Whoever trims a term shows the author, before writing, the questions checked and what is being removed, each item marked as left to its file, realization, or moved elsewhere."
  - "A fact has one home in the whole spec, not only within one term. When several terms rest on the same fact — a trigger chain, a temporary workaround, a version two dependencies must share — state it fully in the term it belongs to and let the others name it by `@<TermName>#<path>` with at most a clause of context. Retold copies are written at different times from different angles, drift apart, and leave a reader unable to tell which one is current."
  - All documentation must be written in English.
  - Prefer `@<TermName>#path#to#element` references over concrete CLI commands, MCP tool names, or other interface-specific syntax in descriptions, recipes, and guidelines; this keeps documentation interface-agnostic and lets the executor choose the appropriate interface. Use concrete syntax only when no term reference exists or when the exact detail is essential.
  - Each `.yaml` file defines exactly one term following the @Term format.
  - "A @Term is identified by its filename, written in CamelCase with no spaces (e.g. `UserInterface.yaml` is @UserInterface). That filename is what `@<TermName>` references resolve against; the `name:` field inside the file is a short human-readable label, not the identity."
  - "Every `@<Name>` mention in a @Term file must resolve to a term reachable in the project — define it locally, or bring the project that owns it in via `uses:`. There is no exemption for examples: an unresolvable name in documentation is as much a defect as one in a real reference, because a reader cannot tell the two apart. When documenting the reference syntax itself, write generic stand-ins in angle brackets (`@<TermName>`, `@<recipe_name>`) — the same substitution notation recipes already use for arguments, and deliberately outside the reference grammar so it never reads as a reference. Prefer a real term over a stand-in wherever one fits the example."
  - "A @Term exists only if it changes what is written or checked — it is what the tools or the recipes rely on (@Software, @Function, @Behaviour, @DuckWorkflow), it asks for what the files do not say (@Secret: where it is kept and who reads it), it carries rules for its kind of thing, or it holds operations (@Git, @GitHub). A term that would only name a concept — an API, a dialog, a singleton — adds nothing a reader does not already know, and a component of that kind says what it is in its `type:` as plain text. The same test decides whether a project creates a term of its own: a kind of part that recurs, and shares fields or rules."
  - Avoid using the word "extends" in a description in its everyday English sense when it could be confused with the formal `extends:` field — prefer synonyms like "built on", "managed by", "implements" to avoid implying a false inheritance relationship or referencing a term that does not exist.
  - "Before acting on the change in hand — recording it, sending it, releasing it, or proposing what to do next — Invoke @DuckToolsApp#components#resolver#functions#load_workflow() and find where the change stands by evaluating its steps' `when`. A request to take the change somewhere names how far it should travel: to record it locally (\"commit\", \"commit locally\", \"just commit\"), to send it where it gets accepted (\"submit\", \"push\", \"send\", \"open a PR\"), to publish it (\"release\", \"release it\"). Advance it one step at a time, each by that step's own `operation`, up to the step the request names and no further — a request to commit is not permission to push, and a request to send is not permission to merge or release. Never run git or a hosting CLI by hand to do what a step's operation does. Completing a task, permissive phrasing (\"we can push\", \"it's fine to commit\"), or confirmation that changes look good are not requests to move anything. When proposing a next step rather than answering a request, propose the step after the one the change is at: a local commit leaves the work in one copy on one machine, and sending it is what removes that risk."
  - Never manually edit the `version` field in any @DuckspecProject file. It is set only by @DuckspecProject#recipes#prepare_release, which asks for the bump.
  - "Never save information to external memory; record it in the spec instead, by suggesting changes to the @DuckspecProject configuration or term files. The exception is what concerns only this machine's environment or this particular user — where things are installed, how this executor reaches the tools, one person's own preferences: a spec is shared by everyone who works on the project, so that belongs in the executor's own memory or instruction files, the way @DuckToolsApp#lists#installation-methods records it"
  - When the user's request concerns something not covered by the currently loaded project(s) — a sub-project, an extension, a component referenced only by name or by a `references:` entry — check @DuckToolsApp#components#resolver#functions#list_projects() for a matching registered project before assuming it's out of scope or asking the user for a path. If found, invoke @DuckToolsApp#components#resolver#functions#load_project() on it explicitly. This is model-side behavior only — the resolver itself never auto-loads it as a side effect of loading another project.
  - "Read and edit @Term files through @DuckToolsApp#components#resolver, not through shell commands. Its operations know the format — they resolve `#`-paths, refuse an ambiguous one, and edit at the element's own column — where grep and sed see only lines and silently produce damage that still looks like valid YAML. The shell stays correct for what the resolver does not cover: source code, git, and bulk or analytical passes across many files at once. When a spec question or edit reaches for the shell only because no resolver operation exists for it, name the missing operation in the reply — a gap in @DuckToolsApp is a defect to report, not a standing reason to keep using the shell."
lists:
  - id: file-categories
    items:
      - id: code
        description: executable logic; covered by a component whose `type:` says what it is (see @SoftwareComponent#properties#type)
      - id: config
        description: declarative configuration or data file (JSON, YAML, TOML, INI, .desktop, systemd unit, GSchema override, polkit rule, etc.); maps to @ConfigFile
      - id: asset
        description: images, icons, fonts, compiled binaries — record path and purpose only
      - id: meta
        description: .gitignore, LICENSE, lockfiles, README already in settings.readme — record existence, skip
  - id: prerequisites
    description: "What a machine needs before @Duckspec#recipes#install can run. Only what is needed, never how to get it: the package manager, installer or store differs by operating system and by machine, so the assistant installing duckspec works that out with the user."
    items:
      - id: git
        description: clones the framework and is what @Duckspec#recipes#update pulls with
      - id: bash
        description: runs @DuckToolsApp#components#install-script; on Windows the Git Bash that comes with Git for Windows serves
      - id: python
        description: Python 3.10 or newer, as `python3` or `python` — @DuckToolsApp runs on the standard library alone, so nothing beyond the interpreter is installed
  - id: install-surface
    description: What installing duckspec depends on. A change that touches any of it is run through @Duckspec#recipes#check_install before it reaches `main`, since @Duckspec#recipes#install clones `main` and a new user gets whatever is there that moment; a change that touches none of it skips that check, which costs whole runs of a model.
    items:
      - id: recipe
        description: "@Duckspec#recipes#install and @Duckspec#lists#prerequisites — what the assistant follows"
      - id: script
        description: "@DuckToolsApp#components#install-script, the script the recipe runs"
      - id: methods
        description: "@DuckToolsApp#recipes#install and @DuckToolsApp#lists#installation-methods — how ducktools is wired into the executor, and what is written to its instruction files"
      - id: settings
        description: "@DuckToolsApp#components#settings and the resolver functions that write it at install time: @DuckToolsApp#components#resolver#functions#_load_settings, @DuckToolsApp#components#resolver#functions#_save_settings and @DuckToolsApp#components#resolver#functions#_register_framework"
      - id: cli-entry
        description: "@DuckToolsApp#components#cli#functions#help, @DuckToolsApp#components#cli#functions#list-projects and @DuckToolsApp#components#cli#functions#load-project — the commands the recipe sends a new user through before the MCP tools exist"
      - id: readme
        description: the Installation section of `README.md` — the sentence a new user sends their assistant
software:
  - "@DuckToolsApp"
recipes:
  - id: install
    description: Bootstraps the shared @Duckspec/@DuckToolsApp installation for this executor, then offers to bring in an existing project or start a new one — never sets a specific project's own metadata itself; that is the job of @Duckspec#recipes#create_project and @Duckspec#recipes#import_project
    instructions:
      - "Read `~/.duckspec/settings.json` (treat a missing file as `{}`). If `ducktools.src` points to an existing directory and `ducktools.bin` to an existing file, duckspec looks installed on this machine: say so, skip the steps up to and including the run of the script — prerequisites, both questions, the clone, the audit, the script — and continue from the verification below, with the wrapper at `ducktools.bin` and the clone in the parent of `ducktools.src`. First look at `git status` in that clone: it was audited when it was installed, and changes nobody made through @Duckspec#recipes#update are not what was audited, so name them to the user and go on only with their go-ahead. Then follow this recipe as that clone's `Duckspec.yaml` holds it, since that is what runs. The clone, the wrapper and the settings are not changed on this path. When the clone is behind its remote — compare its HEAD with the remote's `refs/heads/<branch>` for the branch it tracks, which `git ls-remote origin` lists without changing the clone; other refs in that listing, such as the remote's own `refs/remotes/…`, say nothing about this clone — offer @Duckspec#recipes#update, which audits what it pulls. What the installation method writes into the executor — its MCP registration and its instruction file — is still checked and brought up to date by @DuckToolsApp#recipes#install below, since that is where an installation most often falls behind. The verification itself is not skipped either: two paths that exist do not show that the command runs or that the framework is registered, and a half-removed installation passes that test"
      - Check that everything in @Duckspec#lists#prerequisites is available. For anything missing, tell the user what is needed and offer to install it the way this machine installs software; the way differs by operating system and by machine, so work it out with the user rather than assuming one, and install only with their go-ahead
      - "Ask the user for the path of the folder to clone the framework into — the clone itself, not the folder that will hold it; say so explicitly, and suggest `duckspec` inside the folder where they keep their other projects. It must not exist yet, or must already be a clone of the framework: @DuckToolsApp#components#install-script refuses any other existing folder rather than install into it"
      - Clone `https://github.com/komorebinator/duckspec.git` into that folder — unless it already holds a clone — and note the commit checked out. The URL is given here because ducktools is not installed yet, so nothing can resolve a reference to the repository for you
      - "Before running anything from the clone, make sure the whole repository is safe. It is third-party code the user is about to run with their own permissions, and third-party instructions you are about to follow, so every file in it counts — code and term files alike. How to audit it is yours to decide; the goal is to be able to tell the user, with reasons, that nothing in it works against them or their machine. Report what was audited (the commit) and what was found, in plain terms. On any concern, stop and get their explicit go-ahead; otherwise proceed. Nothing may change the clone between this audit and the run below — no pull, no checkout — so what runs is what was audited. For the same reason, follow this recipe from here on as the clone's own `Duckspec.yaml` holds it, not as the copy you started from: the clone's is the one audited, and when the two differ, tell the user what changed between them"
      - Ask the user where to put the `ducktools` command, as a choice between options with one marked recommended. Offer the candidate directories @DuckToolsApp#components#install-script checks — the list in `ducktools/install.sh` in the clone is the reference, so the two never disagree — that exist on this machine or, inside the home directory, could be created, saying of each whether it is on PATH and writable by the user; recommend the first that is both. On Linux and macOS that is also the one the script would pick on its own; on Windows it may not be, because "on PATH" there means the user's Windows PATH that cmd, PowerShell and the executor see, while the script sees Git Bash's — and Git Bash adds `~/bin` to its own PATH by itself, which proves nothing about the others. When no candidate qualifies — common on a fresh machine, and on Windows — recommend `~/.local/bin` on Linux and macOS, or `%USERPROFILE%\bin` on Windows, and tell the user how to put it on PATH for their shell or, on Windows, in their user environment variables. Accept any other directory the user names
      - Run @DuckToolsApp#components#install-script — `ducktools/install.sh` in the clone; the file is named here because ducktools is not installed yet, so nothing can resolve the reference for you — with bash, giving it the clone path and the chosen bin directory; it finds the clone already in place and only wires it up. Pass both as paths bash understands — on Windows `$HOME/bin` or `/c/Users/<name>/bin`, never `%USERPROFILE%\bin`, which bash does not expand and would take as a relative folder of that name, and not `~/bin` inside quotes, where bash leaves the `~` as it is
      - "Verify the installation — confirm that the wrapper (the file the script reports, or `ducktools.bin` when duckspec was already installed) exists and is executable (on Windows, also the `ducktools.cmd` beside it), and that its list-projects command runs without error and shows @Duckspec registered in the active workspace, which every project made afterwards needs (see @DuckToolsApp#components#resolver#functions#_register_framework). When this fails on an installation found already in place, it is broken: tell the user what failed and offer to run the skipped steps, which reuse the clone and write the wrapper and the settings again. From here until the MCP tools appear in a new session, run every @DuckToolsApp#components#resolver operation this recipe and the ones it leads to name through the wrapper's command line instead; its `help` command names the operation each command runs"
      - "Invoke @DuckToolsApp#recipes#install(method=<method>) — `claude` when this executor is Claude Code, `mcp` for any other executor that supports MCP, and offer `memory` when it supports neither. Claude Code needs its own method: it does not read AGENTS.md, so without the section that method writes into its global instructions a new session in a duckspec project has no way to know the project must be loaded first"
      - "Load the clone's `Duckspec.yaml` through @DuckToolsApp#components#cli#functions#load-project with the wrapper verified above — not through MCP tools this session may already have: a server registered a moment ago is usually not reachable until the next session, since most executors start MCP servers only when a session begins, and tools that are reachable may belong to an earlier installation rather than to the one just checked. That is no reason to stop or ask for a restart here — tell the user the MCP tools will appear in their next session and carry on, since a restart now would lose the rest of this recipe. Confirm real content comes back, then use it to briefly summarize Duckspec's goals and top guidelines for the user — enough to orient them, not the full rules table"
      - Ask whether to bring in an existing project, start a new one, or leave it for now; Invoke @Duckspec#recipes#import_project() or @Duckspec#recipes#create_project() accordingly, or end here — duckspec is installed either way
  - id: update
    description: Updates @Duckspec to the latest version — a single `git pull` in the shared clone, immediately available to every project that references it
    instructions:
      - Read `ducktools.src` from `~/.duckspec/settings.json`; if unset, tell the user @Duckspec is not installed via the workspace model and stop
      - Note the framework's `version` and the commit checked out in the clone before pulling
      - Run `git pull` in the clone's repository root (the parent of `ducktools.src`)
      - "Make sure what the pull brought is safe before anything runs from the clone again — every `ducktools` command and the MCP server run its code, and its term files steer you. Hold the changes since the noted commit to the same goal @Duckspec#recipes#install sets for the whole repository: that nothing in them works against the user or their machine. Report what changed and what was found; on any concern, stop, tell the user, and offer to reset the clone to the noted commit"
      - "If the version changed, read the notes of every released version after the old one up to the new one, oldest first, through the recipe named by `release_notes` on @DuckspecWorkflow. Tell the user what changed, and carry out — or, for projects not in hand, report — whatever each set of notes says a consuming project must do to move onto it. The pull has already delivered the new framework; the notes are the only place that says what it now asks of its consumers"
      - Invoke @DuckspecProject#recipes#validate()
  - id: create_project
    description: Creates a minimal @DuckspecProject term file — only what's required plus whatever context supplies — and registers it in the active workspace. Repository, workflow and everything else are deferred to @DuckspecProject#recipes#assess_coverage, which has real project context to fill them in correctly instead of guessing now.
    arguments:
      - id: context_path
        description: optional path to the root of existing source the project is being created for (e.g. passed by @Duckspec#recipes#import_project); the source root to confirm with the user, and context to infer the identifier, description and README from
    instructions:
      - "Ask the user where the project's source lives — for a new project, the folder to create it in; with `context_path`, confirm that it is the root — and where the @DuckspecProject term file should go, recommending a `spec/` folder at the root of that source: it is the layout the default `settings.src` of `..` assumes, and it keeps the spec in the repository it describes. Never pick either location on the user's behalf"
      - "Infer the project's identifier and description from context (`context_path`'s folder name, an existing README, etc.); ask the user to confirm or correct them. The identifier is CamelCase and becomes the filename, which is the project's identity."
      - "If a file named `<ProjectName>.yaml` or a folder named after the project already sits where the project file is to go, stop and ask the user before writing anything: the project may already have a spec, and creating over it would destroy it"
      - Create the source folder if it does not exist yet — only now, once nothing found above has stopped the recipe, so a run the user calls off leaves nothing behind
      - "Ask the user for `name` — a short human-readable name for the project, the one a person would say out loud. It is not required and nothing breaks without it, but a project is exactly the case where a display name earns its place over the identifier: `Borshevik Linux` against `Borshevik`, `Duckspec Framework` against `Duckspec`. Skip it only if the user says the identifier already reads the way they want."
      - "Ask the user for `goals` — what this project is trying to achieve. This is the one required field that can never be inferred, so always ask, even when everything else came from context."
      - Set `terms_folder` to a subfolder named after the project, located next to the @DuckspecProject term file (e.g. if the file is `spec/MyApp.yaml`, set `terms_folder` to `MyApp/`)
      - If a README or other description file exists, set `settings.readme` to its path (relative to the @DuckspecProject term file)
      - Set `settings.src` to the source root, relative to the @DuckspecProject term file's location, unless it is the default `..`. Everything that reads the source — @DuckspecProject#recipes#update_readme, @DuckspecProject#recipes#assess_coverage, every `src:` — resolves against it, so with the wrong root they all look one folder off
      - "Create the @DuckspecProject term file named `<ProjectName>.yaml` — the filename is the project's identity — with only `name` (when the user gave one), `description`, `extends` set to `@DuckspecProject`, `goals`, `terms_folder`, `uses` holding the one entry `https://github.com/komorebinator/duckspec`, and `settings` where the steps above set any; leave `repository`, `workflow`, and `software` unset entirely. `extends` is what makes the file a @DuckspecProject: without it the project has none of the recipes — `load`, `assess_coverage` — that @Duckspec#recipes#import_project invokes on it next. Three details of the format are easy to get wrong and fail silently: `uses` is a list even with one entry, since a bare value is not read as one and the framework drops out of the project; list items are indented under their key, the only form @DuckToolsApp reads for most lists; and a value starting with `@` is quoted, since YAML reserves the character. The file reads like `extends: \"@DuckspecProject\"` on one line, and `uses:` followed by `  - https://github.com/komorebinator/duckspec` on the next"
      - Create the terms folder on disk at the path set in `terms_folder`
      - Invoke @DuckToolsApp#components#resolver#functions#verify_project(project_path=<path to the created file>) and fix whatever it reports before going on — a mistake in the file fails silently everywhere else, and this is where it shows
      - "Invoke @DuckspecProject#recipes#update_readme() — unless `context_path` was given: then there is existing source the spec does not describe yet, and the caller invokes it once the spec does, so the README is written from the project rather than from its one-line description"
      - Invoke @DuckspecProject#recipes#update_agents() — so AGENTS.md exists from the moment the project does, before @DuckspecProject#recipes#assess_coverage ever runs against it
      - Invoke @Workspace#recipes#add_project(project_path=<path to the created file>) on the active workspace, so the project can be named by its identifier from now on — in AGENTS.md, in every command, from any directory. It has no `repository` yet, so it is registered under its file's `file://` URI; @DuckspecProject#recipes#assess_coverage registers it again under its URL once one is found, which replaces that entry. Report the created file's path back to the caller
  - id: import_project
    description: Brings an existing codebase under Duckspec management — creates a minimal project pointed at it via @Duckspec#recipes#create_project, then runs a full coverage analysis to fill in the rest
    arguments:
      - id: source_path
        description: path to the existing project's source folder
    instructions:
      - Ask the user for `source_path` if not provided
      - Invoke @Duckspec#recipes#create_project(context_path=<source_path>)
      - Invoke @DuckspecProject#recipes#assess_coverage() on the created project
      - Invoke @DuckspecProject#recipes#update_readme() on the created project — after the coverage analysis, not before, so it has the project's parts and how it is installed to work from; where the codebase already has a README, this only checks it
  - id: verify_consumers
    description: Verifies every registered project that uses @Duckspec against the framework as it stands in this working copy — the check that has to pass before anything reaches main_branch, because main_branch is what those projects receive.
    instructions:
      - "Invoke @DuckToolsApp#components#resolver#functions#list_projects() and keep every project whose `uses:` reaches this repository — by its repository URL, directly or through a sub-project"
      - "Invoke @DuckToolsApp#components#resolver#functions#verify_project() on each, from its root project file. Sub-projects are validated as part of the project that uses them, not opened on their own: a sub-project may name its siblings' and its parent's terms, and resolves only in the context the root assembles"
      - "Every consumer must verify clean, and any finding blocks the push: fix the consumer in the same piece of work, or change the framework so it no longer breaks it. A registered consumer resolves the framework through the workspace, which on the machine it is developed on points at this working copy — so what is checked here is exactly what the consumers are already reading, and there is no older state to compare with"
  - id: check_install
    description: Runs @Duckspec#recipes#install the way a new user's assistant would, against the commits of this local repository and in a throwaway home, twice — on a machine with nothing installed and on one where duckspec already is — and checks both runs. @DuckToolsApp#tests#install checks the script alone; this checks what no command can tell — whether an assistant that has never seen the project can follow the recipe, and what it does to the files of the user it installs for.
    instructions:
      - Make a throwaway home directory, and record how to tell afterwards that the real one was not touched — checksums of `~/.duckspec/settings.json`, of the installed wrapper and of the executor's own instruction file, and the MCP servers its configuration lists. In both runs every command is given that directory as HOME, and every file the recipe means under `~` is the one inside it
      - "Run the recipe in a context that has not seen this conversation — a fresh session or subagent where the executor provides one; a run that already knows the answers tests nothing. Give it: the user's request worded as the Installation section of `README.md` words it; the throwaway home and the rule above; this local repository as the place to read the recipe from and to clone, in place of the repository URL, since it holds the commits not on `main` yet — a clone takes commits only, which is why this check comes after the change is committed; an answer for every question the recipe asks — a clone folder and a bin directory inside the throwaway home, approval of each change shown, and \"leave it for now\" at the end; and the request to report every step with its commands, every question as worded, and, quoted, every place where the recipe was unclear, contradictory or wrong. It uses no tool of the real installation. Where the executor's own command for registering an MCP server cannot reach the throwaway home, the run edits the equivalent file there and says so"
      - "Before the second run, add two sections to the instruction file the first run wrote (for the `claude` method, `.claude/CLAUDE.md` in the throwaway home): one of the user's own preferences, and one that reads like an earlier install's entry for a single project. Then run the recipe again in another fresh context, over the installation the first run left, with the same answers"
      - "Check both runs against the recipe from the files, not from the reports: the real home is unchanged; after the first run the wrapper runs `list-projects` and shows @Duckspec, the MCP registration names the wrapper by its absolute path and the server answers `tools/list`, and the instruction file has one duckspec section; after the second nothing is duplicated, the duckspec section is the same one, and both added sections are still there word for word"
