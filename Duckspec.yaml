description: A spec-driven development framework for building complex projects with AI.
extends: @DuckspecProject
terms_folder: duckspec
goals:
  - Standardize how requirements and @Term definitions are written across projects
  - Reduce the noise models introduce into the development process
  - Provide tools for describing and navigating project structure
  - Simplify repetitive development tasks
startup:
  - load
uses:
  - duckspec/DuckArch.yaml
  - duckspec/DuckFlow.yaml
  - ducktools/DuckTools.yaml
version: 0.12.0
repository: https://github.com/komorebinator/duckspec
settings:
  readme: README.md
workflow:
  type: @DuckspecWorkflow

ai_instructions:
  - "Before acting on the change in hand — recording it, sending it, releasing it, or proposing what to do next — Invoke @DuckToolsApp#resolver#load_workflow() and find where the change stands by evaluating its steps' `when`. A request to take the change somewhere names how far it should travel: to record it locally (\"commit\", \"commit locally\", \"just commit\"), to send it where it gets accepted (\"submit\", \"push\", \"send\", \"open a PR\"), to publish it (\"release\", \"release it\"). Advance it one step at a time, each by that step's own `operation`, up to the step the request names and no further — a request to commit is not permission to push, and a request to send is not permission to merge or release. Never run git or a hosting CLI by hand to do what a step's operation does. Completing a task, permissive phrasing (\"we can push\", \"it's fine to commit\"), or confirmation that changes look good are not requests to move anything. When proposing a next step rather than answering a request, propose the step after the one the change is at: a local commit leaves the work in one copy on one machine, and sending it is what removes that risk."
  - "Never manually edit the `version` field in any @DuckspecProject file. It is set only by @DuckspecProject#prepare_release, which asks for the bump."
  - Never save information to external memory. Instead, suggest changes to the @DuckspecProject configuration or term files.
  - "When the user's request concerns something not covered by the currently loaded project(s) — a sub-project, an extension, a component referenced only by name or by a `references:` entry — check @DuckToolsApp#resolver#list_projects() for a matching registered project before assuming it's out of scope or asking the user for a path. If found, invoke @DuckToolsApp#resolver#load_project() on it explicitly. This is model-side behavior only — the resolver itself never auto-loads it as a side effect of loading another project."
  - "Read and edit @Term files through @DuckToolsApp#resolver, not through shell commands. Its operations know the format — they resolve `#`-paths, refuse an ambiguous one, and edit at the element's own column — where grep and sed see only lines and silently produce damage that still looks like valid YAML. The shell stays correct for what the resolver does not cover: source code, git, and bulk or analytical passes across many files at once. When a spec question or edit reaches for the shell only because no resolver operation exists for it, name the missing operation in the reply — a gap in @DuckToolsApp is a defect to report, not a standing reason to keep using the shell."
guidelines:
  - "Every change starts in the spec, not the code. Capture the requirement — a new behavior, a fix, a rename — in the relevant @Term first, refining its existing description/properties/functions rather than replacing them, so the spec keeps accumulating the complete, current picture across every task instead of losing what earlier tasks already established. Only once the spec reflects the change, invoke @Software#build to bring the code in line with it — code is produced by build, not maintained in parallel to it. @DuckspecProject#learn and #assess_coverage exist to reconcile gaps discovered after the fact; they are recovery tools for catching up, not the default path for planned changes."
  - All documentation must be written in English.
  - Prefer `@<TermName>#path#to#element` references over concrete CLI commands, MCP tool names, or other interface-specific syntax in descriptions, recipes, and guidelines; this keeps documentation interface-agnostic and lets the executor choose the appropriate interface. Use concrete syntax only when no term reference exists or when the exact detail is essential.
  - Each `.yaml` file defines exactly one term following the @Term format.
  - "A @Term is identified by its filename, written in CamelCase with no spaces (e.g. `UserInterface.yaml` is @UserInterface). That filename is what `@<TermName>` references resolve against; the `name:` field inside the file is a short human-readable label, not the identity."
  - "Every `@<Name>` mention in a @Term file must resolve to a term reachable in the project — define it locally, or bring the project that owns it in via `uses:`. There is no exemption for examples: an unresolvable name in documentation is as much a defect as one in a real reference, because a reader cannot tell the two apart. When documenting the reference syntax itself, write generic stand-ins in angle brackets (`@<TermName>`, `@<recipe_name>`) — the same substitution notation recipes already use for arguments, and deliberately outside the reference grammar so it never reads as a reference. Prefer a real term over a stand-in wherever one fits the example."
  - Sub-projects of @Duckspec itself are named `Duck` + what they do (e.g. `DuckArch`, `DuckUI`), and the word "spec" does not appear in their names. This is the framework's own naming, not a rule for projects built with it.
  - A gap requiring a new @Term exists when the closest available @DesignPattern would lose significant architectural information — using it feels like a stretch that hides the real concept rather than describing it.
  - Avoid using the word "extends" in a description in its everyday English sense when it could be confused with the formal `extends:` field — prefer synonyms like "built on", "managed by", "implements" to avoid implying a false inheritance relationship or referencing a term that does not exist.
lists:
  - id: file-categories
    items:
      - id: code
        description: executable logic; maps to a @DesignPattern
      - id: config
        description: declarative configuration or data file (JSON, YAML, TOML, INI, .desktop, systemd unit, GSchema override, polkit rule, etc.); maps to @ConfigFile
      - id: asset
        description: images, icons, fonts, compiled binaries — record path and purpose only
      - id: meta
        description: .gitignore, LICENSE, lockfiles, README already in settings.readme — record existence, skip
  - id: code-patterns
    items:
      - id: ShellScript
        description: bash/sh/zsh scripts
      - id: Application
        description: program entry points
      - id: View
        description: windows, screens, dialogs, and modal overlays
      - id: Page
        description: named pages within a stack or tab view
      - id: UserInterface
        description: a module that owns and composes multiple @View instances
      - id: Extension
        description: plugins and add-ons
      - id: Pipeline
        description: CI/CD workflows triggered by events (push, cron, webhook)
      - id: ContainerImage
        description: Dockerfiles or Containerfiles
      - id: Singleton
        description: shared service or utility modules
      - id: Server
        description: daemons
      - id: Script
        description: other scripting files
recipes:
  - id: install
    description: Bootstraps the shared @Duckspec/@DuckTools installation for this executor, then offers to bring in an existing project or start a new one — never sets a specific project's own metadata itself; that's @Duckspec#create_project/#import_project's job
    instructions:
      - "Read `~/.duckspec/settings.json` (treat a missing file as `{}`). If `ducktools.src` or `ducktools.bin` is unset or points to a missing file: ask the user which folder to clone the framework into (suggest a directory alongside their other projects)"
      - "Fetch @DuckToolsApp#install-script's raw content without executing it, and read it in full. Check for anything unexpected — network access beyond the documented `git clone`, obfuscated code, writes outside the clone path / the chosen bin directory / `~/.duckspec`. If anything looks concerning, explain the specific concern in plain terms and get the user's explicit go-ahead before continuing; otherwise proceed without asking"
      - Run @DuckToolsApp#install-script with the chosen folder as its one argument
      - Verify it worked — confirm the wrapper file it reports exists and is executable, and that invoking it (e.g. its list-projects command) runs without error
      - "If this executor supports MCP: offer to register the ducktools MCP server, preferring a user-level/global registration over a per-project one wherever the executor's own tooling allows it — the exact registration mechanism is executor-specific, use whatever this assistant provides"
      - "Verify the MCP connection by invoking its `load_project` (or equivalent) tool against the just-cloned `Duckspec.yaml`; confirm real content comes back, then use that same content to briefly summarize Duckspec's goals and top guidelines/ai_instructions for the user — enough to orient them, not the full rules table"
      - "Ask whether to bring in an existing project or start a new one; Invoke @Duckspec#import_project() or @Duckspec#create_project() accordingly"
  - id: update
    description: Updates @Duckspec to the latest version — a single `git pull` in the shared clone, immediately available to every project that references it
    instructions:
      - Read `ducktools.src` from `~/.duckspec/settings.json`; if unset, tell the user @Duckspec is not installed via the workspace model and stop
      - Note the framework's `version` in the clone before pulling
      - Run `git pull` in the clone's repository root (the parent of `ducktools.src`)
      - "If the version changed, read the notes of every released version after the old one up to the new one, oldest first, through the recipe named by `release_notes` on @DuckspecWorkflow. Tell the user what changed, and carry out — or, for projects not in hand, report — whatever each set of notes says a consuming project must do to move onto it. The pull has already delivered the new framework; the notes are the only place that says what it now asks of its consumers"
      - Invoke @DuckspecProject#validate()
  - id: create_project
    description: Creates a minimal @DuckspecProject term file — only what's required plus whatever context supplies. Repository, workflow, workspace registration, and everything else are deferred to @DuckspecProject#assess_coverage, which has real project context to fill them in correctly instead of guessing now.
    arguments:
      - id: context_path
        description: optional path to existing source the project is being created for (e.g. passed by @Duckspec#import_project); used only to help infer the identifier, description and README, not to set `settings.src` — that's the caller's job
    instructions:
      - Ask the user in which folder the @DuckspecProject term file should be stored, if not already implied by `context_path`
      - "Infer the project's identifier and description from context (`context_path`'s folder name, an existing README, etc.); ask the user to confirm or correct them. The identifier is CamelCase and becomes the filename, which is the project's identity."
      - "Ask the user for `name` — a short human-readable name for the project, the one a person would say out loud. It is not required and nothing breaks without it, but a project is exactly the case where a display name earns its place over the identifier: `Borshevik Linux` against `Borshevik`, `Duckspec Framework` against `Duckspec`. Skip it only if the user says the identifier already reads the way they want."
      - "Ask the user for `goals` — what this project is trying to achieve. This is the one required field that can never be inferred, so always ask, even when everything else came from context."
      - Set `terms_folder` to a subfolder named after the project, located next to the @DuckspecProject term file (e.g. if the file is `myapp/MyApp.yaml`, set `terms_folder` to `MyApp/`)
      - If a README or other description file exists, set `settings.readme` to its path (relative to the @DuckspecProject term file)
      - "Create the @DuckspecProject term file named `<ProjectName>.yaml` — the filename is the project's identity — with only `name` (when the user gave one), `description`, `goals`, `terms_folder`, and `uses` set to `https://github.com/komorebinator/duckspec`; leave `repository`, `workflow`, and `software` unset entirely"
      - Create the terms folder on disk at the path set in `terms_folder`
      - Invoke @DuckspecProject#create_readme() if no readme exists yet, else @DuckspecProject#update_readme()
      - Invoke @DuckspecProject#update_agents() — so AGENTS.md exists from the moment the project does, before @DuckspecProject#assess_coverage ever runs against it
      - "Report the created file's path back to the caller. This project is not yet registered in any workspace — it has no `repository` for @Workspace#add_project to key on. @DuckspecProject#assess_coverage registers it once one is found."
  - id: import_project
    description: Brings an existing codebase under Duckspec management — creates a minimal project pointed at it via @Duckspec#create_project, then runs a full coverage analysis to fill in the rest
    arguments:
      - id: source_path
        description: path to the existing project's source folder
    instructions:
      - Ask the user for `source_path` if not provided
      - Invoke @Duckspec#create_project(context_path=<source_path>)
      - "Set `settings.src` on the created project to `source_path`, expressed relative to the @DuckspecProject file's location (skip this if it already resolves to the default `..`)"
      - Invoke @DuckspecProject#assess_coverage() on the created project
  - id: verify_consumers
    description: Verifies every registered project that uses @Duckspec against the framework as it stands in this working copy — the check that has to pass before anything reaches main_branch, because main_branch is what those projects receive.
    instructions:
      - "Invoke @DuckToolsApp#resolver#list_projects() and keep every project whose `uses:` reaches this repository — by its repository URL, directly or through a sub-project"
      - "Invoke @DuckToolsApp#resolver#verify_project() on each, from its root project file. Sub-projects are validated as part of the project that uses them, not opened on their own: a sub-project may name its siblings' and its parent's terms, and resolves only in the context the root assembles"
      - "Every consumer must verify clean, and any finding blocks the push: fix the consumer in the same piece of work, or change the framework so it no longer breaks it. A registered consumer resolves the framework through the workspace, which on the machine it is developed on points at this working copy — so what is checked here is exactly what the consumers are already reading, and there is no older state to compare with"
