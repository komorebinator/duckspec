description: A named element of the @Project's domain vocabulary.
guidelines:
  - When a @Term declares `extends`, resolve the parent @Term first (recursively). The child inherits all parent @Property and @Recipe declarations. Any child member with the same name as a parent member fully replaces it. Members not redefined in the child are inherited as-is.
  - "Never re-declare a `properties:` member that an ancestor already declares. Inheritance replaces it silently, so the two definitions drift apart and a reader cannot tell which one applies. If two subtypes both need a member, declare it once on their common parent; if only one needs it, only that one declares it. Recipes are the exception, and there re-declaration is the mechanism: a base term declares the contract, each subtype implements it under the same name."
  - "Path references: every element within a @Term has one full path — the term name, then each level down to the element, slots included: `<TermName>#components#cli#functions#load`. Each segment is a direct child of the one before it: a field of the term or of an entry, an entry of a list by its `id`, or a key of a mapping. Ids are unique among siblings (verify_project reports a `duplicate-id`), so a full path names exactly one element. A segment made only of digits picks the list item at that position, counting from 0 — the way to reach an entry that has no id, such as one under `references:`; it is meant for editing operations, since a position shifts when the list changes and so makes a poor reference in prose. @DuckToolsApp accepts only full paths, so what a path names is never in doubt: one that skips a level is refused, with the full paths that fit, rather than looked for at any depth — the search at any depth took the shallowest match, and opened a component's test where the component was meant. Prose in a term may name an element more briefly, `control#install` or `decisions#gapps`, as a pointer for a reader; whoever opens it asks for its full path. To reference an element in another @Term, prefix the path with `@<TermName>` (e.g. `@DuckToolsApp#components#cli#functions#load-project`)."
  - "A term file is valid YAML, readable by any YAML parser, not only by @DuckToolsApp. A value YAML would read as something other than its text is quoted — above all a term reference written as a value, `extends: \"@Term\"`, `type: \"@View\"`, `- \"@Recipe\"`, since YAML reserves a leading `@`; and any value with `: ` or ` #` inside it, or one starting with a character YAML gives meaning to. A value YAML types on purpose — `true`, `null`, a number, as in `visible: true` or `default: 0` — stays bare, since it means what YAML reads it as. @DuckToolsApp#resolver writes values this way, @DuckToolsApp#resolver#normalize brings existing files to it, and verify_project reports any value left bare that would not read as text. @DuckToolsApp itself still reads both the quoted and the bare form."
properties:
  - id: id
    description: identifier of this object, unique among its siblings. The only thing `#`-paths address; for entries naming something in the source (a @Function, a @Field) it must match that identifier verbatim.
  - id: name
    description: a short human-readable name for this object. A plain text field, never an identifier — addressing goes through `id`, and a term file is identified by its filename. Worth setting where a display name differs usefully from the id (a project, a piece of software); pointless where it would only restate it.
  - id: description
    description: top-level overview of what this @Term represents or does; sufficient on its own for simple terms; other slots (properties, functions, components, etc.) add detail
  - id: extends
    description: parent @Term to inherit from
  - id: properties
    type: "@Property"
    description: list of @Property the @Term holds
  - id: recipes
    type: "@Recipe"
    description: list of @Recipe the @Term exposes
  - id: guidelines
    description: list of @Guideline the @Term defines for content and artifact quality
  - id: lists
    type: "@List"
    description: named lookup tables available to this @Term's recipes; each list has an `id` and `items`, where each item has an `id` and a description; referenced by id in recipe instructions
  - id: decisions
    type: "@Decision"
    description: list of @Decision about this element — the choices made, the workarounds kept and the options turned down, each with its reason
  - id: goals
    description: list of @Goal this term pursues — what a project, or one part of it such as a @Software, is for, which no source file states. For a @DuckspecProject they are the only thing about a project under development that can never be inferred from its source, so they are asked for explicitly at creation time rather than deferred to assess_coverage; a part's say what it is for within the project, and come with every element opened inside it (@DuckToolsApp#resolver#_rules_for) rather than with @DuckspecProject#load, since they decide choices made in the part, not which part to go to.
