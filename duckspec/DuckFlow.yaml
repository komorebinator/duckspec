description: How work flows through a @DuckspecProject — the practice a project follows, from where its work is tracked through review and landing to the artifacts that reach users. Holds the delivery workflows, the systems they are driven by, and the versioning strategies a release calculates its version with.
extends: @DuckspecProject
terms_folder: duckflow
goals:
  - Describe how a change reaches users — review, merge, tag, publish — independently of which VCS or review system is in use
  - Keep the operations of each system — @Git, @GitHub, @Gerrit, @Jira — on that system's own term, so a workflow is written by combining them rather than by restating how each one works
  - Keep version calculation part of the workflow rather than a step someone has to remember to perform
startup:
  - load
uses:
  - ../Duckspec.yaml
  - DuckArch.yaml
