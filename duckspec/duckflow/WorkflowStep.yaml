description: |
  One named state a unit of work passes through on its way from a request to something a user
  can have. A step is a state, not an action: work rests in it, and something moves it out.

  A @DuckWorkflow declares the steps its project actually has. There is no fixed set — a project
  with no tracker has no step for planning, one with no artifact has none for building, and a
  project whose practice looks like nobody else's declares its own. What the base offers is a
  vocabulary, not a sequence.
extends: @Term
guidelines:
  - "Steps are written in the order work passes through them; the list is the sequence and there is no separate ordering field. What the order does not claim is causation — that a step begins because the one above it finished. Where that matters, and it often does, it belongs to whatever performs the step rather than to its position: a nightly build is started by its own schedule and would run whether or not anything landed that day, which is a fact about the pipeline's triggers, not about where the step sits in the list. Say it in the step's description until the thing that triggers it is described in its own right."
  - "Whether something deserves a step is settled by trying to write its `when`. A condition that holds long enough to be worth asking about describes a step; one that is true for the instant between two calls describes an action, and belongs inside whatever performs it. Verification is the usual case that goes both ways: a checklist run by hand against a deployed build sits true for days and is plainly a step, while a test suite that finishes before the push does is a condition on leaving the step before it. The same activity, and only the duration decides."
  - "The steps are read by evaluating every `when`, not by remembering where work started. Whatever is in hand sits at the last step whose condition holds; what to do next is the first unsatisfied step after it; and any unsatisfied step before it was skipped. That is the whole of the branching a workflow needs. Work that arrives partway through — a pull request from someone outside, a build a schedule started, a fix that is its own reason for existing — is located by the same evaluation as work that began at the top, with nothing having to declare where it may enter. A step that did not happen stays visibly unsatisfied rather than being routed around: that this change was never reviewed is a fact worth reporting, and a route declaring review unnecessary here would have hidden it."
properties:
  - id: when
    description: "the condition that holds while work is at this step, written so it can actually be evaluated against something observable — an open pull request exists, the change is on `main_branch`, a signed image carries it, the ticket sits in this status. This is what makes a step findable rather than merely described: the step work is currently at is the last one whose `when` is true, and that is how anything can advance the work without being told where it starts. A condition nobody can check leaves the step undetectable, which is worse than not declaring it."
  - id: operation
    description: "the recipe that moves work out of this step, as a call in the same form recipe instructions use — `@<TermName>#<recipe>`, with `(<argument>=<value>, ...)` when the recipe takes arguments, e.g. `@GitHub#run_workflow(workflow=build-base.yml, ref=experimental)`. The recipe lives on whichever term implements the operation — a system such as @Git, @GitHub or @Jira, this project itself, or anything else that declares one — never on a component that merely describes a file, since a file is not something that can be run. Omitted when nothing performs the step, which is a fact worth declaring rather than hiding: it is how a project says out loud that it has no tests, or that its artifacts reach users by a manual act nobody has written down."
