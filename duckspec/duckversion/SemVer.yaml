description: Semantic versioning (major.minor.patch). Patch for bug fixes and small changes; minor for new terms or features; major for breaking changes. Below 1.0.0 the project is still experimental and the scale shifts down one: a breaking change bumps the minor, and major stays reserved for declaring the project stable. The suggested bump is inferred from git log unless overridden.
extends: @VersioningStrategy
recipes:
  - id: next_version
    description: Increments the appropriate version component and resets lower ones to zero
    arguments:
      - id: bump
        description: patch (default), minor, or major; if not provided, inferred from git log since the last version tag — new .yaml files in `terms_folder` suggest minor, otherwise patch
    instructions:
      - Read the current version from the project's `version:` field; parse into major, minor, patch integers
      - If bump is not provided, check git log since the last version tag for new .yaml files added to `terms_folder`; if any exist, recommend minor; otherwise recommend patch; offer major only if the user explicitly requests it
      - Increment the specified component; reset all lower components to zero (e.g. minor bump: minor+1, patch=0)
      - "Ask the user which version to use through a real interactive prompt, as @VersioningStrategy#next_version requires — the candidates as options, the one above marked as recommended, and the `version:` field written only after the answer arrives. Overriding a recipe replaces the base one whole, so a subtype that leaves this out does not inherit it; it loses it."
      - Return the new version string in major.minor.patch format
