description: A @Project managed with @Duckspec.
extends: "@Project"
guidelines:
  - "Paths that point inside the spec — `terms_folder`, `uses` entries, and everything under `settings` — are relative to the file they appear in. A `src:` is the exception: it points into the source tree, so it resolves against the project's `settings.src` (default `..`) no matter how deep the term sits. A component in `Borshevik/ImageBuild.yaml` naming `build_files/scripts/build-base.sh` means the file in the repository, not one beside the term."
  - One project per repository. Its parts are its @Software terms, listed in `software`, together with the terms they rest on; subfolders of `terms_folder` group them where there are enough to need it. A part is never a project of its own — what is always worked on together with the project belongs to it — and a project in another repository is connected through `uses` or `references`.
  - "What `uses` brings in resolves for every operation — its terms can be named by `@<TermName>`, opened and verified — but @DuckspecProject#load shows another project only as one node, with its name, repository and description; its content is opened on demand, by loading that project or by expanding one of its terms. Circular `uses` are safe: the resolver deduplicates by resolved path."
  - "A @DuckspecProject may reference an external @DuckspecProject by its `repository` URL (e.g. `https://github.com/user/repo`); the resolver looks up the URL in the active @Workspace's `projects` map, read from `~/.duckspec/settings.json`, to find the local path. If no entry exists there, the entry is skipped with a warning."
  - "`uses` and `references` express different things and must not be conflated. Use `uses` only when this project's own content needs the other project's terms — names them by `@<TermName>` — so they must resolve here. Use `references` when the connection is purely informational (e.g. an external component this project installs, targets, or is installed by): it never resolves anything, it is only shown. A project that is merely installed or consumed, without its terms being named here, belongs in `references`, not `uses` or `software`."
  - "Move through the spec from the overview down, never by loading everything: @DuckspecProject#load gives the parts of the project with their descriptions and how they connect; @DuckToolsApp#resolver#expand on a part, or on any element inside it, gives its children with their descriptions; @DuckToolsApp#resolver#resolve_path opens the one element the work is about, together with every guideline that applies to it. Load a whole term with @DuckToolsApp#resolver#load_terms only when the work concerns all of it — a large term loaded whole fills the context with parts the work never touches."
properties:
  - id: settings
    type: "@DuckspecProjectSettings"
    description: "@DuckspecProject configuration"
  - id: references
    type: "@Reference"
    description: list of `{repository, description}` entries naming other projects this one is connected to by identity only (installs, targets, is installed by) — never resolved or loaded by the tool; shown by @DuckspecProject#load as one node each among the connected projects so the connection stays visible without pulling that project's content into context
  - id: workflow
    type: "@DuckWorkflow"
    description: how work on this project is done, from a request to what reaches users; `type:` references a @DuckWorkflow subtype (e.g. `@GitHubWorkflow`); all other fields are property overrides — omit any that should be inferred from context
recipes:
  - id: load
    description: Loads the top level of this @DuckspecProject into context — the root file, its parts (the @Software it lists) with their descriptions in full and which terms each refers to and is referred to by, its other terms, every other project it is connected to as a single node, the recipes it can run, the framework's vocabulary and the project-wide rules; anything deeper is opened on demand, each element bringing the rules that apply to it
    instructions:
      - "If this project's file is not registered in the active @Workspace (per `~/.duckspec/settings.json`) — under its `repository`, or under its file's `file://` URI while it has none: ask the user whether to switch to a workspace that already has it (Invoke @DuckToolsApp#use_workspace), or register it in the current one (Invoke @Workspace#add_project)"
      - Invoke @DuckToolsApp#resolver#load_project(project_path=<path to this @DuckspecProject file>)
      - "Go further only where the work leads: Invoke @DuckToolsApp#resolver#expand(project_path=<path>, ref=<TermName or TermName#path>) for the children of a part or element, and @DuckToolsApp#resolver#resolve_path(project_path=<path>, ref=<TermName#path>) for the one element the work is about"
  - id: check_guidelines
    description: Checks a single term file against all guidelines applicable to it — project-wide rules plus its own inheritance chain
    arguments:
      - id: file_path
        description: path to the .yaml term file to check
    instructions:
      - Identify the term name from file_path; Invoke @DuckToolsApp#resolver#load_terms(project_path=<path>, term_names=<term name>) to get its content along with an attached `rules` tree — its own guidelines plus each `extends` ancestor's own, already resolved, no need to walk `extends` by hand
      - Combine the attached `rules` tree with the project-wide rules already loaded into context via @DuckspecProject#load; deduplicate by rule text
      - "For each collected rule: evaluate whether the term's content complies; record each violation with the rule text, source @Term, and a description of the non-compliance"
      - "Output a report: file path, term name, inheritance chain (from the `rules` tree's `inherited` entries), and list of violations (or \"no violations\" if compliant)"
  - id: validate
    description: Validates all loaded @Term files against the @DuckspecProject guidelines and runs software tests
    arguments:
      - id: scope
        description: "`normal` (default) or `full`. `normal` runs every check — it is not a reduced validation. What it is allowed to narrow is only the steps that are expensive in tokens: the ones where the model itself walks file after file, reads each in full and judges it by meaning. Everything a tool settles, and everything bounded and cheap, runs completely under both. For the expensive steps `normal` covers what this session changed and `full` covers everything the spec points at. Pass `full` whenever the request asks for a full, complete or thorough check in any wording; otherwise `normal`."
    instructions:
      - "Fix `scope` before running anything: `full` if the request asked for a full check in any wording, `normal` otherwise. State which is in force on the first line of the report — under `normal` a narrowed expensive step is the intended behaviour and reports 🟢 with its covered set named, while under `full` the same narrowing is a failure to carry out the request."
      - Invoke @DuckspecProject#load()
      - "Invoke @DuckToolsApp#resolver#verify_project() and record every finding it returns — dangling and ambiguous references, broken `extends`, duplicate or unparseable terms, members shadowing an inherited one, entries setting fields no type declares. Do not re-check any of this by reading files: it is settled mechanically, exhaustively, and identically on every run, which is exactly what a model does worst. Every finding is a real defect — the check has no exemptions — so resolve each one rather than triaging it away."
      - "Invoke @DuckspecProject#check_guidelines(file_path=<path>) per term file. This is one of the expensive steps — reading each file and judging it against every applicable rule is model work that scales with the corpus — so under `normal` it covers the term files this session touched. Under `full` it covers every term file in the loaded output, without exception: read each one from disk again rather than relying on having seen it earlier in the session, take every applicable rule against it rather than the ones it looks likely to break, and produce its own report. A file skimmed because it is large, or skipped because nothing seemed likely to be there, has not been checked. `full` was asked for knowing it is expensive; the cost is the point, and stopping partway through is not a cheaper version of it but a different answer given under its name."
      - "For each @Software reachable transitively via `uses:` and `software:` from this project — including sub-projects referenced by relative path or by `repository` URL alike, regardless of which repository they live in: compare what it exposes against its `tests:`, and report every function, command or operation no test exercises. Write the missing tests, starting with anything that writes to disk — an untested read is a wrong answer, an untested write is a damaged file. A @Software with no `tests:` at all is entirely uncovered, not exempt. The one thing that is exempt is a @Software declaring no `src:` anywhere in it: with no path to code there is nothing in this repository to run, which is why verify_source passes over the same terms. That covers the framework's own type definitions — @Application, @ContainerImage, @Extension exist to be extended, not built — and external tools a project names but does not develop, such as @Git or @GitHub. Report those as exempt with the reason, rather than omitting them: the difference between \"nothing to test here\" and \"nobody wrote the tests\" is the whole point of the step."
      - "For each @Software, decide only whether its sources changed at all — anything under them differing from the last commit, or edited this session. If so, Invoke @Software#test() and let the whole suite run: never a subset picked for looking related to the change, since what a change breaks is rarely what it touched. If nothing changed, the suite is skipped, and skipped is reported as skipped rather than passed. Report the outcome of every @Software either way."
      - "Invoke @DuckspecProject#verify_source(scope=<scope>) — the structural and guideline checks above confirm the spec is well-formed; this confirms it is still accurate against the actual code, so drift does not reach submit/release unnoticed"
      - "Report the result as one line per step above, in the order they ran, each opening with a marker: 🟢 the step covered everything its scope calls for and found nothing; 🔴 it ran and found something, followed by the count and the findings themselves; 🟡 it did not run, or could not reach a verdict — a skipped test suite, unreadable sources, a check that errored. A narrowed expensive step under `normal` is 🟢 and names its covered set on the line; that is the scope working as intended, not a shortcut. Add ⏩ only when a step covered less than its own scope required — under `full`, any expensive step that did not reach every file is 🔴, because the request was for all of them and it was not carried out; ⏩ is never a way to report an abandoned step as a passing one. Give every step a line even when there is nothing to say about it: a step silently omitted is indistinguishable from one that passed. Never merge steps. Follow the lines with the findings in full, then fix what can be fixed and ask the user wherever the correct resolution is ambiguous."
  - id: create_term
    description: Creates a new @Term file in the @DuckspecProject's terms folder
    arguments:
      - id: name
        description: CamelCase name for the new @Term
    instructions:
      - Ask the user for the term's name if not provided — it becomes the filename, and therefore the term's identity
      - Ask the user which parent @Term it extends; read that @Term to understand what properties and slots are available
      - Ask the user which of the inherited characteristics are relevant and what values or descriptions to set
      - Create the file `<terms_folder>/<TermName>.yaml` with the provided content
      - Invoke @DuckspecProject#validate()
  - id: update_agents
    description: Creates or updates AGENTS.md with a short guide to this project and to DuckTools — that it's built with @Duckspec, how to load it, and how to see every other project registered in the workspace
    instructions:
      - "The file is at `settings.agents` (default `AGENTS.md` at the root of the source tree, see @DuckspecProjectSettings#agents). Its duckspec guide is, in order: (1) an H1 with this project's name; (2) one short paragraph stating the project is built with @Duckspec, that its structure/guidelines/conventions live in @Term files rather than this document, and that DuckTools reads them via an MCP server or the `ducktools` CLI, both exposing the same operations; (3) the command to load this project, in both MCP and CLI form, via @DuckToolsApp#resolver#load_project(project_path=<this project's identifier>) — the first thing to run before any work — followed by one line saying that where the project is not registered in the active workspace yet, the same command takes the project file's path relative to the repository root instead; (4) the command to see every project registered across all workspaces, in both MCP and CLI form, via @DuckToolsApp#resolver#list_projects(). Never write an absolute path into the file: AGENTS.md is committed and read on other machines and by other people, where a path from this one points nowhere and discloses its layout. The identifier works from any directory on any machine the project is registered on, because @DuckToolsApp#resolver#_resolve_project looks it up in the active @Workspace; the repository-relative path is the fallback for a clone that has not been registered."
      - "If the file does not exist, write it with the guide. If it does, it may hold guidance the project's own people wrote for every agent that works on it, so never overwrite it: update the guide in place where an earlier run of this recipe left one — (2) to (4), under the file's existing H1 — or else add (2) to (4) as a section near the top and leave everything else as it is. Show the user the change before writing it"
      - If `settings.agents` is unset and an AGENTS.md also sits beside this @DuckspecProject file — where this recipe wrote it before the default moved to the source root — remove that one, so the project is left with a single guide in the place agents read
      - Keep it brief — do not enumerate other DuckTools operations; load_project's own output (its recipes and term list) is where the rest surfaces once the project is actually loaded
  - id: update_readme
    description: Writes the project's README when there is none, and otherwise checks the existing one against the project and proposes edits only where it has clearly fallen behind. The README is written for someone opening the repository, not for whoever develops the project, and once it exists it is the author's to edit freely — this recipe does not regenerate it or keep it in step with the spec field by field.
    instructions:
      - "Gather what a README is written from: this project's name, description and goals; each entry of `software` with its platform and its install and run recipes; and the sources themselves wherever the spec does not say how something is installed or used"
      - Read `settings.readme` from @DuckspecProjectSettings. If it is not set, look for an existing README in the root of the source tree and set `settings.readme` to it; if there is none, the file to write is `README.md` in that root unless the user names another place
      - "If there is no file yet, draft one for a person opening the repository: what the project is and who it is for, what it does, how to install and run it, and one line pointing anyone who wants to change it to the guide @DuckspecProject#update_agents writes. Goals shape the opening rather than being listed, and how work is done is not retold — it lives in the project's @DuckWorkflow, and a copy here would be the first thing to go stale. Leave out any section there is nothing true to put in: a project with nothing to install yet gets no installation section. Show the draft to the user, take their corrections, write the file and save its path to `settings.readme`. A correction that states something about the project the spec does not say goes into the spec as well — the draft is also how a misunderstanding of the project surfaces"
      - "If the file exists, read it against what was gathered and look for three things only: a statement that is no longer true — a feature renamed or removed, an install or run step that no longer works, a name or description that has changed; a major feature or part of the project it does not mention at all; and, where the README has a goals section, goals that differ from the project's `goals`"
      - "Propose an edit only for what that reading found. Wording, tone, structure, section order and level of detail are the author's and are never grounds for one, and neither is a minor feature going unmentioned. Finding nothing is the ordinary result: say the README is current and change nothing — an edit proposed so the recipe has something to show costs the author a review and teaches them to skim the next one"
      - Show each proposed edit with what prompted it, apply the ones the user accepts, and leave everything else in the file untouched
  - id: assess_coverage
    description: Analyzes source files and generates or updates @Term definitions that, read alongside the repository, let a reader understand how the project works and why — its parts, how they connect, its main flows and the behaviour it promises, and the reasons and constraints no file states; also detects and fills in project-level metadata (`repository`, `workflow`) when not yet set, registering the project in the active workspace under its URL once a repository is known. Idempotent — can be run multiple times to refine or update existing terms; a later run fills in what the spec is missing and trims what it copied from files, under the rules for removing spec text.
    instructions:
      - Invoke @DuckToolsApp#resolver#list_terms(project_path=<path>, include_all=true) to get all term names; then invoke @DuckToolsApp#resolver#load_terms(project_path=<path>, term_names=<all names from previous step>) to load their content; if the output was truncated and saved to a file, read that file completely before proceeding
      - Read `src` from settings.src; if not set, default to `..` relative to this @DuckspecProject file's location; confirm the resolved path with the user before proceeding
      - "If `repository` is not already set: attempt `git remote get-url origin` inside `src`; if it resolves, normalize it to an `https://` URL and ask the user to confirm before setting `repository`. Then write the project's workflow as a @DuckWorkflow of its own, from how the project is actually worked on — its tracker, review system, build and delivery — with steps that point at the recipes of @Git, @GitHub, @Gerrit, @Jira or whatever else it uses. For a project on github.com start from a copy of @GitHubWorkflow's steps and adapt them; copy rather than extend, since a workflow is self-contained (see @DuckWorkflow). If no remote is found, leave `repository` unset and continue — nothing below depends on it. Either way, once `repository` is set (just now, or already): Invoke @Workspace#add_project(project_path=<path to this file>) on the active workspace, so this project becomes cross-referenceable under its URL; that replaces the `file://` entry @Duckspec#create_project registered it under."
      - Scan all files in `src` recursively; skip subfolders that contain a @DuckspecProject installation (Duckspec.yaml present); assign each file to exactly one category from file-categories
      - For each code file, state what it is in the `type:` of the component that covers it — plain text, or a @Term where one gives the component fields, rules or a mechanism of the tools (see @SoftwareComponent#type). Note every kind of part that recurs in this project and shares what must be known about it, or rules that hold for all of it — a candidate for a term of the project's own
      - "For each noted kind, draft a proposed @Term (id, description, extends, properties, guidelines) — only where it would give its parts fields to fill, rules or a mechanism; a term that would only name a concept, which any reader already knows, is not proposed. Note whether it looks like framework vocabulary — stack-agnostic, of use to projects of many kinds — or a concept of this project alone; then present all proposed terms as a multi-select checklist, each item showing the term name, a one-line description, what it gives its parts and that note, and ask the user which to create. Write the selected ones into the project's `terms_folder` and skip the rest entirely. This recipe changes this project's spec and nothing else: list the terms noted as framework vocabulary in the final report as candidates for @Duckspec, since moving one there is a change to the framework, made in its own repository by its own @DuckspecWorkflow"
      - Identify external platforms or applications that project files extend (e.g. GNOME Shell, systemd, a browser); define each as a named @Application term so that @Extension terms can reference it via `target:`
      - "The repository is one project: its parts are its @Software terms — each self-contained runnable application, library, image or extension — listed in its `software:`, and everything else is a component of one of them. Group the term files in subfolders of `terms_folder` by domain where there are enough of them to need it (e.g. everything about one external platform in one folder); a folder groups, it is not a project"
      - For each @Application identified, collect all code files that are used exclusively by that application (not imported or referenced by files belonging to any other application). Propose those files as inline `components:` of the application term rather than as separate top-level terms. A module warrants its own named term only if it is shared across two or more distinct applications; in that case define it as a term of its own and reference it via `@<TermName>#component-name` path syntax from the application's component descriptions.
      - Produce a proposed term tree — a structured outline listing every planned @Term file, its type, the source files it covers, and which folder it goes in — and present it to the user for approval or adjustment before writing any files
      - For each @View term — (1) document the elements the user acts on or reads state from (buttons, toggles, inputs, labels whose content changes, progress indicators, pages, etc.) with their role and the conditions under which they are enabled or visible; (2) document page or state transitions, and requirements on how they look where the author holds one (e.g. that showing an element must not shift the layout) — the requirement, not the widget trick that meets it; (3) add @Function entries only for event handlers and non-trivial logic, not for widget construction. Styling, spacing and sizes are realization unless the author has made one a decision.
      - For each @Script write a single run function stating what the script achieves, what runs it and when, the conditions it branches on, the lasting effects it leaves on the system, and why any step is there when the reason is not evident. Commands, flags, package lists and step order stay in the script.
      - For each @Pipeline term document its triggers, jobs, matrix variants, and outputs
      - For each @ContainerImage term document its stages, build args, and what each stage installs or configures
      - "For each config file, say what it configures and for whom, which part of the project reads it and when, and the intent behind any deliberate deviation from upstream whose purpose the file does not make evident. Config files about one subject are described together, with their files listed under one `src:`. The values, their format and how they are split across files stay in the files."
      - "For each @Function in code components, write the decisions in its behaviour (see @Function): what callers rely on, the edge cases that matter to them, and the constraints any implementation must keep, with why. A function that carries no decision beyond what its name says gets one line or no entry at all."
      - Where a description records a choice — an option turned down, a workaround for a defect outside the project, the author's ruling, the evidence for any of these — write it as a @Decision on the most specific element it concerns, and leave the description saying what the element is and does (see @Decision)
      - "For each component with non-trivial state, declare that state as `fields:` (a list of @Field) rather than describing it in prose: instance fields (`this.x` / class field declarations) nested on the owning component, module-level constants nested at the top level of the @Software, and state the component attaches to objects it does not own (e.g. a property set on a window, DOM node, or other external object), named with that object's local identifier as a prefix (e.g. `win._bwmState`). Do not add a `scope` property — scope follows from where the @Field is nested and its name prefix (see @Field). A field's `type` should capture its real shape (union of literal states, nullable, array/map element types, or an inline object shape for plain data records). Declare only state a rebuild must reproduce; a variable that merely holds one of the component's own widgets or helpers is realization and gets no @Field (see @Field). Do not duplicate the same state as both a `fields:` entry and a narrative description elsewhere — the prose `description` covers behaviour; `fields:` is the single source of truth for state shape."
      - "Write all term files to the appropriate terms folders; for existing term files update them in place — preserve any manually written content not contradicted by the source, and trim what it copied from files only under @Duckspec's rules for removing spec text: the questions checked and what is removed are shown to the author first"
      - "Verify coverage — every file in the code and config categories must be reached by some entry's `src:`, and a file mentioned only inside another component's description text is not covered. Files about one subject — a folder of icons, translation dictionaries, near-identical templates differing only in a target, several override files for one set of defaults — may share one entry whose `src:` names their folder or lists them. Reaching every file is not the goal in itself: the gap that matters is a part whose purpose or connections no term states. Assets need only path and purpose (see file-categories). List all remaining gaps"
      - "Output a coverage report as a markdown table in the conversation: total files scanned, covered files (path → term name), skipped files (path → reason), and any remaining gaps"
      - "Review types: for every existing @SoftwareComponent in the covered terms, check that its `type:` still says what it is — a @Term it names gives it something it uses, a plain-text type is not vaguer than what the component plainly is — and whether a term the project or the framework now has fits it better; propose each correction and ask the user to confirm before changing"
      - Invoke @DuckspecProject#verify_source() as a first, cheap pass — catches outright contradictions (renamed/missing functions, stale descriptions) before the deeper, more expensive fidelity check below
      - "Verify understanding: pick the project's main flows — how a change becomes something users receive, how each user-facing feature works end to end, how the project starts and what it runs on — and answer, from the spec alone, which parts take part, in what order, and why anything non-obvious is done the way it is. Every point where the answer needs a file read or has to be guessed is a gap: add the missing part, connection or reason to the term it belongs to. A pervasive cross-cutting convention (logging, an event-ordering rule, a naming pattern) that the source applies broadly but no single @Function states belongs in `guidelines:`, not in every function individually."
  - id: learn
    description: Captures durable knowledge from the current session into spec files — updates existing descriptions, properties, or function documentation when non-obvious facts were confirmed. Does not create new terms; use assess_coverage for that.
    instructions:
      - Review the current session for confirmed, durable knowledge about how the project works and why — a choice the author made or confirmed and its reason, a behaviour verified against the source, a gotcha and the reason for its fix, a connection between parts worked out; skip anything one-off, already documented, realization, or data its file already holds
      - "For each qualifying fact: identify the exact @Term and field to update; read that term file; apply only the targeted edit — change nothing else"
      - Invoke @DuckspecProject#validate() to verify no violations were introduced
  - id: verify_source
    description: "Finds contradictions between the spec and the source code — @DuckToolsApp#resolver#verify_source settles mechanically that declared paths exist and named functions are present, leaving the reading half: whether the descriptions are true of the implementation"
    arguments:
      - id: scope
        description: "`normal` (default) or `full`, as in @DuckspecProject#validate. The mechanical pass runs completely either way; it costs nothing. The scope governs the reading half only, which is the expensive part — under `normal` it covers the components whose sources or descriptions changed this session, under `full` every component the spec declares a `src:` for."
    instructions:
      - Invoke @DuckspecProject#load()
      - "Invoke @DuckToolsApp#resolver#verify_source() and record every finding — `missing-src` for a declared path with nothing at it, `absent-function` for a function id that appears nowhere in the file its component points at. This settles the mechanical half exhaustively and identically on every run; do not re-check any of it by reading files."
      - "List the components in scope before reading any of them — every component the spec declares a `src:` for under `full`, the ones touched this session under `normal` — and keep that list as the unit of account for the rest of the recipe. Deciding what to read while reading is what turns this step into whatever the reader had patience for."
      - "Read the source each component in that list points at and compare it against what the spec says about it. A description that names a different mechanism, credits work to the wrong file, or omits a step the code cannot work without is a defect; wording and style are not. This is the half no check reaches — the mechanical pass above can report nothing at all while a term describes something the code has never done."
      - "Where a @Software in scope has `behaviour`, read its scenarios against the same sources: a scenario the code cannot produce — no path through it leads from the scenario's `given` and `when` to its `then`, or the path leads somewhere else — is a contradiction just as a wrong description is, and is reported in the row of the component that decides it. Under `normal` this covers the scenarios that rest on components in scope and the scenarios this session changed"
      - "Read whole files rather than sampling them. The contradictions cluster in descriptions written from a term's intent instead of from its file, and such a description is plausible everywhere except against the source — an excerpt will not reveal it, and a spot-check that comes back clean says nothing about the rest."
      - "Report one row per component from the list — component, file, read or not, and what was found — followed by the findings in full: missing paths, absent functions, description contradictions. The row is what makes the reading half answerable: a verdict like \"read the sources and compared them\" is the one claim in this whole recipe that cannot be checked by anyone, including its author, and a file left out shows up as a row rather than as nothing at all. Suggest the corrective edit for each finding; fix on user confirmation."
  - id: prepare_release
    description: Calculates the next version and records the bump as a change. Publishing is not done here — the version bump is a change like any other and reaches `main_branch` by the same steps of the configured @DuckWorkflow, where a later step publishes it.
    arguments:
      - id: bump
        description: hint passed to the versioning strategy (e.g. patch/minor/major for @SemVer); interpretation depends on the configured strategy
    instructions:
      - "Read `workflow` from this project and `versioning` from the workflow it names; if either is unset, ask the user to configure it and stop"
      - Invoke @VersioningStrategy#next_version(bump=<bump>) to obtain the new version string
      - Update the `version` field in this @DuckspecProject file to the new version string
      - "Invoke @Git#commit() for the version field, and stop there. Do not tag and do not publish: the tag belongs on the commit that has landed on `main_branch`, and how it gets there is the workflow's business"
