description: A @Project managed with @Duckspec.
extends: @Project
guidelines:
  - "A changelog entry records what changed between two versions and why, and what a consuming project must do to move onto the new one. It is written for someone arriving at the new version, so it holds no temporal content: no account of how the work went, what was tried first, what broke on the way, or what remains unfinished. Anything a reader needs in order to use the current version belongs in the @Term files instead — a changelog that explains how something works is documentation filed in the wrong place, and it will rot there. One file per released version, named after it."
  - "Paths that point inside the spec — `terms_folder`, `uses` entries, and everything under `settings` — are relative to the file they appear in. A `src:` is the exception: it points into the source tree, so it resolves against the project's `settings.src` (default `..`) no matter how deep the term sits. A component in `Borshevik/ImageBuild.yaml` naming `build_files/scripts/build-base.sh` means the file in the repository, not one beside the term."
  - All entries in `uses` are loaded unconditionally when this project is loaded.
  - A @DuckspecProject may reference another @DuckspecProject in a different directory via `uses` with a relative path (e.g. `../OtherProject.yaml`); circular references are safe — the resolver deduplicates by resolved path.
  - Place sub-project files inside the parent project's directory, not alongside it (e.g. `Parent/Child.yaml`, not `Child.yaml` next to `Parent.yaml`).
  - "A @DuckspecProject may reference an external @DuckspecProject by its `repository` URL (e.g. `https://github.com/user/repo`); the resolver looks up the URL in the active @Workspace's `projects` map, read from `~/.duckspec/settings.json`, to find the local path. If no entry exists there, the entry is skipped with a warning."
  - "`uses` and `references` express opposite things and must not be conflated. Use `uses` only when this project's own content genuinely needs the other project's terms to be understood — it is loaded unconditionally, in full. Use `references` when the connection is purely informational (e.g. an external component this project installs, targets, or is installed by) — it is never loaded, only shown, so mentioning another project by identity never forces its content into context. A project that is merely installed or consumed, without its terms being needed to understand this one, belongs in `references`, not `uses` or `software`."
ai_instructions:
  - When first opening an @DuckspecProject, invoke all recipes listed in `startup` before doing anything else.
  - For any @Term not covered after loading, read its file individually on demand. If only one named element is needed (a single recipe, function, or component) rather than the whole term, prefer @DuckToolsApp#resolver#resolve_path(ref=<TermName>#<path>) over loading the entire term — it resolves directly to the target element without pulling in transitive dependencies that would otherwise be discarded unread.
properties:
  - id: goals
    description: list of @Goal the @DuckspecProject pursues — the only thing about a project under development that can never be inferred from its source, so it is asked for explicitly at creation time rather than deferred to assess_coverage
  - id: settings
    type: @DuckspecProjectSettings
    description: @DuckspecProject configuration
  - id: startup
    description: list of @Recipe names to invoke automatically before any other work when first opening the @DuckspecProject
  - id: references
    description: list of `{repository, description}` entries naming other projects this one is connected to by identity only (installs, targets, is installed by) — never resolved or loaded by the tool; surfaced verbatim in a References table by @DuckspecProject#load so the connection stays visible without pulling that project's content into context
  - id: workflow
    type: @DuckWorkflow
    description: delivery workflow for this project; `type:` references a @DuckWorkflow subtype (e.g. `@GitHubWorkflow`); all other fields are property overrides — omit any that should be inferred from context
  - id: versioning
    type: @VersioningStrategy
    description: versioning strategy for this project; `type:` references a @VersioningStrategy subtype (e.g. `@SemVer`); all other fields are property overrides
recipes:
  - id: load
    description: Loads an overview of this @DuckspecProject into context — root file content, term list with descriptions, available recipes, and project-wide rules (guidelines and ai_instructions from the root's own `extends` chain and direct `uses`); then loads specific terms on demand as work requires, each bringing its own rules along with it
    instructions:
      - "If this project's own `repository` is not a key in the active @Workspace's `projects` (per `~/.duckspec/settings.json`): ask the user whether to switch to a workspace that already has it (Invoke @DuckTools#use_workspace), or register it in the current one (Invoke @Workspace#add_project)"
      - Invoke @DuckToolsApp#resolver#load_project(project_path=<path to this @DuckspecProject file>)
      - Load additional terms on demand via @DuckToolsApp#resolver#load_terms(project_path=<path>, term_names=<names>)
  - id: check_guidelines
    description: Checks a single term file against all guidelines and ai_instructions applicable to it — project-wide rules plus its own inheritance chain
    arguments:
      - id: file_path
        description: path to the .yaml term file to check
    instructions:
      - Identify the term name from file_path; Invoke @DuckToolsApp#resolver#load_terms(project_path=<path>, term_names=<term name>) to get its content along with an attached `rules` tree — its own guidelines/ai_instructions plus each `extends` ancestor's own, already resolved, no need to walk `extends` by hand
      - Combine the attached `rules` tree with the project-wide rules already loaded into context via @DuckspecProject#load; deduplicate by rule text
      - For each collected rule: evaluate whether the term's content complies; record each violation with the rule text, source @Term, and a description of the non-compliance
      - Output a report: file path, term name, inheritance chain (from the `rules` tree's `inherited` entries), and list of violations (or "no violations" if compliant)
  - id: validate
    description: Validates all loaded @Term files against the @DuckspecProject guidelines and runs software tests
    arguments:
      - id: scope
        description: "`normal` (default) or `full`. `normal` runs every check — it is not a reduced validation. What it is allowed to narrow is only the steps that are expensive in tokens: the ones where the model itself walks file after file, reads each in full and judges it by meaning. Everything a tool settles, and everything bounded and cheap, runs completely under both. For the expensive steps `normal` covers what this session changed and `full` covers everything the spec points at. Pass `full` whenever the request asks for a full, complete or thorough check in any wording; otherwise `normal`."
    instructions:
      - "Fix `scope` before running anything: `full` if the request asked for a full check in any wording, `normal` otherwise. State which is in force on the first line of the report — under `normal` a narrowed expensive step is the intended behaviour and reports 🟢 with its covered set named, while under `full` the same narrowing is a failure to carry out the request."
      - Invoke @DuckspecProject#load()
      - "Invoke @DuckToolsApp#resolver#verify_project() and record every finding it returns — dangling and ambiguous references, broken `extends`, duplicate or unparseable terms, members shadowing an inherited one, entries setting fields no type declares. Do not re-check any of this by reading files: it is settled mechanically, exhaustively, and identically on every run, which is exactly what a model does worst. Every finding is a real defect — the check has no exemptions — so resolve each one rather than triaging it away."
      - "Invoke @DuckspecProject#check_guidelines(file_path=<path>) per term file. This is one of the expensive steps — reading each file and judging it against every applicable rule is model work that scales with the corpus — so under `normal` it covers the term files this session touched. Under `full` it covers every term file in the loaded output, without exception: read each one from disk again rather than relying on having seen it earlier in the session, take every applicable rule against it rather than the ones it looks likely to break, and produce its own report. A file skimmed because it is large, or skipped because nothing seemed likely to be there, has not been checked. `full` was asked for knowing it is expensive; the cost is the point, and stopping partway through is not a cheaper version of it but a different answer given under its name."
      - "For each @Software reachable transitively via `uses:` and `software:` from this project — including sub-projects referenced by relative path or by `repository` URL alike, regardless of which repository they live in: compare what it exposes against its `tests:`, and report every function, command or operation no test exercises. Write the missing tests, starting with anything that writes to disk — an untested read is a wrong answer, an untested write is a damaged file. A @Software with no `tests:` at all is entirely uncovered, not exempt. The one thing that is exempt is a @Software declaring no `src:` anywhere in it: with no path to code there is nothing in this repository to run, which is why verify_source passes over the same terms. That covers the framework's own type definitions — @Application, @ContainerImage, @Extension exist to be extended, not built — and external tools a project names but does not develop, such as @Git or @GitHub. Report those as exempt with the reason, rather than omitting them: the difference between \"nothing to test here\" and \"nobody wrote the tests\" is the whole point of the step."
      - "For each @Software, decide only whether its sources changed at all — anything under them differing from the last commit, or edited this session. If so, Invoke @Software#test() and let the whole suite run: never a subset picked for looking related to the change, since what a change breaks is rarely what it touched. If nothing changed, the suite is skipped, and skipped is reported as skipped rather than passed. Report the outcome of every @Software either way."
      - "Invoke @DuckspecProject#verify_source(scope=<scope>) — the structural and guideline checks above confirm the spec is well-formed; this confirms it is still accurate against the actual code, so drift does not reach submit/release unnoticed"
      - "Report the result as one line per step above, in the order they ran, each opening with a marker: 🟢 the step covered everything its scope calls for and found nothing; 🔴 it ran and found something, followed by the count and the findings themselves; 🟡 it did not run, or could not reach a verdict — a skipped test suite, unreadable sources, a check that errored. A narrowed expensive step under `normal` is 🟢 and names its covered set on the line; that is the scope working as intended, not a shortcut. Add ⏩ only when a step covered less than its own scope required — under `full`, any expensive step that did not reach every file is 🔴, because the request was for all of them and it was not carried out; ⏩ is never a way to report an abandoned step as a passing one. Give every step a line even when there is nothing to say about it: a step silently omitted is indistinguishable from one that passed. Never merge steps. Follow the lines with the findings in full, then fix what can be fixed and ask the user wherever the correct resolution is ambiguous."
  - id: create_term
    description: Creates a new @Term file in the @DuckspecProject's terms folder
    arguments:
      - id: name
        description: CamelCase name for the new @Term
    instructions:
      - Ask the user for the term's name if not provided — it becomes the filename, and therefore the term's identity
      - Ask the user which parent @Term it extends; read that @Term to understand what properties and slots are available
      - Ask the user which of the inherited characteristics are relevant and what values or descriptions to set
      - Create the file `<terms_folder>/<TermName>.yaml` with the provided content
      - Invoke @DuckspecProject#validate()
  - id: create_readme
    description: Creates the root description file for the @DuckspecProject and registers it in @DuckspecProjectSettings
    instructions:
      - Read the @DuckspecProject term file to get the @DuckspecProject's name, description, and goals
      - Ask the user where to create the file (default: README.md)
      - Create the file with the @DuckspecProject name as the H1 heading, description as the opening line, and goals as a bullet list under a "Goals" heading
      - Save the file path to `settings.readme`
  - id: term_map
    description: Displays the current term map as a markdown table with descriptions
    instructions:
      - Invoke @DuckToolsApp#resolver#list_terms(project_path=<project_path>) and output the result
  - id: rules
    description: Displays all active rules (guidelines and ai_instructions) collected from loaded @Term files, including inherited ones. Useful when rules need to be reviewed in isolation; rules are also included in the @DuckspecProject#load output automatically.
    instructions:
      - For each loaded term, collect its guidelines and ai_instructions; include inherited ones, marking the source @Term for each entry
      - Output a markdown table with columns: Source (@<TermName> link style), Type (Guideline or AI Instruction), Rule (the text)
      - One row per entry, grouped by source term, guidelines before ai_instructions within each group
  - id: update_agents
    description: Creates or updates AGENTS.md with a short guide to this project and to DuckTools — that it's built with @Duckspec, how to load it, and how to see every other project registered in the workspace
    instructions:
      - "Write or overwrite the file at `settings.agents` (default `AGENTS.md`, next to this @DuckspecProject file) with, in order: (1) an H1 with this project's name; (2) one short paragraph stating the project is built with @Duckspec, that its structure/guidelines/conventions live in @Term files rather than this document, and that DuckTools reads them via an MCP server or the `ducktools` CLI, both exposing the same operations; (3) the command to load this project, in both MCP and CLI form, via @DuckToolsApp#resolver#load_project(project_path=<absolute path to this file>) — the first thing to run before any work; (4) the command to see every project registered across all workspaces, in both MCP and CLI form, via @DuckToolsApp#resolver#list_projects()"
      - Keep it brief — do not enumerate other DuckTools operations; load_project's own output (its recipes and term list) is where the rest surfaces once the project is actually loaded
  - id: update_readme
    description: Updates the root description file to reflect the current @DuckspecProject definition
    instructions:
      - Read the @DuckspecProject term file to get the @DuckspecProject's name, description, and goals
      - Read `settings.readme` from @DuckspecProjectSettings; if it is not set, ask the user whether to set an existing path or Invoke @DuckspecProject#create_readme()
      - If the file at `settings.readme` does not exist, Invoke @DuckspecProject#create_readme()
      - If the file exists, apply only the necessary edits to bring its name, description, and goals in sync with the @DuckspecProject definition; leave all other content untouched
  - id: assess_coverage
    description: Analyzes source files and generates or updates @Term definitions detailed enough that running `build` on the result would recreate the project faithfully; also detects and fills in project-level metadata (`repository`, `workflow`) when not yet set, registering the project in the active workspace once a repository is known. Idempotent — can be run multiple times to refine or update existing terms.
    instructions:
      - Invoke @DuckToolsApp#resolver#list_terms(project_path=<path>, all=true) to get all term names; then invoke @DuckToolsApp#resolver#load_terms(project_path=<path>, term_names=<all names from previous step>) to load their content; if the output was truncated and saved to a file, read that file completely before proceeding
      - Read `src` from settings.src; if not set, default to `..` relative to this @DuckspecProject file's location; confirm the resolved path with the user before proceeding
      - "If `repository` is not already set: attempt `git remote get-url origin` inside `src`; if it resolves, normalize it to an `https://` URL and ask the user to confirm before setting `repository`. If confirmed, derive `workflow.type` from the host — `@GitHubWorkflow` for github.com, `@GerritWorkflow` for a recognized Gerrit host, `@GitWorkflow` otherwise — and ask the user to confirm the derived workflow before setting it. If no remote is found, leave both unset and continue — nothing below depends on them. Either way, once `repository` is set (just now, or already): Invoke @Workspace#add_project(project_path=<path to this file>) on the active workspace, so this project becomes cross-referenceable."
      - Scan all files in `src` recursively; skip subfolders that contain a @DuckspecProject installation (Duckspec.yaml present); assign each file to exactly one category from file-categories
      - Classify each code file using the most specific pattern from code-patterns; use the same priority order as the list; note every file where the closest available pattern is a stretch — where using it would hide the real concept rather than describe it
      - For each noted gap, draft a proposed @Term (id, description, extends, properties) and classify its scope using the framework guidelines: global (@Duckspec framework) if the concept is standard CS vocabulary, stack-agnostic, and universally understandable; project-local otherwise; then present all proposed terms as a multi-select checklist — each item shows the term name, a one-line description, and the proposed scope (global → PR to duckspec / local → project terms_folder) — and ask the user to select which terms to create; skip unselected terms entirely; for selected global terms: write the term files and create a pull request to the duckspec repository via `gh pr create --repo komorebinator/duckspec` with a description explaining what each term represents and why it belongs in the framework; for selected local terms: write the term files to the appropriate sub-project `terms_folder`
      - Identify external platforms or applications that project files extend (e.g. GNOME Shell, systemd, a browser); define each as a named @Application term so that @Extension terms can reference it via `target:`
      - Group files into sub-projects by domain — all files that extend or configure the same external platform form one @DuckspecProject sub-project (e.g. all systemd units → Systemd sub-project, all GNOME extensions and config → Gnome sub-project); self-contained runnable applications with their own entry point also form sub-projects; everything else embeds inline; the root project connects sub-projects only via `uses:` — no `software:` list at the root level
      - Ensure no naming conflicts: the sub-project filename (e.g. `Systemd.yaml`, giving the term `@<Systemd>`) must not match any term name inside its `terms_folder`; use more specific names for inner terms (e.g. `SystemdManager.yaml`, `RuntimeScripts.yaml`)
      - For each @Application identified, collect all code files that are used exclusively by that application (not imported or referenced by files belonging to any other application). Propose those files as inline `components:` of the application term rather than as separate top-level terms. A module warrants its own named term only if it is shared across two or more distinct applications; in that case define it as a @Singleton or other appropriate @DesignPattern term and reference it via `@<TermName>#component-name` path syntax from the application's component descriptions.
      - Produce a proposed term tree — a structured outline listing every planned @Term file, its type, the source files it covers, and which sub-project it belongs to — and present it to the user for approval or adjustment before writing any files
      - For each @View term — (1) document the visual structure as components enumerating every @UserInterfaceElement (@Button, @Toggle, @Input, @Label, @ProgressBar, @Spinner, @Page, etc.) with its label, role, and enabled/visible conditions; (2) document page or state transitions; (3) add @Function entries only for event handlers and non-trivial logic, not for widget construction
      - For each @ShellScript or @Script term write a single run function whose description covers every major step, conditional branch, environment variable dependency, external command invoked, and expected side effect on the system
      - For each @Pipeline term document its triggers, jobs, matrix variants, and outputs
      - For each @ContainerImage term document its stages, build args, and what each stage installs or configures
      - For each config file create a named @ConfigFile term (or a named component of the most closely related @Software) with a configure function describing the file's purpose and the meaning of its key fields
      - For each @Function in code components write a description covering the algorithm, data flow, edge cases, and expected output in enough detail that a developer could reimplement the function without reading the source
      - For each component with non-trivial state, declare it as `fields:` (a list of @Field) rather than describing it in prose: instance fields (`this.x` / class field declarations) nested on the owning component, module-level constants nested at the top level of the @Software, and state the component attaches to objects it does not own (e.g. a property set on a window, DOM node, or other external object), named with that object's local identifier as a prefix (e.g. `win._bwmState`). Do not add a `scope` property — scope follows from where the @Field is nested and its name prefix (see @Field). A field's `type` should capture its real shape (union of literal states, nullable, array/map element types, or an inline object shape for plain data records). If a field is just the instance-variable binding for a widget that already has its own named @UserInterfaceElement entry in `components:`, nest the @Field on that child component instead of listing it again on the parent — never describe the same widget's identity in two places in the tree. Do not duplicate the same state as both a `fields:` entry and a narrative description elsewhere — the prose `description` should cover behavior and algorithms; `fields:` is the single source of truth for state shape.
      - Write all term files to the appropriate terms folders; for existing term files update them in place — preserve any manually written content not contradicted by the source
      - Verify coverage — for every file in code, config, and asset categories confirm it has a dedicated named entry; a file is NOT covered if it appears only inside another component's description text; list all remaining gaps
      - Output a coverage report as a markdown table in the conversation: total files scanned, covered files (path → term name), skipped files (path → reason), and any remaining gaps
      - Review type precision: for every existing @SoftwareComponent in the covered terms, check whether a more specific @DesignPattern is now available in the term map that better describes the component than its current type; propose re-typing and ask the user to confirm before changing
      - Invoke @DuckspecProject#verify_source() as a first, cheap pass — catches outright contradictions (renamed/missing functions, stale descriptions) before the deeper, more expensive fidelity check below
      - Verify fidelity (a deeper check than verify_source's read-only comparison — this one regenerates and diffs, so it also catches omissions verify_source can't see): for at least one non-trivial component, actually invoke @Software#build() against an empty/scratch location (not the real `src`) from the spec alone, then diff the result against the real source — do not just mentally simulate it; reconstructing each component's `fields:` as real field/property declarations. Treat naming/formatting/control-flow-shape differences as expected and not worth fixing. Treat these as real gaps and fix the spec when found: (1) a defensive guard or precondition check on an external API call (null/undefined checks, type checks on returned data, range checks) that the description's algorithm steps don't mention — these are exactly the details prose summaries tend to drop; (2) a pervasive cross-cutting convention (logging, a particular event-ordering rule, a naming pattern) that the source applies broadly but no single @Function description states — these belong in `guidelines:`, not in every function individually. If the result differs from the source in any other meaningful way (missing state, wrong shape, wrong algorithm step), add the missing detail.
  - id: learn
    description: Captures durable knowledge from the current session into spec files — updates existing descriptions, properties, or function documentation when non-obvious facts were confirmed. Does not create new terms; use assess_coverage for that.
    instructions:
      - Review the current session for confirmed, non-obvious, durable facts — behaviors verified against the source, gotchas and their fixes, mechanisms worked out, clarifications to existing descriptions; skip anything one-off, already documented, or derivable from a quick read of the code
      - For each qualifying fact: identify the exact @Term and field to update; read that term file; apply only the targeted edit — change nothing else
      - Invoke @DuckspecProject#validate() to verify no violations were introduced
  - id: verify_source
    description: Finds contradictions between the spec and the source code — @DuckToolsApp#resolver#verify_source settles mechanically that declared paths exist and named functions are present, leaving the reading half: whether the descriptions are true of the implementation
    arguments:
      - id: scope
        description: "`normal` (default) or `full`, as in @DuckspecProject#validate. The mechanical pass runs completely either way; it costs nothing. The scope governs the reading half only, which is the expensive part — under `normal` it covers the components whose sources or descriptions changed this session, under `full` every component the spec declares a `src:` for."
    instructions:
      - Invoke @DuckspecProject#load()
      - "Invoke @DuckToolsApp#resolver#verify_source() and record every finding — `missing-src` for a declared path with nothing at it, `absent-function` for a function id that appears nowhere in the file its component points at. This settles the mechanical half exhaustively and identically on every run; do not re-check any of it by reading files."
      - "List the components in scope before reading any of them — every component the spec declares a `src:` for under `full`, the ones touched this session under `normal` — and keep that list as the unit of account for the rest of the recipe. Deciding what to read while reading is what turns this step into whatever the reader had patience for."
      - "Read the source each component in that list points at and compare it against what the spec says about it. A description that names a different mechanism, credits work to the wrong file, or omits a step the code cannot work without is a defect; wording and style are not. This is the half no check reaches — the mechanical pass above can report nothing at all while a term describes something the code has never done."
      - "Read whole files rather than sampling them. The contradictions cluster in descriptions written from a term's intent instead of from its file, and such a description is plausible everywhere except against the source — an excerpt will not reveal it, and a spot-check that comes back clean says nothing about the rest."
      - "Report one row per component from the list — component, file, read or not, and what was found — followed by the findings in full: missing paths, absent functions, description contradictions. The row is what makes the reading half answerable: a verdict like \"read the sources and compared them\" is the one claim in this whole recipe that cannot be checked by anyone, including its author, and a file left out shows up as a row rather than as nothing at all. Suggest the corrective edit for each finding; fix on user confirmation."
  - id: submit
    description: Validates the project and runs the author-side delivery step of the configured @DuckWorkflow; other workflow recipes (update, review, merge) can be invoked directly on the workflow type
    instructions:
      - Invoke @DuckspecProject#validate()
      - Read `workflow` from this project; if not set, ask the user to configure it and stop
      - Invoke @DuckWorkflow#submit() using the workflow type and any configured property overrides
  - id: release
    description: Calculates the next version via the configured @VersioningStrategy, writes the changelog entry for it, submits all changes, and publishes a release via the configured @DuckWorkflow
    arguments:
      - id: bump
        description: hint passed to the versioning strategy (e.g. patch/minor/major for @SemVer); interpretation depends on the configured strategy
    instructions:
      - Read `versioning` from this project; if not set, ask the user to configure it and stop
      - Invoke @VersioningStrategy#next_version(bump=<bump>) to obtain the new version string
      - Update the `version` field in this @DuckspecProject file to the new version string
      - "Write the changelog entry into `settings.changelog` as `<version>.md`: what changed since the previous version and why, and what a consuming project must do to move onto it. Draft it from the commit log since the previous version tag, subjects and bodies both — those were written while each change was fresh and carry the reasons, which a diff does not. Read the diff too, but as a check that nothing landed without being described, not as the source: a change absent from the log is a commit-message defect to note, not something to reconstruct from code. Never draft from recollection of the session. If an entry for unreleased changes is already accumulating there, rename it to the new version and bring it up to date instead of starting over."
      - Invoke @DuckspecProject#validate() — @DuckWorkflow#release below already submits the changes itself as part of its own delivery procedure, so this only confirms they are valid first rather than submitting them a second time
      - Read `workflow` from this project; if not set, ask the user to configure it and stop
      - Invoke @DuckWorkflow#release(version=<new_version>)
