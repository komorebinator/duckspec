description: Python application that implements the DuckTools CLI commands and MCP server for loading and navigating @DuckspecProject files.
extends: "@Application"
platform: Python
src: ducktools/src/
guidelines:
  - Zero external dependencies; only Python stdlib is allowed for all features including the MCP server.
  - "@DuckspecProject files and @Term files are read as plain text; field extraction is done with regex, not a YAML parser. The files are nonetheless kept valid YAML (see @Term), so the regexes accept a value both quoted and bare, and everything the resolver writes is quoted wherever YAML requires it. Block lists are read only when indented under their key, the form every file here is written in — except `uses:`, which is read at column 0 as well, since missing it there silently drops the framework from the whole project."
  - The MCP server implements the JSON-RPC 2.0 wire protocol directly over stdio without using an MCP SDK.
  - "Every file is read and written as UTF-8, named explicitly on each call, and the CLI's and MCP server's standard streams are switched to UTF-8 at start. Python before 3.15 otherwise uses the locale's encoding, which on Windows is a legacy code page: term files there would come back garbled, and one the code page cannot decode at all would be skipped as unreadable — @DuckspecProject.yaml is such a file, so every project would silently lose its recipes and rules."
  - Warnings and other diagnostics go to stderr, never stdout. Under `ducktools serve` stdout is the JSON-RPC channel to the MCP client, and a stray line there — a skipped `uses:` entry, a duplicate term — breaks the response it lands in.
lists:
  - id: installation-methods
    items:
      - id: mcp
        description: "register ducktools as an MCP server named `ducktools` in the model's tool configuration, preferring a user-level/global registration over a per-project one wherever the executor's own tooling allows it, since one server serves every project on the machine — the exact registration mechanism is executor-specific, use whatever this assistant provides — then confirm through the executor's own listing of MCP servers that it is there, and that it answers: where the listing does not show whether it connects, start it by its registered command and send it an `initialize` and a `tools/list`. A `ducktools` server already registered is kept when it runs the wrapper at `ducktools.bin` with `serve`; when it names anything else — an older clone, a moved wrapper — show the user both and replace it only with their go-ahead, since an executor refuses to register a second server under the same name. The server is started with `serve` on the wrapper at `ducktools.bin` in `~/.duckspec/settings.json`, registered by that absolute path rather than by the bare name, since the bin directory chosen in @Duckspec#recipes#install need not be on the PATH the executor starts servers with. On Windows a script cannot be started by its shebang, so register the interpreter recorded at `ducktools.python` as the command, with the wrapper path and then `serve` as its arguments. No project_path or PYTHONPATH is needed — every MCP call carries its own project_path argument"
      - id: memory
        description: write the framework's own AGENTS.md — at the root of the clone — into any persistent memory location available to the current model
      - id: claude
        description: "register via mcp method first, then make sure ~/.claude/CLAUDE.md carries the duckspec section, under the heading `## duckspec projects`: create the file when it does not exist, add the section when the file has no heading of that name, and otherwise change that one section only where it lacks or contradicts what this method asks of it — other wording is no reason to rewrite it, and an install that finds nothing to change writes nothing and asks nothing. The section runs from its heading to the next heading of the same or a higher level, or to the end of the file. The heading is how a later install finds the section again, so it is never renamed. Nothing else in the file is changed or removed: it holds the user's own instructions for every project, and a section that looks like an earlier install's entry for one project may just as well be one they wrote — name any such section to the user when telling them what the install did, and leave it to them. Show the user any change before writing it. The section says only what cannot be discovered at runtime: that projects on this machine are managed with @Duckspec and that a project is loaded before work in it, because its terms carry the rules to follow there; that the MCP tools are preferred and @DuckToolsApp#components#cli exposes the same operations as a fallback, given with the absolute path to invoke it by when the binary is not on the executor's PATH. Point at @DuckToolsApp#components#cli#functions#list-projects and @DuckToolsApp#components#cli#functions#help as worked examples instead of explaining either. Never write the project list or the names of individual tools into the file — both are discoverable at runtime, and a copy in external memory goes stale on the next change while nothing reports that it has. Close with the one executor-specific note worth keeping: @DuckToolsApp#components#cli#functions#load-project output is large enough that this executor may divert it to a file, which must then be read in full before proceeding."
goals:
  - Provide a lightweight project overview (root file + term list with descriptions) as the primary entry point
  - Load selected @Term definitions by name, on demand, each with the `extends` chain it inherits from, naming rather than loading the terms it merely mentions
  - Search across term content by keyword to locate relevant terms without loading everything
  - Expose a consistent interface as CLI commands and as an optional MCP server
  - Support any model or runtime without model-specific integration
recipes:
  - id: run
    description: Runs a DuckTools command directly via Python without installation
    arguments:
      - id: command
        description: ducktools command to run; see cli#functions
      - id: project_path
        description: path to a @DuckspecProject .yaml file
    instructions:
      - "If `ducktools.bin` is set in `~/.duckspec/settings.json`, run `ducktools <command> <project_path>` directly. Otherwise run `PYTHONPATH=<ducktools.src from settings, or the local ducktools/src> python3 -m ducktools <command> <project_path>`."
  - id: install
    description: Installs DuckTools so it is available in future sessions
    arguments:
      - id: method
        description: installation method, one of @DuckToolsApp#lists#installation-methods; @Duckspec#recipes#install says which one fits the executor
    instructions:
      - Ask the user for `method` if not provided; execute the chosen method from @DuckToolsApp#lists#installation-methods
  - id: create_workspace
    description: Adds a new named workspace to the shared registry, holding only the framework itself until projects are added to it
    arguments:
      - id: name
        description: unique name for the new workspace
    instructions:
      - Invoke @DuckToolsApp#resolver#create_workspace(name=<name>)
  - id: use_workspace
    description: Switches the active workspace — the one whose `projects` registry is used to resolve `repository` URL references
    arguments:
      - id: name
        description: name of an existing workspace to activate
    instructions:
      - Invoke @DuckToolsApp#resolver#use_workspace(name=<name>); if it reports no such workspace, tell the user and stop
  - id: list_projects
    description: Displays every project registered across all workspaces, grouped by workspace, marking which one is active
    instructions:
      - Invoke @DuckToolsApp#resolver#list_projects() and output the result
tests:
  - id: load-project
    description: loads the root project file content and shows the project's parts and other terms with their edges, connected projects as single nodes, recipes, the framework's vocabulary and project-wide rules
    command: "python3 -m ducktools load-project Duckspec.yaml"
    expect: output contains the root file content followed by a Workflow section naming @DuckspecWorkflow, then Parts, Recipes, Vocabulary from @Duckspec and Rules (project-wide) markdown tables, every row in the same order on every run
  - id: list-terms
    description: lists reachable term names, file paths, and descriptions
    command: "python3 -m ducktools list-terms Duckspec.yaml"
    expect: output contains at least one `| @<TermName> |` row with a non-empty description column
  - id: load-terms
    description: loads specific terms, each with its `extends` chain, naming the other terms it mentions without loading them
    command: "python3 -m ducktools load-terms Duckspec.yaml DuckToolsApp"
    expect: output contains `--- @DuckToolsApp [` followed by the blocks of its ancestors `@Application`, `@Software`, `@DesignPattern` and `@Term`, and a References line naming mentioned terms; contains no `--- @` block for a term outside that chain
  - id: grep
    description: searches the spec by words and lists the matching elements, each by its full path, with the words in context
    command: python3 -m ducktools grep Duckspec.yaml 'shallowest match'
    expect: output contains an Element/Matches/Context table in which every element is a full path opening with a term name, at least one of them starting with `@DuckToolsApp#components#resolver#functions#`, and each context holds the query's words
  - id: resolve-path
    description: resolves a Term#path reference to a single nested element's raw block, without loading the whole term or its transitive dependencies
    command: python3 -m ducktools resolve-path Duckspec.yaml DuckspecProject#recipes#validate && { python3 -m ducktools resolve-path Duckspec.yaml DuckspecProject#validate; echo "exit $?"; }
    expect: "the first output contains the `- id: validate` block and its `instructions:`, and does not contain unrelated recipes such as `update_readme`; the second, a path that skips the `recipes` level, is refused with `not found` naming `DuckspecProject#recipes#validate` as the full path that fits, and its exit status is 1 (`exit 1`)"
  - id: expand
    description: "expands a term and a nested element, and opens an element with resolve-path: the children come with their descriptions and references, and both commands bring the guidelines written above the element, codestyle for code, and the goals of the part an element inside a @Software belongs to"
    command: python3 -m ducktools expand Duckspec.yaml DuckToolsApp && python3 -m ducktools resolve-path Duckspec.yaml DuckToolsApp#components#resolver#functions#expand
    expect: the expand output lists the components of @DuckToolsApp each with its description, and both outputs end with a `Rules that apply here` section holding @DuckToolsApp's own guideline that only the Python standard library is used
  - id: list-projects
    description: lists every registered project grouped by workspace, as a markdown table, read-only
    command: "python3 -m ducktools list-projects"
    expect: exits successfully; prints `(no workspaces registered)` if ~/.duckspec/settings.json has no workspaces, otherwise a `## workspace-name` heading per workspace (active one marked) followed by a Project/Repository/Path/Description table, or `(empty)` if that workspace has no projects
  - id: verify-project
    description: runs the mechanical consistency pass over @Duckspec's own spec — the framework validating itself
    command: "python3 -m ducktools verify-project Duckspec.yaml"
    expect: exits 0 and prints `no findings` — the framework's own spec is internally consistent
  - id: wiring
    description: "every public resolver method is reachable from both front ends, and every CLI command and MCP tool has a spec entry and every entry names one that exists — a method can exist, be documented, and still be unreachable from outside, and a command can exist and go undescribed, which the source check cannot see since it looks only from the spec towards the code"
    command: "python3 ducktools/check_wiring.py"
    expect: "prints `no orphans` and exits 0; on failure names each front end with the methods it does not call, and each command or tool missing from the spec or described but absent"
  - id: operations
    description: every public resolver method returns what it claims to on a known project, and every CLI command and MCP tool shows it — reachability is check-wiring's job, correctness is this one's
    command: python3 ducktools/check_operations.py
    expect: prints one line per method, command and tool with its verdict, then `all operations pass`, and exits 0; on failure names each one and how its result differed, and names any public method, CLI command or listed MCP tool that no check ran
  - id: yaml-valid
    description: "every term file of the framework parses as YAML — what the Term format rule promises and what a bare `@` reference used to break everywhere. Needs PyYAML, which ducktools itself never imports; where it is missing the test cannot run and says so."
    command: python3 -c "import glob, yaml; [yaml.safe_load(open(f, encoding='utf-8')) for f in glob.glob('**/*.yaml', recursive=True)]; print('all term files parse')"
    expect: prints `all term files parse` and exits 0; on failure PyYAML names the file, line and column it could not read
  - id: install
    description: install-script wires this clone up on a machine with nothing installed — a throwaway HOME stands in for one, so the real registry is never touched. It is the one script every new user runs first, and it writes the wrapper, the settings file and the framework's registration, none of which any other test reaches.
    command: sh -c 'h=$(mktemp -d) && HOME=$h bash ducktools/install.sh "$PWD" "$h/bin" >/dev/null && HOME=$h "$h/bin/ducktools" list-projects; s=$?; rm -rf "$h"; exit $s'
    expect: exits 0 and prints a `## default (active)` heading whose table lists `@Duckspec` at this clone's `Duckspec.yaml`
  - id: batch
    description: a batch of edits is applied in one call, and a batch whose last operation is refused leaves every file as it was
    command: python3 ducktools/check_operations.py
    expect: "the batch checks report ok: a two-operation batch applies both edits, and one ending in a refused operation changes nothing"
components:
  - id: resolver
    src: ducktools/src/ducktools/resolver.py
    type: Python module holding the one Resolver instance every interface calls
    description: Single shared instance holding every read operation over @DuckspecProject and @Term files — discovery, term-map construction, reachability, rule collection, path resolution, mechanical verification, and workspace registry access. Owns all file and settings I/O; cli and mcp_server are thin presentation layers over it and hold no logic of their own, which is what keeps the two interfaces from drifting apart.
    functions:
      - id: _parse_list_block
        description: Module-level pure function. Finds the block matching `pattern` in `content`, returns a list of strings — one per item (lines starting with `- `, stripped of the leading `- ` and unquoted as YAML reads it). Returns an empty list if the block is absent. Used by callers to extract `guidelines:` and `software:` from already-read file content.
        arguments:
          - id: content
            description: raw text content of a term .yaml file
          - id: pattern
            description: compiled regex matching the target block (e.g. _GUIDELINES_BLOCK or _AI_INSTRUCTIONS_BLOCK)
      - id: _parse_dict_list_block
        description: "Module-level pure function. Parses a `<key>:\\n  - <key_field>: ...\\n    description: ...` block into a list of `{key_field: value, description: value}` dicts, splitting on item boundaries. Shared by _parse_recipes (key_field='name', block=_RECIPES_BLOCK) and _parse_references (key_field='repository', block=_REFERENCES_BLOCK) so the two identically-shaped list-of-dicts formats aren't parsed twice. Returns an empty list if the block is absent."
        arguments:
          - id: content
            description: raw text content of a term .yaml file
          - id: pattern
            description: compiled regex matching the target block (_RECIPES_BLOCK or _REFERENCES_BLOCK)
          - id: key_field
            description: "name of the first sub-field per item — 'name' for recipes, 'repository' for references; also the key each result is stored under"
          - id: key_pattern
            description: "optional regex alternative matched instead of `key_field` when reading the item, while the result is still stored under `key_field`. Recipes use `(?:id|name)` so entries renamed to `id:` and entries still on `name:` both parse, and callers keep reading results under 'name'"
      - id: _parse_recipes
        description: "Module-level pure function. Thin wrapper — calls _parse_dict_list_block(content, _RECIPES_BLOCK, 'name', key_pattern='(?:id|name)')."
        arguments:
          - id: content
            description: raw text content of a term .yaml file
      - id: _parse_extends
        description: "Module-level pure function. Returns the term name in this term's `extends:` field — quoted or bare, with the leading `@` stripped — or None if absent."
        arguments:
          - id: content
            description: raw text content of a term .yaml file
      - id: _own_rules
        description: Module-level pure function. Extracts this one term's own `guidelines:` (via _parse_list_block), tagged with `term_name` and type 'Guideline'. Does not walk `extends` — inheritance is the caller's job (see _rules_tree, _project_wide_rules).
        arguments:
          - id: content
            description: raw text content of a term .yaml file
          - id: term_name
            description: name to tag each returned rule with
      - id: _parse_references
        description: "Module-level pure function. Thin wrapper — calls _parse_dict_list_block(content, _REFERENCES_BLOCK, 'repository'). `references:` entries are never resolved to a file or loaded — they're pure data (a repository URL + a description) surfaced as-is, the counterpart to `uses:` for connections that are informational only."
        arguments:
          - id: content
            description: raw text content of a term .yaml file
      - id: _load_settings
        description: "Reads `~/.duckspec/settings.json` (stdlib `json`, no YAML parser needed — this file is tool-managed, never hand-authored). Returns `{active_workspace: str|None, workspaces: dict, ducktools: dict}`; missing keys are defaulted to empty/None so callers never need to guard. Returns the same default shape if the file is absent or unparseable."
      - id: _save_settings
        description: "Writes the given settings dict back to `~/.duckspec/settings.json` as indented JSON, creating the parent `~/.duckspec/` directory if needed."
        arguments:
          - id: settings
            description: the full settings dict, as returned by _load_settings
      - id: _active_projects
        description: "Extracts the active workspace's `projects` map from a settings dict (as returned by _load_settings) and returns it as `dict[str, Path]`. Returns an empty dict if there is no active workspace or it has no `projects` entry."
        arguments:
          - id: settings
            description: settings dict, as returned by _load_settings
      - id: _resolve_project
        description: "Turns whatever a command was given into a project file path. A value containing a path separator or ending in `.yaml` is used as a filesystem path, as before. Anything else is looked up in the active @Workspace by the stem of each registered project's path, so `Duckspec` and `Borshevik` work as arguments from any directory. Returns the value unchanged when no registration matches, which keeps the failure a plain missing-file error rather than a confusing lookup one. The point is that no command's meaning depends on the working directory."
        arguments:
          - id: value
            description: a filesystem path or the identifier of a project registered in the active workspace
      - id: _resolve_entry
        description: "Resolves a single `uses:` entry to a local Path. If `sub` starts with `http://` or `https://`, looks it up in `workspace` — the active workspace's projects, which every caller reads fresh via _load_settings/_active_projects rather than caching, so use_workspace/add_project take effect immediately; prints a warning and returns None if not found. Otherwise resolves `sub` relative to `base` (the directory of the current file) and normalizes it via `.resolve()`, so a `../`-containing entry (e.g. a sub-project's `uses:` circularly referencing back to its own parent) yields the canonical absolute path rather than a literal `ducktools/../Duckspec.yaml`-style string. Returns None if the entry cannot be resolved."
        arguments:
          - id: sub
            description: raw string from the `uses:` list — either a relative path or a repository URL
          - id: base
            description: directory of the file containing the `uses:` entry
          - id: workspace
            description: repository URL -> local path map to look URL entries up in, as returned by _active_projects
      - id: _collect
        description: "BFS from `project_path`, deduped by resolved path. For each visited file: if it declares `terms_folder:`, records the resolved directory (if it exists) as a term folder; if it has a `uses:` block, resolves each entry via _resolve_entry (against the active workspace's projects) into `project_files` and queues the resolved files for further traversal. Returns `(term_folders, project_files)` — the raw ingredients _build_term_map combines into the name→path map."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
      - id: _build_term_map
        description: "The root project file itself is entered first, keyed by its own filename stem — it is a term of its own project like any other, and every other entry is discovered by reading *its* content, so nothing else can add it. Calls _collect, then builds the rest of the name→path map: `project_files` (from `uses:`) are added next via setdefault, so they win on conflict; then every `.yaml` file in each term folder and in its subfolders, at any depth, is added in sorted order — a project's terms are grouped in subfolders of one `terms_folder` rather than split into sub-projects (see @DuckspecProject's guidelines), printing a warning (not an error) if a name collides with a different file already in the map."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
      - id: _reachable
        description: "BFS from `project_path` computing the subset of `term_map` actually reachable — distinct from _collect/_build_term_map's raw discovery. For each visited file's content: resolves every `uses:` entry the same way as _collect and queues newly found files; separately, scans the entire content for any `@<TermName>` mention — not only inside a `uses:`/`software:` list, anywhere in prose (a guideline, a description, an instruction) — and for each name present in `term_map`, adds it to the reachable set and queues its file too. This mention-based half is why a term becomes reachable simply by being referenced in passing, without being formally declared in any structured list. Used by _walk_terms unless include_all is set, in which case the full term_map is used instead and this function is skipped entirely."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: term_map
            description: name→path map, as returned by _build_term_map
      - id: _extends_chain_from
        description: "Walks a term's `extends:` chain upward starting from an already-known (name, content) pair, stopping at a name with no `extends`, a name not in `term_map`, or a cycle. Returns `[(name, content), ...]` starting with the given term itself. The caller supplies the starting content directly (rather than looking it up via term_map) so this also works for a root project file, which is often not itself a key in its own term_map."
        arguments:
          - id: start_name
            description: name of the term to start from
          - id: start_content
            description: that term's already-read content
          - id: term_map
            description: name→path map, as returned by _build_term_map
      - id: _rules_tree
        description: "Own + inherited rules for one term, kept separate rather than flattened. Looks up term_name in term_map, walks its extends chain via _extends_chain_from, and returns `{own: [...], inherited: [{term, rules}, ...]}` — own is term_name's own _own_rules, inherited is one entry per ancestor that has any (ancestors with none are omitted). Returns `{own: [], inherited: []}` if term_name isn't in term_map or its file can't be read."
        arguments:
          - id: term_name
            description: name of the term to compute the tree for
          - id: term_map
            description: name→path map, as returned by _build_term_map
      - id: _project_wide_rules
        description: "Rules that apply regardless of which term is currently in play: the root project's own extends chain (via _extends_chain_from) plus the _own_rules of every file directly named in the root's `uses:` block — one hop only, not those files' own further reachable terms. Deliberately narrower than collecting rules from every reachable term; term-scoped rules (a single extension's implementation guidelines, say) now travel with that term instead, attached by load_terms, so they surface when the term is actually loaded rather than on every load_project call."
        arguments:
          - id: root
            description: resolved path to the root @DuckspecProject file
          - id: root_content
            description: that file's already-read content
          - id: term_map
            description: name→path map, as returned by _build_term_map
      - id: _walk_terms
        description: "Generator that builds the term map and reachable set, then yields (name, path, content) for each reachable term, reading each file exactly once. All content-extraction methods use this as their single traversal primitive to avoid re-reading files. If include_all is true, yields all terms in the term map instead of only reachable ones."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: include_all
            description: if true, yield all terms in the term map; default false
      - id: load_project
        description: "The top level of the project, and nothing below it: what a reader needs to know which parts exist and where to go next, without the content of any of them. Reads the root project file, then calls _walk_terms() once. Splits this project's own terms — those whose file lies under the root file's directory — into `parts`, the ones its `software:` lists, and `terms`, the rest; each carries its description in full, and `refers_to` and `referred_by`, computed from the `@<TermName>` mentions in its file (_term_edges), naming the other terms of this project and of the projects it uses that it mentions, and the terms of this project that mention it. Framework terms are left out of both edge lists, since nearly every term mentions some. Other projects appear in `projects`, one node each — the projects named by the root's `uses:` (the framework excepted) and by any `references:` of this project's own terms — with name, repository, how it is connected and its description; their terms resolve for every operation but are not listed, so a project that uses a large one does not carry that one's whole term table on every load. `vocabulary` lists the framework's terms with their descriptions: the catalogue a writer picks a component's `type:` from. `recipes` holds those of this project's own terms and of the framework terms this project's own extend (e.g. @DuckspecProject, @Software), not those of other projects or of framework terms nothing here extends. `rules` comes from _project_wide_rules. Returns {root_content, workflow: {name, note} (see _workflow_hint), parts, terms: list[{name, path, description, refers_to, referred_by}], projects: list[{name, repository, connection, description}], vocabulary: list[{name, path, description}], recipes: list[{term, name, description}], rules: list[{term, type, text}]}, every list in a stable order. The next step below it is @DuckToolsApp#resolver#expand."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
      - id: _description
        description: "Module-level pure function. A term's `description` as YAML reads it: unquoted, and whole when it is a block scalar (`|`, `>`) or a plain value continued over several lines — read through _element_fields then, since the one-line pattern would give the block indicator itself. Every place that shows a term's description goes through it: load_project's parts, terms, vocabulary and connected projects, list_terms and list_workspaces."
      - id: _term_edges
        description: "Module-level pure function. For the given own terms and their file contents, the edges load_project shows: `refers_to` of each term is every other term name in the map it mentions as `@<TermName>`, in order of first mention, leaving out itself, the terms of its `extends` chain and the framework's terms; `referred_by` is the reverse, among the given terms only. Mentions are connections the text already states, so the graph costs no field of its own and cannot drift from the prose it comes from."
      - id: _workflow_hint
        description: "Which term the root's `workflow:` names, plus a note that it has not been read. Opening a project is not the moment to load the workflow: nothing is in hand yet, so its steps and rules would be context spent on a question nobody has asked. The name and the pointer are enough for a reader to fetch it once there is work to place among the steps. Returns {name: str|None, note: str}, with name None when the project declares no workflow or names no type in it."
        arguments:
          - id: root_content
            description: raw text of the root project file
      - id: load_workflow
        description: "The project's configured workflow — {name, configuration, terms}, where `configuration` is the root's own `workflow:` block verbatim (the overrides it sets, such as main_branch and versioning) and `terms` is load_terms of the workflow term, so its steps, properties, recipes and rules arrive with the chain they are inherited through. Separate from load_project on purpose: a workflow answers what to do next with work in hand, and there is no work in hand when a project is opened, so its steps would be context spent on a question nobody has asked. Nothing beyond locating the term is done here — which terms come back is load_terms' business, and the two behaving differently would be a difference with no reason behind it. Returns {error} when no workflow is configured or the term it names is absent from the map."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
      - id: list_terms
        description: "Calls _walk_terms() and extracts description from each file's content using regex `^description:\\s*(.+)$` (first match, stripped); returns a list of {name, path, description} sorted by name. If include_all is true, returns all terms in the term map instead of only reachable ones."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: include_all
            description: if true, return all terms in the term map regardless of @<TermName> mentions; default false
      - id: load_terms
        description: "Each requested term followed by its `extends` chain, as a list of {name, path, content} — plus, on the requested terms only, a `rules` key holding the {own, inherited} tree from _rules_tree, and a `references` key naming the terms it mentions without loading them. Unrecognised names are silently skipped. The chain is inlined because a term is incomplete without it: its inherited properties and recipes are its own members. Everything else it mentions is a neighbour, returned by name so the reader can descend into whichever branch the question is actually about. Following those mentions instead, as this did before, made every call return the whole corpus — a mention is not a dependency, and a guideline that lists term names as examples of names taken on GitHub dragged those terms in as if the workflow were built on them. Measured on this project, reading @WorkflowStep cost 57 terms and 182K characters, the same figure every other term produced, because the reference graph is a dense mesh through the @Term and @DuckspecProject hubs rather than a tree; the chain costs 2 terms and 6.5K. That is what makes the corpus navigable by depth: each call shows where it is possible to step, and only the step taken is paid for."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project); used to build the term map
          - id: term_names
            description: list of term names (without @) to load
      - id: grep_terms
        description: "Search by words across every reachable term (every term with `all`). The query is split into words, case-insensitive; an element matches when its own text — its fields and the lists inside it, but not the entries nested in it, which are elements of their own (_element_owners) — holds all of them, as substrings, so `crash` also finds `crashes`. Each match comes back as {ref, term, path, line, matches, snippet}: `ref` is the element's full path, which resolve_path, expand and the editing operations take as it is; `matches` counts the occurrences of the words, and results are ordered by it; `snippet` is the text around the first occurrence. It lists elements rather than lines because the spec's descriptions are one long line each: a line cut at its start hid where the word was, and a line is not what the reader opens next — the element is."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: query
            description: one or more words, case-insensitive; an element matches when its own text holds all of them
          - id: include_all
            description: if true, search all terms in the term map instead of only reachable ones; default false
      - id: _find_named_blocks
        description: "Module-level pure function. Returns the entries carrying this id at the shallowest depth any of them has, as a list of raw blocks. Used only for the pointers prose writes, which may skip levels, when verify_project checks them — the tools resolve full paths through _child — so the search reaches every depth; of what it finds, an entry nested inside another one's subtree is not a rival of one higher up — the higher one is what the path names, as with keys (_extract_key_block) — so only the shallowest matches are kept. Counting them is what separates an unambiguous path from one that silently resolved to whichever entry happened to come first: two entries at the same depth are ambiguous, one above another is not. Counting matches at every depth made an element unaddressable whenever some deeper element shared its id — a component `windows` beside a registry's function `windows`, with no path left that could name the component. Feeds verify_project's `ambiguous-path-ref` and `broken-path-ref` checks of the pointers prose writes; the tools no longer resolve through it."
        arguments:
          - id: content
            description: raw text to search — a whole term file's content or a previously narrowed block
          - id: name
            description: the id to match
      - id: _child
        description: "Module-level pure function. One step of a full path: the child of a block named by a segment, among its direct children only — a term's or an entry's own fields at its field column, the items of a key holding a list (by `id`/`name`, or by position for a digits-only segment), the keys of a key holding a mapping. Nothing below the next level is looked at, so a name used again elsewhere in the term is never a rival; two items of one list under one id are refused as ambiguous. Returns (child, None), (None, why) or (None, None) when there is no such child. The one step resolve_path, _locate and _rules_for all take."
      - id: _all_named
        description: Module-level pure function. Every entry and every block key called a given name at any depth of a block — what a path that skipped a level may have meant, for _path_hint. Only hints are built from it; no path is resolved through it.
      - id: _candidate_paths
        description: Module-level pure function. The full `#`-path of each of the given blocks of a term file — every slot and parent named from the term down, e.g. `<TermName>#components#indicator` and `<TermName>#behaviour#indicator` — found by walking up the indentation from each block's first line; blocks with the same text get distinct paths, since each is looked for after the one before. Used by _path_hint.
      - id: _fit_paths
        description: "Module-level pure function. The full paths a path that may skip levels can mean, carried through to its last segment: each segment taken as a direct child where there is one and as any element so named below otherwise (_all_named), the ends named by _candidate_paths. Shared by _path_hint, for refusals, and by _full_ref, for the pointers expand shows."
      - id: _full_ref
        description: The full path, as `@<TermName>#…`, of what a pointer written in prose names — `resolver#expand` written in this term becomes `@DuckToolsApp#components#resolver#functions#expand` — when exactly one element fits (_fit_paths), or None. expand shows the pointers in an entry's `refers to` this way, so the next call opens one of them directly instead of being refused and pointed onward.
      - id: _path_hint
        description: "Module-level pure function. For a path that skipped levels, the full paths it may have meant, carried through to its last segment: each remaining segment is taken as a direct child where there is one and as any element so named below otherwise (_all_named), and the ends are named by _candidate_paths. So `WaydroidApp#control#install` is answered with `WaydroidApp#components#control#functions#install`, and of two elements called `indicator-model` only the one with a `diff` below it fits `…#indicator-model#diff`: one refusal gives the caller the path to ask for, not just the next level."
      - id: _duplicate_ids
        description: "Module-level pure function. (line index, id) of every entry whose id an earlier entry of the same list already has, telling lists apart by their item column and by what encloses them — a line less indented than a list, or a key at its column, closes it. What verify_project reports as `duplicate-id`: the one thing that keeps a full path from naming exactly one element."
      - id: _element_owners
        description: Module-level pure function. For each line of a term, the full-path segments of the innermost named element the line belongs to — the entry whose own text it is, slots included — or none for the term's own lines; a key block inside an entry (`rejected:`, `instructions:`) is part of the entry. What grep_terms groups text by, and what names the element of a finding.
      - id: _with_elements
        description: "Module-level pure function. Gives every finding of verify_project and verify_source that has a line a `ref`: the full path of the element the line belongs to (_element_owners), so a finding is opened and fixed by path rather than by counting lines."
      - id: _extract_key_block
        description: "Module-level pure function. The counterpart to _find_named_blocks for plain mapping keys, and like it used for the pointers prose writes — `functions:`, `properties:`, `guidelines:` — which are not list entries and so carry no `- id:` to match. Scans for `<name>:` at any indentation and, of the matches, takes the shallowest — the element's own key when it has one, before any nested in the entries below it; taking the first in the file read `<TermName>#fields#<id>` in whichever component's `fields:` came first, and found nothing when the term's own block came after the components. It captures that line plus every following line indented deeper than it, stopping at the first line at the same or shallower indentation. A scalar key (e.g. `src: ../src/`) yields just its own line. Returns None if no such key exists."
        arguments:
          - id: content
            description: raw text to search — a whole term file's content or a previously narrowed block
          - id: name
            description: the key name to match, without the trailing colon
      - id: resolve_path
        description: "Splits `ref` on `#`; the first segment (leading `@` stripped if present) is the term name, the remaining segments are a path within it. Looks up the term's file via the term map — built the same way as load_terms, but only that one file is read; transitive @<TermName> dependencies are not followed. Starting from the full file content, takes one segment at a time as a direct child of the element before it (_child): `ref` is a full path naming every level, slots included. A segment that is not a direct child is refused with the full paths that fit (_path_hint) rather than looked for at any depth: the search at any depth took the shallowest match, so `BorshevikWorkspaceManagerExtension#indicator-model` opened the extension's test of that name instead of the module nested in its indicator component, with nothing to say so; and earlier, returning whichever match came first hid a stale duplicate of an entire recipe in @DuckspecProject across five releases. Two entries of one list under one id are refused as ambiguous, and verify_project reports them as `duplicate-id`. The element comes with the rules that apply to it (_rules_for): whatever path led to an element, the guidelines written above it arrive with it, where before they came only with the whole term from load_terms and an agent opening one component by the recommended route never saw them. Returns {name, path, ref, content, rules, codestyle, goals} where content is the fully-narrowed block (or the whole file when `ref` has no path segments) and rules, codestyle and goals are _rules_for's, {name, path, ref, error} when a segment is ambiguous, or None when the term is not in the term map or a segment does not resolve."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project); used to build the term map
          - id: ref
            description: "a full path naming every level, `<TermName>#<slot>#<id>...` (e.g. `DuckspecProject#recipes#validate` or `DuckToolsApp#components#resolver#functions#load_project`); leading `@` on the term name is optional"
      - id: expand
        description: "The step between load_project and one element read whole: the children of one element, each with its id, its `type:`, its description in full, how many entries each of its own slots holds, and what it refers to — the `@<TermName>` mentions and the `#`-path pointers in it, each pointer given as the full path it names when exactly one element fits (_full_ref), and as written otherwise. `ref` is a term name or a full path into a term, taken as resolve_path takes it. Each slot's heading says how its entries open — `<ref>#<slot>#<id>`, or `<ref>#<id>` when `ref` already names that slot — so the next call is a full path without guessing; the slot's `opens` carries that prefix, since repeating the slot gave `HomeTubeApp#behaviour#behaviour#<id>`, a path that opens nothing. For a term or an entry, children are the entries of each of its slots, slot by slot; scalar fields are shown as they are; a list of plain strings is shown whole, except `guidelines` and `codestyle`, which arrive in `rules` and `codestyle` instead. The element's own description comes first. Followed by the rules, codestyle and part's goals that apply to the element, from _rules_for. Exists because a term can be far larger than anything a reader needs at once — the Workspace Manager's extension term is some 200 KB, expanded about 40 KB, and the one component the work concerns a few KB — and without a middle step the only choices were a one-line description and the whole term. Returns {name, path, ref, description, fields: list[{key, value}], slots: list[{slot, opens, entries: list[{id, type, description, counts, refers_to}]}], strings: list[{slot, items}], rules, codestyle, goals}, or None / {error} as resolve_path does."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: ref
            description: a term name, or a full path naming every level, `<TermName>#<slot>#<id>...`; leading `@` optional
      - id: _rules_for
        description: "The rules that apply to the element a `#`-path addresses, for resolve_path and expand. `rules`: the guidelines of every element on the path from the term down to the element, the element's own included, then the term's own and those of its `extends` chain (_rules_tree) — leaving out the terms whose rules _project_wide_rules already gives load_project, so @Term's and @Duckspec's are not repeated on every call; each tagged with where it comes from. `codestyle`: when the element lies in the code of a @Software — the term extends @Software, and the path does not go through `behaviour`, `tests` or `decisions` — the `codestyle` of that term and of the project's root file; empty otherwise. Codestyle is attached to the code it governs rather than left to @Software#build because an agent sketching or reviewing code does not run build, and in an experiment an agent that never opened codestyle wrote a handler with none of the project's logging. `goals`: when the element lies inside a @Software — any slot, `behaviour` and `tests` included — the `goals` of that term; empty for the term itself, whose content carries them already, and outside a @Software. They come with the element rather than with load_project because they decide between two ways of doing the work in a part, which is when the part's element is open; in the overview, where the question is which part to go to, they mostly restate the description and cost every session their length. Returns {rules: list[{source, text}], codestyle: list[{source, text}], goals: list[{source, text}]}."
        arguments:
          - id: project_path
            description: as for resolve_path
          - id: ref
            description: as for resolve_path
      - id: _line_of
        description: "Module-level pure function. Converts a character offset within `content` into a 1-based line number by counting newlines before it. Used by verify_project to anchor findings to a line; only called for checks whose regex already yields an offset, so checks driven by the block parsers report no line rather than paying for one."
        arguments:
          - id: content
            description: raw text the offset refers to
          - id: pos
            description: character offset into content
      - id: _duplicate_terms
        description: "Calls _collect() and re-walks the same `*.yaml` globs it discovered, returning a list of {name, path, first_path} for every term name that appears in more than one file. Deliberately separate from _build_term_map — that method resolves collisions silently (first wins) and is on the hot path of every other operation, so it stays untouched; only directory listings are re-read here, never file contents."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
      - id: _slot_element_types
        description: "Module-level pure function. Maps slot name -> element @Term name for every slot this term's `properties:` declares with an explicit `type:`. Only slots holding named entries or a typed mapping carry one; a scalar field whose value happens to mention a term (`readme`, `graphic`, `when`) does not. That distinction is what the explicit declaration buys — it cannot be recovered from the slot's prose, which is how an earlier inference came to read `readme` as holding @Project entries. A slot without a `type:` is skipped rather than guessed at, so nothing inside it is checked."
        arguments:
          - id: content
            description: raw text content of a term .yaml file
      - id: _item_name
        description: "Module-level pure function. Reads the `- id:` value off the first line of an item block, stripping surrounding quotes. Returns an empty string when the block is a bare list value rather than a named entry."
        arguments:
          - id: item_lines
            description: the item's lines, first of which carries the `- id:` marker
      - id: _has_field
        description: "Module-level pure function. True when `field` is set on the item itself rather than on something nested inside it, matched at exactly the item's own field column — two past its `- ` marker. Matching at any indentation instead would let a nested component's `type:` satisfy a check against its parent."
        arguments:
          - id: item
            description: the item block as returned by _slot_items
          - id: field
            description: field name to look for
          - id: item_indent
            description: indentation of the item's `- ` marker
      - id: _slot_items
        description: "Module-level generator. Yields (item_name, item_block, item_indent) for every named entry under every occurrence of `<slot>:`, at any depth — a `components:` nested three levels down is walked like a top-level one. Items are split only on `- ` at the slot's own item column; splitting on any `- ` would turn a nested function's arguments into entries of the enclosing slot. Bare string entries yield no name and are skipped by callers, since those slots hold values rather than elements."
        arguments:
          - id: content
            description: raw text to scan
          - id: slot
            description: slot name whose entries to yield
      - id: _slot_mapping
        description: "Module-level generator. The mapping counterpart of _slot_items: yields (keys, own_type, indent) for every occurrence of `<slot>:` whose body is a block of `key: value` lines rather than `- ` entries, where `keys` are the mapping's own keys at its first key's column and `own_type` is the @<TermName> named by its `type:` key, if any. Occurrences whose body starts with `- ` are left to _slot_items, so a slot is read as one shape or the other and never both. This is what lets `settings:`, `workflow:` and `versioning:` be checked at all — they hold a single mapping, so the entry-based walk finds nothing in them and reports nothing, whether or not their contents are valid."
        arguments:
          - id: content
            description: raw text to scan
          - id: slot
            description: slot name whose mappings to yield
      - id: _function_sites
        description: Module-level generator. Yields (function_id, line_number, srcs, type_name) for every entry of a function-holding slot, carrying the `src:` and `type:` of the nearest enclosing component rather than the term's top-level ones — for a @Software spanning a dozen files those would name the wrong file or none. `srcs` is a list because a `src:` may name one path or several (see _src_values), and a function is looked for in all of them. Which slots hold functions is passed in, derived from the declared element types, so a slot is recognised by what it was declared to hold and not by being named `functions`; matching the name would silently skip any other slot typed @Function, which is the same silence-means-unchecked failure the `untyped-slot` check exists to end.
        arguments:
          - id: content
            description: raw text to scan
          - id: function_slots
            description: names of slots whose declared element type is @Function or a subtype
      - id: _slot_names
        description: "Module-level generator. Yields each distinct `<key>:` header name appearing in a term at any depth, in first-seen order. Feeds the `untyped-slot` check, which needs the slots a term actually uses rather than the ones some type declares."
        arguments:
          - id: content
            description: raw text to scan
      - id: _member_names
        description: "Module-level pure function. Returns the ids declared directly in a term's `properties:` block, ignoring inheritance entirely — the raw input the re-declaration check compares across an `extends` chain."
        arguments:
          - id: content
            description: raw text content of a term .yaml file
          - id: pattern
            description: compiled regex matching the target block (_PROPERTIES_BLOCK)
      - id: _schema
        description: "Every member a thing of this type may carry — the term's own `properties:` ids plus every ancestor's, collected by walking `extends` upward. Returns an empty set for a term absent from the map, which makes the caller skip that slot rather than report every field in it as unknown. Feeds the `unknown-field` check, which composes two of these: the slot's declared element type and the type named in the entry's own `type:`."
        arguments:
          - id: term
            description: name of the term whose schema to collect
          - id: term_map
            description: name->path map, as returned by _build_term_map
          - id: cache
            description: name->content map, reused and extended so no file is read twice
      - id: verify_project
        description: "Mechanical consistency pass over the whole project — everything about a spec that can be proven true or false without reading source or judging meaning. Builds the term map once, then calls _walk_terms(include_all=true) for a single-pass traversal, and returns a flat list of {severity, check, term, path, line, message} sorted by severity then path, where severity is 'error' or 'warning', `check` is a stable slug for filtering and CI diffing, and `line` is absent when the originating check does not yield an offset. An empty list means the spec is internally consistent. Complements rather than replaces @DuckspecProject#verify_source, which covers the semantic half — whether descriptions actually match the implementation — that no regex can settle. Checks: `dangling-ref` — an @<TermName> mention with no term of that name in the map; `broken-path-ref` — an @<TermName>#<slot>#<id> reference whose segments do not resolve; `ambiguous-path-ref` — a segment matching more than one entry at the level it is searched, which the resolver would otherwise silently narrow to whichever came first; `unknown-extends` — an `extends:` naming a term absent from the map; `extends-cycle` — an `extends:` chain that revisits a term, which _extends_chain_from otherwise truncates silently; `duplicate-term` — one term name defined in several files, from _duplicate_terms; `unparsed-term` — a `.yaml` in a terms folder with no `description:` at zero indentation, which regex-based extraction would otherwise read as empty rather than as broken; `broken-uses` — a `uses:` entry that resolves to nothing, split by why: a relative path with no file at the other end is an error, since the path is simply wrong, while a repository URL absent from the active workspace is a warning, since the spec is correct and it is the environment that has not cloned or registered that project. Both were silently skipped before, which is how a sub-project could be dropped from the term map with nothing said: the entry vanished, every term it would have contributed became a dangling reference somewhere else, and the report named those instead of the one line that caused them; `broken-operation` — a workflow step whose `operation` is not a call to a recipe: not in the `@<TermName>#<recipe>(<argument>=<value>, ...)` form, naming something that is not a recipe of that term or its ancestors, or passing an argument the recipe does not declare. A reference that merely resolves is not enough here — `broken-path-ref` accepts a component that describes a pipeline file, and a step pointing at one looks implemented while nothing could ever run it; `unknown-field` — a field set on something of known type that no type it has declares, where the schema is composed from the slot's `type:` and the target's own `type:` via _schema. It covers both shapes a typed slot takes: a list of named entries, each checked on its own via _slot_items, and a single mapping such as `settings:`, `workflow:` or `versioning:`, checked as a whole via _slot_mapping, which may name its type in its own `type:` key instead of on the slot. Untyped slots are checked in neither shape — silence about a slot means nothing was verified there, not that it was found correct. A third shape is the term's own top-level fields, read against its `extends` chain: `description`, `extends`, `name` and the declaration blocks (`properties`, `recipes`, `guidelines`) are structural and always allowed, and everything else must be declared by the term or one of its ancestors. Without this the `extends:` mechanism bought nothing at the top level — a term could set any field at all, including a whole slot no type describes, and the report stayed empty; `redeclared-member` — a `properties:` entry an ancestor already declares, which inheritance would replace silently; recipes are deliberately not checked, since re-declaring them is how a subtype implements a base term's contract; `unreachable-term` (warning, opt-in via the `unreachable` argument) — a term in the map that no reachable term mentions; off by default because a framework or library project ships terms meant for consumer projects, where every one of them is legitimately unreachable from its own root and would drown the report; `untyped-slot` (warning, opt-in via the `untyped` argument) — a slot holding named entries or a mapping whose element type no type declares, so `unknown-field` skipped it entirely. This is the check that reports the checker's own blind spots: without it a clean run is ambiguous between \"everything here is correct\" and \"nothing here was read\", and a slot can hold hundreds of unverified entries while the report stays empty. Off by default because a project mid-migration lights up everywhere. `stray-text` — a line that belongs to no field, found by _stray_text: text indented under a quoted value after its closing quote, which no YAML parser reads past and the resolver's regexes read past silently, so a file could be unreadable to every other tool while this report stayed empty; only this project's own files are checked, as for the next check. `unquoted-scalar` — a value written bare that YAML would read as something other than its text, found by _unquoted_scalars: a term reference, a `: ` inside a description, a leading character YAML gives meaning to. The resolver never reads the files as YAML, so nothing here breaks; what breaks is every other tool that does, which is why no term file of the framework or its consumers could be parsed before this check existed. normalize fixes all of them at once. `foreign-workflow-ref` — a project whose `workflow:` names a @DuckWorkflow term of another git repository, or a term reference in a @DuckWorkflow subtype of this project, or in anything nested in it, naming a term whose file lies in another git repository than the workflow's own and outside the framework; a workflow is self-contained within its repository (see @DuckWorkflow's guidelines), so another project is described in words and listed in `references`. The repository is the nearest enclosing directory holding `.git`. `duplicate-id` — an entry whose id an earlier entry of the same list already has (_duplicate_ids), so the full path to either names two elements; checked in this project's own files. `dated-prose` (warning) — a `description` of this project's own that holds a date (YYYY-MM-DD) or an attribution to the author written in parentheses: a choice, a ruling or a piece of evidence written inline, which belongs in a @Decision of the element (`by`, `date`, `rejected`); descriptions inside `decisions:` are where these belong, and are not reported. Only this project's own files are checked, as for the two checks above. The reference checks carry no exemptions: every `@<Name>` mention must resolve, which is what makes the check trustworthy. Documentation about the reference syntax itself uses the angle-bracket placeholder form (`@<TermName>`) that is deliberately outside the reference grammar, so it never needs one."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: unreachable
            description: if true, also report unreachable terms; default false
          - id: untyped
            description: if true, also report slots whose contents no check reads; default false
      - id: verify_source
        description: "The mechanical half of @DuckspecProject#verify_source — the part settled without reading code. Walks the terms living under the root project's own directory (a dependency's source is its own project's business) and returns findings shaped like verify_project's. Checks: `missing-src` — a `src:` value with no file or directory at that path, skipping the one under `settings:`, which defines the source root rather than naming somewhere inside it and would otherwise be resolved against itself, and skipping values starting with `~` — a path in the user's home, such as the settings registry, which no repository ships — or `@`, which name a term rather than a path; `absent-function` — a function entry whose id appears nowhere in the source its nearest enclosing component declares, skipping ids listed in that component's type's `implicit_functions`, which name a role rather than a symbol. The match is a plain word-boundary search, and stays one deliberately: a check that tried to recognise declarations would have to enumerate every way each language lets you write one, and the first idiom it had not thought of would be an error raised against working code. What it does control is which bytes it reads — each candidate file is searched on its own (see _source_files), never as one concatenated blob, so a name defined in one module cannot answer for a component pointing at another, and unreadable files are skipped rather than decoded, so compiled bytecode cannot vouch for a name the sources have dropped. Each term resolves paths against its owning project's source root, found by _source_root. It deliberately does not judge whether a description matches the implementation — the largest part of the recipe, where every contradiction found in the Borshevik audit lived, and which no search settles."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
      - id: term_uses
        description: "Reverse index over the term map: for one term, which terms extend it, and which elements — by full path, from _element_paths — name it as their `type:` or mention it as an @<TermName> reference; an element that does both is listed as typed. Elements rather than terms, because a term that mentions another in one of forty components says nothing about which one to open. The forward direction was always available by reading a term; the reverse required grepping the whole tree, which is what made questions like \"does anything extend this\" hard to answer before changing a term."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term to find references to
      - id: term_schema
        description: "Every member a term effectively has, each tagged with the ancestor that declared it — the term's own `properties:` plus the whole `extends` chain, in chain order. Answers what a term actually carries before it is edited, which otherwise means reading every file up the chain by hand."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term whose effective schema to resolve
      - id: query_terms
        description: "Filters the term map by structural predicate rather than by text: terms with no `extends:`, terms extending a given term, terms declaring a given member, terms whose file sits under a given folder. Returns the matching names, so it answers both \"which\" and \"how many\" — the count being what sizes a change before it is made."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: rootless
            description: if true, return only terms that declare no `extends:`
          - id: extending
            description: return only terms whose `extends` chain includes this term
          - id: declaring
            description: return only terms declaring a member of this id
          - id: folder
            description: return only terms whose file path contains this fragment
      - id: slot_entries
        description: "Lists the entries of one slot in one term as {id, fields}, where fields are the keys set on the entry itself rather than on anything nested inside it. Reading a slot previously meant loading the whole term and eyeballing it, or calling the internal item walker directly."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term holding the slot
          - id: slot
            description: the slot whose entries to list
      - id: _locate
        description: "Returns (file, lines, start, end) for the element a `#`-path addresses, or an error string. Takes each segment as a direct child of the element before it through _child, the way resolve_path does, tracking line numbers so the boundaries can be edited, and refuses a segment that is not a direct child with the full paths that fit (_path_hint), keeping the `not found` the list operations and add_entry read as \"create it\". Every segment, the last included, is looked for only among the direct children of the element before it, so a key and an entry can no longer compete for one name; `slot` is still passed by the list operations and add_entry and changes nothing. That key is looked for only among the element's own fields — at the term's top level, or at the field column of the entry the earlier segments reached — and not at any depth: when the element had no such slot of its own, the first one nested anywhere below was taken, so `<TermName>#fields` with no top-level `fields:` wrote into the fields of whichever component came first, without a word. Not found there, it is reported as not found, which is what lets add_entry and add_item create the slot on the element itself; a nested slot is reached by naming the entry that holds it. Shared by every editing operation — set_field, add_entry, remove_element and the four item operations — so none of them can disagree with another about what a path points at."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`<TermName>`, or a full path naming every level, `<TermName>#<slot>#<id>...`"
      - id: set_field
        description: "Sets a field on the element a `#`-path addresses, or on the term itself when the path names only a term. Rewrites the value in place when the field is already there, inserts it immediately after the element's first line when it is not, always at the element's own field column. The value goes through _quoted: written as given, a description with a `: ` in it made the file unreadable to any YAML parser, and 27 term files across the framework and its consumers had become so. An entry's first field is written on the `- ` line itself, two columns short of its siblings, and is matched there too — looking only at the sibling column meant `id` was never found on an entry and a second `id:` was appended below the first, leaving the file with two. Structure-aware on purpose: hand-written anchors were what put a description on the wrong component and inserted the same block twice during the identity migration. When the path's last levels name mappings the file does not have yet — `<TermName>#workflow` with no `workflow:` in it, or `#workflow#versioning` — it creates them (_make_mapping) and sets the field inside: a project's `workflow` or `settings` could otherwise only be written by replacing the whole file, since a field cannot be set on an element that does not exist. Refuses when the path is ambiguous rather than editing whichever element came first. Returns the file path and whether the field was added or replaced."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`<TermName>`, or a full path naming every level, `<TermName>#<slot>#<id>...`"
          - id: field
            description: the field to set
          - id: value
            description: the value to set it to
      - id: _make_mapping
        description: Creates the mappings the last levels of a path name and the file lacks, outermost first, each as a bare `key:` at the field column of the element above it — at the end of that element, or for a term itself before its `properties` and `recipes` as add_item places a new list. Creates nothing, and returns the refusal, when a level would be an entry or a list position rather than a key, when the key already holds a value, when an entry of that name lies below (_entry_not_slot), or when _locate found full paths that fit, since the path then most likely skipped a level and the mapping meant exists further down.
      - id: add_entry
        description: "Appends a named entry to the slot a `#`-path addresses — the counterpart of remove_element, and the operation whose absence forced hand-editing whenever a term needed one more property, function or component. The path names the slot, not an entry: `DuckspecProjectSettings#properties`, `ImageManagerApp#progress-window#functions`. The slot is the one the element addressed by the path's other segments holds itself: its name is never looked for in the elements nested below that one, since a descendant's slot of the same name — a nested component's `decisions:` — is not the one meant, and narrowing into it refused the call. When the slot does not exist yet it is created on the element the path's other segments address — at the end of the file for the term itself — the way add_item creates a missing list; refusing instead left a term's first `tests:` or `recipes:`, and every new term's `steps:`, to be written by hand. The cost is that a misspelled slot name is created too, not refused; verify_project reports it as unknown-field, since no type declares the misspelling. A slot is never created under a name the path already answers with an entry: when the path's last segment names a list entry rather than a key — a component with the id `preferences`, say — a new `preferences:` slot would be a second thing under that name, which every edit reaches while resolve_path and every reader reach the entry, so the call is refused, naming the slots the entry holds (`#preferences#functions`) to add to instead. Without this a top-level `preferences:` appeared at the end of the Workspace Manager's term, holding a function and a field meant for its component, and nothing could address it to remove it. The item column is taken from the entries already there, so a nested slot lands at its own depth; an empty or new slot gets the slot's indent plus two. `fields` are written under the new `- id:` in the order given, through _field_lines. The entry goes last unless `after` or `before` names a sibling by id, which puts it directly behind or in front of that one, whatever is nested under either. Without this a slot whose order carries meaning — a workflow's `steps:` above all, where the list is the sequence — could only be extended at its end, and a step belonging in the middle had to be written by hand. Naming both, or an id the slot does not hold, is refused rather than falling back to the end, since an entry in the wrong place of an ordered slot is a wrong statement, not a cosmetic one. Refuses an ambiguous path, and refuses an id already present among the slot's entries rather than creating a second one that `#`-paths could not tell apart. Only the slot's own entries count — the `- ` lines at its item column, as for `after` and `before` — and not entries nested inside them: matching at any depth refused a component named `snapshot` because a function of another component had an argument of that name. Returns the file path and the id added."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`TermName#segment...` ending at the slot to append to"
          - id: entry_id
            description: id for the new entry, unique among the slot's existing entries
          - id: fields
            description: "mapping of field name to value written under the new entry, e.g. {description: ...}; a list or mapping value is written as a nested block via _field_lines, so `arguments: [{id: ..., description: ...}]` becomes named entries"
          - id: after
            description: id of the sibling entry to insert directly after; the entry goes last when neither this nor `before` is given
          - id: before
            description: id of the sibling entry to insert directly before; cannot be combined with `after`
      - id: _own_slot
        description: The slot a path ending in a slot name addresses, looked for only among the fields of the element the rest of the path names — at that element's own field column — never in an element nested below it, whose slot of the same name is not the one meant. Returns the slot's (path, lines, start, end), or a not-found message the caller turns into creating the slot. Falls back to _locate for a path whose last segment is a position or whose parent cannot be located.
      - id: remove_element
        description: Removes the element a `#`-path addresses, together with everything nested under it, locating its boundaries through _locate. Removing a block by regex is what left orphaned loop bodies in the resolver mid-migration; boundaries computed from indentation cannot do that. Refuses on an ambiguous path. Returns the file path and the number of lines removed.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "a full path naming every level, `<TermName>#<slot>#<id>...` — a bare term name is refused, since deleting a whole term file is not this operation's job"
      - id: _find_item
        description: "Line range of the single item matching a substring inside an already-located list, or an error string. Refuses on more than one match, so an item is never edited by position when the caller meant another one. Takes the range rather than a block name because the list has already been resolved by path — which is what lets the item operations reach lists at any depth."
        arguments:
          - id: lines
            description: the file's lines
          - id: start
            description: first line of the located list
          - id: end
            description: line after the located list
          - id: match
            description: substring identifying the item
      - id: _item_line
        description: "One list item rendered at the given column, its text written through _quoted, so an item obeys the same rule as every other value and a leading `@` or a `: ` inside it cannot turn it into something else."
        arguments:
          - id: text
            description: the item text
          - id: indent
            description: column to write the item at
      - id: _item_text
        description: "The text of one list item, the inverse of _item_line: double quotes are undone together with the escapes inside them, single quotes with their doubled `''`, and a value continued over several lines is joined the way YAML folds it. move_item takes an item's text out and writes it back through add_item, and stripping only the outer quotes left the escapes behind to be escaped a second time, so every quote in a moved rule came back with its escape doubled."
        arguments:
          - id: item_lines
            description: the item's lines, first of which carries the `- ` marker
      - id: _term_file
        description: Path of one term's file, or None when the project's term map does not hold it. Used by remove_term to find the file it deletes.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term to locate
      - id: add_item
        description: Appends a bare string to the list a Term#path addresses — a term's `guidelines:`, `codestyle:` or `goals:`, a recipe's `instructions:`, a project's `software:` or `uses:` — creating the block when absent, and inserting after a named neighbour when `after` is given. These lists hold strings rather than named entries, so set_field and remove_element have nothing to address; addressing the list by path rather than by term plus block name is what lets the same operation reach a recipe's instructions, which sit two levels down and were previously reachable by nothing.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list to append to
          - id: text
            description: the text to add, quoted automatically when it would otherwise break the line
          - id: after
            description: substring identifying the item to insert after; appended at the end when omitted
      - id: set_item
        description: "Replaces the text of the item matching a substring, in place. Without it the only way to reword an item is remove plus add, which appends — so an edit silently relocates the item to the end of its block, past whatever it was deliberately grouped with. Refuses an ambiguous match the way remove_item does."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list holding the item
          - id: match
            description: substring identifying the item
          - id: text
            description: the replacement text
      - id: remove_item
        description: "Removes the item matching a substring, deleting the block when it empties. Refuses when the substring matches more than one item rather than removing whichever came first."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list holding the item
          - id: match
            description: substring identifying the item
      - id: move_item
        description: "Moves an item verbatim from one list to another, in the same term or a different one. Reclassifying a rule — the test is whether it describes the format or directs the model — is a routine correction that by hand risks dropping or duplicating the text."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: from_ref
            description: TermName#segment... the item currently sits in
          - id: to_ref
            description: TermName#segment... to move it to
          - id: match
            description: substring identifying the item
      - id: create_term
        description: "Creates a term file in the project's terms folder with a description and a parent, both written through _quoted. The filename is the identity, so it is derived from the name rather than left to drift apart from it."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: CamelCase name, which becomes both the filename and the identity
          - id: description
            description: what the term represents
          - id: extends
            description: parent term name; defaults to Term
      - id: rename_term
        description: "Renames a term file and rewrites every `@<OldName>` reference across the project. Identity lives in the filename, so a rename is project-wide rather than a file operation; done by hand it leaves dangling references that surface only on the next check."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: old_name
            description: current term name
          - id: new_name
            description: new term name
      - id: remove_term
        description: "Deletes a term file, refusing while anything still references it. That check is the difference from deleting the file: the checker would report the dangling references afterwards, but the deletion would already have happened."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term to delete
      - id: create_workspace
        description: Adds `name` to `workspaces` in the settings file with an empty `projects` map (no-op if it already exists), then calls _register_framework on it, so a new workspace starts with the framework already registered — without it, switching to a fresh workspace drops the framework out of every project's `uses:`. Sets `active_workspace` to `name` if `activate` is true or there was no active workspace yet.
        arguments:
          - id: name
            description: unique name for the new workspace
          - id: activate
            description: if true, also make this the active workspace; default true
      - id: use_workspace
        description: "Sets `active_workspace` to `name` and saves. Returns false without writing if `name` is not a key under `workspaces`; true otherwise."
        arguments:
          - id: name
            description: name of an existing workspace to activate
      - id: list_projects
        description: "Reads the settings file, then for every workspace reads each registered project's own file: `name` is the file's stem — the project's identity, not its `name:` display label — and `description:` is extracted via regex. Returns `{active_workspace, workspaces: {name: {projects: [{repository, path, name, description}]}}}`. A project whose file is missing or unreadable still lists (`name: None`) rather than being dropped, so a stale registry entry stays visible instead of hidden."
      - id: add_project
        description: Reads `repository:` from the file at `project_path` via regex; when it is absent, keys the project by the file's `file://` URI instead, so a project is registered from the moment @Duckspec#create_project makes it rather than only once it has a remote. Resolves the target workspace (the given `workspace_name`, or the active workspace if omitted; returns None if neither resolves), creates it if missing, drops any other key in it that points at the same file — the `file://` entry a project was registered under before its repository was set, which would otherwise linger as a second, stale registration — and sets `projects[key] = str(project_path.resolve())`. Returns the key used.
        arguments:
          - id: project_path
            description: path to the @DuckspecProject file to register
          - id: workspace_name
            description: workspace to add to; defaults to the active workspace
      - id: _register_framework
        description: "Registers the framework clone that `ducktools.src` points at — the `Duckspec.yaml` beside its `ducktools/` directory, keyed by that file's own `repository` — in `workspace_name` (or the active workspace), unless that workspace already has an entry for the framework's repository URL. Every project @Duckspec#create_project makes names the framework in `uses:` by that URL, which resolves only through the workspace, so a workspace without the entry leaves every project in it with the framework's terms missing. An existing entry is left as it is: on a framework developer's machine it points at their working copy. Returns `(repository, path, added)`, or None when `ducktools.src` is unset, its `Duckspec.yaml` is missing or names no `repository`, or no workspace resolves. Module-level rather than a resolver method, since it is no command of its own: it runs where a workspace comes into being — install-script and create_workspace."
        arguments:
          - id: workspace_name
            description: workspace to register in; defaults to the active workspace
      - id: remove_project
        description: "Deletes `repository` from the resolved workspace's `projects` (given `workspace_name`, or the active workspace). Returns false without writing if the workspace or the entry does not exist; true otherwise."
        arguments:
          - id: repository
            description: repository URL of the project to remove
          - id: workspace_name
            description: workspace to remove from; defaults to the active workspace
      - id: _source_files
        description: "The files a function id is searched in for the `absent-function` check. Returns the single file when the component points at one, and every file beneath it when it points at a folder — cached per folder, since a package's functions all resolve to the same list. Skips `__pycache__`, `.git` and the other build caches outright. The folder's content used to be concatenated into one string instead, which gave the check two ways to be satisfied by something that is not there: a name defined in a sibling module, and compiled `.pyc` bytecode — stale by days against its own source — still carrying a name the sources had dropped. Returning nothing for a folder is what made the check's first run read none of @DuckToolsApp's 103 functions and still report no findings."
      - id: _source_root
        description: "The directory a term's `src:` values resolve against: the `settings.src` (default `..`) of the project that owns the term, found by _owning_project. A term no project claims — a root project file, which sits beside its terms folder rather than in it — is read as its own project, so its own `settings.src` applies; only a file that cannot be read falls back to the term's own directory."
      - id: _owning_project
        description: "The project file that owns a term: for each folder above the term, nearest first, a `.yaml` beside that folder whose `terms_folder:` names it — matched on the declaration rather than on the folder's name, which need not match the project's. A term may sit in a subfolder of the terms folder at any depth, so every folder up the path is tried. Returns the term itself when no project claims it (a root project file). Used by _source_root and by _rules_for, which takes a project's codestyle from it."
      - id: _quoted
        description: "Module-level pure function. A value about to be written into a term file, in the form YAML reads as exactly that text: returned as it is when bare text already reads that way, or when it is one complete quoted scalar already; otherwise wrapped in double quotes with backslashes and quotes escaped. What needs quoting is what _needs_quotes says. A value that is not text but a JSON boolean or null — as add_entry receives a state's `visible: false` from the MCP server — is written as YAML's own `true`, `false` and `null`; turned into text first it came out as Python's `False` and `None`, which a reader takes for a word rather than for a value. A term reference such as `@Recipe` is quoted like anything else, since YAML reserves a leading `@`; it used to be left bare on the grounds that parsers of `type:` missed a quoted one, and they now all accept both. A text that merely starts and ends with a quote, such as `\"Check for updates\" or \"Update\"`, is not one quoted scalar and is quoted as a whole — passing it through was how such a line ended up in a term file."
      - id: _src_values
        description: Module-level pure function. The paths one `src:` declares, whether it names a single path inline or lists several beneath itself. Both forms are ordinary in a spec — a component points at its own module, while the @Software above it points at every file its code is split across — but only the inline one used to be read, so every function under a list-form `src:` was left with no path at all, and a function with no path is one `absent-function` skips in silence. Five of Borshevik's image-manager functions sat in exactly that position, under a `src:` naming two files at once.
      - id: _element_paths
        description: Module-level pure function. For each line of a term, the `#`-path segments of the element that line belongs to. Keeps a stack of open elements by indentation, pushing both kinds of segment a path can name — a `key:` opening a block, and a `- id:` entry inside one — and popping whatever the current indentation has closed. Used by grep_terms to give every hit an address rather than a bare line.
      - id: _field_lines
        description: "Module-level pure function. One field written at a column, with whatever it holds nested beneath it: a mapping as keys two columns in, a list as `- ` items, and a list item that is itself a mapping with its first key on the marker line, the way every entry in the format is written. Scalars go through _quoted. What lets add_entry write an entry with nested blocks — a function with its `arguments`, a component with its `functions` — in one call instead of leaving them to be written by hand."
        arguments:
          - id: field
            description: the field name
          - id: value
            description: a scalar, a mapping or a list
          - id: column
            description: indentation of the field itself
      - id: _needs_quotes
        description: "Module-level pure function. Whether a value written bare would be read by YAML as something other than its text: it starts with a character YAML gives meaning to (`@`, a backtick, `&`, `*`, `!`, `|`, `>`, `%`, `#`, a bracket or brace, a comma, a quote), or with `- `, `? ` or `: `; it holds `: ` or ` #`; it ends with a colon; or it has leading or trailing spaces. A value that is already one complete quoted scalar needs nothing. The single definition of the rule, shared by _quoted when writing and by _unquoted_scalars when checking or normalizing, so the two cannot disagree."
        arguments:
          - id: text
            description: the value as it would be written
      - id: _unquoted_scalars
        description: "Module-level pure function. The lines of a term file whose value is written bare although _needs_quotes says it must not be, as (line index, prefix, value) — the prefix being everything before the value, so the line can be rebuilt with the value quoted. Reads `key: value` lines, `- value` items and `- key: value` entry heads. Leaves alone what it cannot rebuild on one line and so must not touch: the text of block scalars (after `|` or `>`), a quoted scalar continued over several lines — one whose opening quote does not close on its line — and a bare value continued on the next line. A value whose quote closes partway, `'Roll back' with its build time`, is not continued: a parser stops reading it at the closing quote, so it is reported and wrapped whole. Used by normalize to rewrite and by verify_project to report."
        arguments:
          - id: lines
            description: the file's lines
      - id: _quote_close
        description: "Module-level pure function. The index of the line a quoted value closes on, given the line it opens on and the value as written there: that same line when the value is one complete quoted scalar, a later one when it is continued, or None when it never closes. A continued value closes on the first line that ends with an unescaped closing quote — a doubled quote does not count inside single quotes, a backslash-escaped one inside double quotes — which is how _unquoted_scalars has always read it. Shared by _field_span and _stray_text, so the two agree on where a value ends."
        arguments:
          - id: lines
            description: the file as lines
          - id: i
            description: the line the value opens on
          - id: value
            description: the value as written on that line, starting with its quote
      - id: _stray_text
        description: "Module-level pure function. The indexes of the lines that belong to no field: text indented under a field whose quoted value has already closed, which is neither a field of its own nor a list item. YAML reads nothing after a closing quote but a comment, so a file with such a line cannot be parsed by anything but the resolver's own regexes — which read past it without a word, and that is why it needs a check. It is the shape an edit leaves when it replaces part of a value and strands the rest; a bare value continued below and a block scalar's body are values, not stray text, and are left alone."
        arguments:
          - id: lines
            description: the file as lines
      - id: normalize
        description: "Brings every term file of a project to valid YAML (see @Term): each value _unquoted_scalars finds is rewritten through _quoted, and nothing else on the line or in the file changes. Covers the root project file and every term under its directory, sub-projects included; terms reached from another project are left to that project. Idempotent, so it is safe to run on a project already in shape. Exists because until the format required it, every term reference written as a value was bare, and not one term file of the framework or its consumers could be read by a YAML parser. Returns the files changed and how many values each had quoted."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
      - id: batch
        description: "Several edits as one: a list of operations, each the name of one of the editing operations — set_field, edit_field, add_entry, remove_element, add_item, set_item, remove_item, move_item, create_term, remove_term, rename_term, or its command-line name (set, edit, add, remove, add-item, …) — with that operation's own arguments, applied in order against one project. All or nothing: the content of every file of the project's term map is kept before the first operation, and when one is refused, not found or ambiguous, every file is put back as it was and the result names the operation that failed and why, so a spec is never left half-changed. A refusal is read from the result text, which every editing operation already words the same way. Exists because a change to a spec is usually many small edits, and one call each rebuilt the term map and repeated the call's overhead every time; a batch builds nothing extra and costs one round trip. Returns {ok: bool, results: list[str], failed: int | None} — one result line per operation that ran, and the index of the failed one."
      - id: replace_term
        description: "Replaces the whole content of an existing term file — for a rewrite too large to express as field and item edits, which otherwise ended in the file being written by hand. The content is normalized on the way in, as normalize would, so it cannot leave the file unreadable, and it is refused when it has no top-level `description:`, which every term needs to be read at all. The term keeps its file and so its identity; renaming is rename_term's job. Returns the file path."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term whose file to replace
          - id: content
            description: the new content of the file
      - id: _field_column
        description: "Static. The column the fields of the element opening on a given line sit at: two past a list item's dash or a key opening a block, the line's own column for the term itself. Shared by _field_span and the insert branch of set_field."
        arguments:
          - id: head
            description: the element's first line
      - id: _field_span
        description: "Static. (first line, line past the last, column) of a field inside an element, or None when the element has none. An entry's first field is found on its `- ` line, two columns short of its siblings. The span takes in the lines the value continues on — a bare value folded below, a block scalar's body with the blank lines inside it but not the blank lines after it, and a quoted value up to the line its closing quote is on (_quote_close), blank lines inside it included — so whoever replaces the field leaves nothing of the old value behind. A quoted value has paragraphs whenever a description does, since _quoted writes one that way; ending its span at the first blank line replaced only the first paragraph and left the others stranded after the new value, where no YAML parser could read the file any more (a consumer's description was found holding its last paragraphs twice over). A quoted value ends at its closing quote and not later: text indented under it after that belongs to no field, and is reported by verify_project's `stray-text` rather than swallowed by the next replacement. The one place set_field and edit_field learn where a field is."
        arguments:
          - id: lines
            description: the file as lines
          - id: start
            description: the element's first line
          - id: end
            description: the line past its last
          - id: field
            description: the field to find
      - id: edit_field
        description: "Replaces one piece of a field's text with another and leaves the rest as it was, then writes the result through set_field, so it is quoted as any other value. Without it, a long description that gained a sentence had to be retyped whole through set_field or edited by hand outside the tools. The piece is matched against the text as it reads: a bare value folded over lines is joined, a double-quoted one decoded, a single-quoted one unescaped; a double-quoted value using an escape JSON does not share with YAML is refused rather than guessed at. Refuses unless the piece occurs exactly once, so an edit never lands where its author did not look. A block scalar — `>` folded or `|` literal, with any chomping indicator — is edited in place and stays one: the piece is matched against its text as YAML reads it, a folded one's paragraphs joined by line breaks, and the block is written back under the same header at the same indentation, a folded one with each paragraph on one line, so no paragraph is lost. Long descriptions are the ones written as block scalars, and refusing them sent exactly the edits this operation exists for back to whole rewrites or to the shell. A block scalar with an explicit indentation indicator, or a folded one with a more-indented line, is still refused, since rewriting either can change what YAML reads; so is a bare or quoted value with a blank line in it, whose paragraphs a one-line rewrite would lose."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`<TermName>`, or a full path naming every level, `<TermName>#<slot>#<id>...`"
          - id: field
            description: the field to edit
          - id: old
            description: the exact text to replace, as the value reads rather than as the file escapes it
          - id: new
            description: the text to put in its place
      - id: _edit_block
        description: "Static. edit_field's work on a block scalar: dedents its lines, reads them as YAML does — a literal block line by line, a folded one with the lines between blank lines joined by spaces and each blank line a line break — replaces the piece, and writes the lines back at the same indentation under the header as it was, so the chomping indicator and the style survive. Refuses an explicit indentation indicator and a folded block with a more-indented line, the two forms whose meaning a rewrite at one indentation could change."
      - id: _is_quoted_scalar
        description: "Module-level pure function. Whether a whole text is one complete double- or single-quoted scalar, escapes and doubled quotes allowed inside. Starting and ending with a quote is not enough: `\"Check for updates\" or \"Update\"` does both and is two scalars with text between them, which is how _quoted once passed such a value through as if it were already safe."
        arguments:
          - id: text
            description: the value as written
      - id: _own_files
        description: "The files normalize rewrites and the unquoted-scalar check covers: the root project file and every term file the term map reaches under the root's own directory. A term reached through `uses:` from another project lives in that project's repository, and rewriting it from here would change a file this project does not own."
        arguments:
          - id: root
            description: the resolved root project file
      - id: _normalized
        description: Static. A file's text with every value _unquoted_scalars finds rewritten through _quoted, and how many there were. Nothing else on a line changes — the prefix before the value is kept as written. Shared by normalize and replace_term, so a whole-term replace cannot write what normalize would have to fix.
        arguments:
          - id: text
            description: the file content
  - id: render
    type: Python module
    src: ducktools/src/ducktools/render.py
    description: "The text both front ends print for the navigation operations — load_project, expand and resolve_path — written once, so the CLI and the MCP server cannot drift apart: the markdown tables of load_project, the slot-by-slot listing of expand, and the 'Rules that apply here', 'Codestyle' and 'Goals of the part' sections both expand and resolve_path end with; also the table of grep's matching elements (search) and of verify_project's and verify_source's findings (findings), each finding with the full path of the element it sits in."
  - id: settings
    type: "@ConfigFile"
    format: JSON
    src: ~/.duckspec/settings.json
    description: "Tool-managed registry, never hand-edited: `{active_workspace: str, workspaces: {name: {projects: {repository_url: local_path}}}, ducktools: {src, bin, python}}`. `workspaces` groups @DuckspecProject files that reference each other by repository URL, resolved via the currently active one; `ducktools.src` is the canonical framework clone's `ducktools/` directory, `ducktools.bin` is the path to the small stdlib wrapper script that puts the `ducktools` command on PATH, and `ducktools.python` is the interpreter install-script found, which is what starts the wrapper wherever a shebang is not honoured (Windows) — no pip, no venv, no build step (see @Duckspec#install). Read fresh on every resolution, not cached; created on first write by create_workspace/add_project."
  - id: cli
    src: ducktools/src/ducktools/cli.py
    type: "@Application"
    description: "Command-line front end. Parses argv with argparse, dispatches to the matching resolver method, and prints the result as markdown tables or raw term blocks. A command's arguments are listed under the names the code reads them by — a flag `--all` as `all`, the attribute argparse stores it in; its dashes belong to the usage line in the command's description, never to an id, which is a name and not command-line syntax. A command's exit status says whether it did what was asked: 1 when it refused — a path not found or ambiguous, an edit refused, an unknown workspace, project or command — and, for the two verify commands, when any finding is an error, so either can serve as a CI or pre-commit gate; 0 otherwise. An empty answer — no matching elements, no entries — is still an answer and exits 0. A refusal is told from what the command prints, by the same prefixes @DuckToolsApp#components#resolver#functions#batch rolls back on, so the CLI and batch never disagree about what counts as one; main captures each command's output to read it, except `serve`, whose output is the MCP channel itself."
    functions:
      - id: help
        description: "Command `ducktools help [command]`; prints the command reference held in cli itself. With no argument: a note that every project-taking command accepts either a path to a .yaml file or a registered project identifier, then a Command/Operation/Purpose markdown table per group (reading, structure, checking, editing, workspace, other). Operation is the @DuckToolsApp#components#resolver function the command runs, which is also the name of the MCP tool that runs it — the one column that lets a recipe naming an operation, or a reader who knows the MCP tool, find the command, since several commands are named differently (`grep` runs grep_terms, `entries` runs slot_entries); `serve` and `help` run none and leave it empty. With a command name: that command's usage line, the operation it runs, its purpose, and an Argument/Description table. An unknown name prints `no such command: <name>` and falls back to the full reference. Reads no project file and no settings, so it answers before anything is registered."
        arguments:
          - id: command
            description: optional command to describe in detail; omitted prints the full reference
      - id: load-project
        description: "Command `ducktools load-project <project_path>`; calls resolver#load_project; prints the root project file content, then a Workflow section carrying the `workflow` note, then markdown tables: Parts and Other terms of this project (term, description, refers to, referred to by), Connected projects (one row per other project, left out when there are none), Recipes, Vocabulary from @Duckspec, and Rules (project-wide). A pointer under Parts names `expand` as the next step."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
      - id: load-workflow
        description: "Command `ducktools load-workflow <project_path>`; calls resolver#load_workflow; prints the workflow term's name as a heading, the root's own `workflow:` block under `## As this project configures it`, then the term blocks load-terms would print for it — or the error when no workflow is configured"
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
      - id: list-terms
        description: "Command `ducktools list-terms <project_path> [--all]`; calls resolver#list_terms; prints a markdown table with columns Term, File, and Description"
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: all
            description: pass to resolver#list_terms as include_all=true
      - id: load-terms
        description: Command `ducktools load-terms <project_path> <TermName> [TermName ...]`; calls resolver#load_terms; prints each term and each ancestor of its `extends` chain as `--- @<TermName> [file_path] ---\n<yaml content>`, followed, for each explicitly requested term only, by a References line naming the terms it mentions without loading them and a `## Rules for @<TermName>` own/inherited breakdown
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: term_names
            description: one or more term names (without @) to load with their `extends` chains
      - id: grep
        description: Command `ducktools grep <project_path> <words> [--all] [--limit N]`; calls resolver#grep_terms; prints @DuckToolsApp#components#render's table of the matching elements — the full path that opens each, how many times the words occur, and the words in context — at most `limit` rows (30), saying how many more there are.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: query
            description: substring to search for (case-insensitive)
          - id: all
            description: pass to resolver#grep_terms as include_all=true
      - id: resolve-path
        description: "Command `ducktools resolve-path <project_path> <ref>`; calls resolver#resolve_path; prints `--- <ref> [file_path] ---\\n<content>` followed by a `Rules that apply here` section and, for code, a `Codestyle` section, `not found: <ref>` when nothing resolves, or the ambiguity message when a segment matches more than one element — which is a defect in the spec rather than in the reference, and says so."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: ref
            description: "a full path naming every level, `<TermName>#<slot>#<id>...`"
      - id: expand
        description: "Command `ducktools expand <project_path> <ref>`; calls resolver#expand; prints `--- expand <ref> [file_path] ---`, the element's description, its scalar fields, then one section per slot listing each entry as `- **id** [type] — description` with what it contains and what it refers to, then a `Rules that apply here` section and, when there is any, a `Codestyle` section; `not found: <ref>` or the ambiguity message as resolve-path prints them."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: ref
            description: a term name, or a full path naming every level, `<TermName>#<slot>#<id>...`
      - id: verify-project
        description: Command `ducktools verify-project <project_path> [--unreachable] [--untyped]`; calls resolver#verify_project; prints a markdown table of Severity, Check, Term, Location (path with `:line` appended when present), and Message, or `no findings` when the list is empty. Exits 1 if any finding has severity 'error', 0 otherwise, so it can be used directly as a CI or pre-commit gate.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: unreachable
            description: pass to resolver#verify_project as unreachable=true
          - id: untyped
            description: pass to resolver#verify_project as untyped=true
      - id: verify-source
        description: "Command `ducktools verify-source <project>`; calls resolver#verify_source; prints the same Severity/Check/Term/Location/Message table verify-project prints, or `no findings`. Exits 1 when any finding is an error, so it can gate a commit alongside verify-project."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
      - id: set
        description: "Command `ducktools set <project> <ref> <field> <value>`; calls resolver#set_field; prints the file touched and whether the field was added or replaced."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`<TermName>`, or a full path naming every level, `<TermName>#<slot>#<id>...`"
          - id: field
            description: the field to set
          - id: value
            description: the value to set it to
      - id: add
        description: Command `ducktools add <project> <ref> <entry_id> [field=value ...] [--after ID | --before ID]`; calls resolver#add_entry; prints the file touched and the id added. Each trailing argument is split on the first `=`, so `description='...'` reads naturally in a shell; a value starting with `[` or `{` is read as JSON and becomes a nested block, and one that is not valid JSON is refused with the parse error.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`TermName#segment...` ending at the slot to append to"
          - id: entry_id
            description: id for the new entry
          - id: fields
            description: zero or more `field=value` pairs written under the new entry
          - id: after
            description: id of the sibling entry to insert directly after; the entry goes last when neither this nor `--before` is given
          - id: before
            description: id of the sibling entry to insert directly before; cannot be combined with `--after`
      - id: remove
        description: "Command `ducktools remove <project> <ref>`; calls resolver#remove_element; prints the file touched and how many lines went."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "a full path naming every level, `<TermName>#<slot>#<id>...`"
      - id: add-item
        description: "Command `ducktools add-item <project> <Term#path> <text> [--after M]`; calls resolver#add_item; prints what it returns."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list to append to
          - id: text
            description: the text to add
          - id: after
            description: substring identifying the item to insert after
      - id: set-item
        description: "Command `ducktools set-item <project> <Term#path> <match> <text>`; calls resolver#set_item; prints what it returns."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list holding the item
          - id: match
            description: substring identifying the item
          - id: text
            description: the replacement text
      - id: remove-item
        description: "Command `ducktools remove-item <project> <Term#path> <match>`; calls resolver#remove_item; prints what it returns."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list holding the item
          - id: match
            description: substring identifying the item
      - id: move-item
        description: "Command `ducktools move-item <project> <from#path> <to#path> <match>`; calls resolver#move_item; prints what it returns."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: from_ref
            description: TermName#segment... the item currently sits in
          - id: to_ref
            description: TermName#segment... to move it to
          - id: match
            description: substring identifying the item
      - id: create-term
        description: "Command `ducktools create-term <project> <TermName> <description> [--extends T]`; calls resolver#create_term; prints what it returns."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: CamelCase name, which becomes both the filename and the identity
          - id: description
            description: what the term represents
          - id: extends
            description: parent term name; defaults to Term
      - id: rename-term
        description: "Command `ducktools rename-term <project> <OldName> <NewName>`; calls resolver#rename_term; prints what it returns."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: old_name
            description: current term name
          - id: new_name
            description: new term name
      - id: remove-term
        description: "Command `ducktools remove-term <project> <TermName>`; calls resolver#remove_term; prints what it returns."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term to delete
      - id: uses
        description: "Command `ducktools uses <project> <TermName>`; calls resolver#term_uses; prints one line per relation — extended by, typed by, referenced by."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term to find references to
      - id: schema
        description: "Command `ducktools schema <project> <TermName>`; calls resolver#term_schema; prints a Member/Declared-by table in chain order."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term whose effective schema to resolve
      - id: query
        description: "Command `ducktools query <project> [--rootless] [--extending X] [--declaring M] [--folder F]`; calls resolver#query_terms; prints the matching terms and their count."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: rootless
            description: only terms declaring no `extends`
          - id: extending
            description: only terms whose `extends` chain includes this term
          - id: declaring
            description: only terms declaring a member of this id
          - id: folder
            description: only terms whose path contains this fragment
      - id: entries
        description: Command `ducktools entries <project> <TermName>#<slot>`; calls resolver#slot_entries; prints an Element/Fields table, each entry named by its full path.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "reference in the form `TermName#slot`"
      - id: serve
        description: "Command `ducktools serve [project_path]`; starts the MCP server in stdio mode; project_path is optional and unused — the server accepts any project_path per MCP request via the tools/call arguments"
        arguments:
          - id: project_path
            description: unused; accepted for backward compatibility with existing .mcp.json registrations
      - id: create-workspace
        description: "Command `ducktools create-workspace <name>`; calls resolver#create_workspace"
        arguments:
          - id: name
            description: unique name for the new workspace
      - id: use-workspace
        description: "Command `ducktools use-workspace <name>`; calls resolver#use_workspace; prints the new active workspace or `no such workspace: <name>`"
        arguments:
          - id: name
            description: name of an existing workspace to activate
      - id: list-projects
        description: "Command `ducktools list-projects`; calls resolver#list_projects; prints a `## workspace-name` heading per workspace (active one suffixed ` (active)`) followed by a markdown table (Project/Repository/Path/Description) of its projects, or `(empty)` if it has none"
      - id: add-project
        description: "Command `ducktools add-project <project_path> [--workspace NAME]`; calls resolver#add_project"
        arguments:
          - id: project_path
            description: path to the @DuckspecProject file to register
          - id: workspace
            description: workspace to add to; defaults to the active workspace
      - id: remove-project
        description: "Command `ducktools remove-project <repository> [--workspace NAME]`; calls resolver#remove_project"
        arguments:
          - id: repository
            description: repository URL of the project to remove
          - id: workspace
            description: workspace to remove from; defaults to the active workspace
      - id: normalize
        description: "Command `ducktools normalize <project>`; calls resolver#normalize; prints each file changed with the number of values quoted, or `nothing to change`."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
      - id: replace-term
        description: "Command `ducktools replace-term <project> <Term> <file>`; calls resolver#replace_term with the content of `<file>`, `-` meaning standard input; prints the file replaced or the reason it was refused."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term whose file to replace
          - id: file
            description: where to read the new content from; `-` for standard input
      - id: edit
        description: Command `ducktools edit <project> <ref> <field> <old> <new>`; calls resolver#edit_field; prints the file touched, or why the edit was refused.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`<TermName>`, or a full path naming every level, `<TermName>#<slot>#<id>...`"
          - id: field
            description: the field to edit
          - id: old
            description: the exact text to replace, as the value reads rather than as the file escapes it
          - id: new
            description: the text to put in its place
      - id: batch
        description: "Command `ducktools batch <project_path> <file>`; reads a JSON list of operations from the file, or from standard input when the file is `-`, each an object with `op` and that operation's arguments by name (`ref`, `field`, `value`, `old`, `new`, `entry_id`, `fields`, `text`, `match`, `after`, …); calls resolver#batch; prints one line per operation, then `batch applied` or `batch refused at <n>: <reason> — nothing changed`, exiting 1 on a refusal."
  - id: mcp_server
    src: ducktools/src/ducktools/mcp_server.py
    type: MCP server — JSON-RPC 2.0 over stdio
    description: MCP front end over stdio, exposing the same resolver surface as cli. Implements JSON-RPC 2.0 directly — no SDK, in keeping with the zero-dependency rule — and returns the same markdown the CLI prints, so a model and a terminal see identical output; where the two drifted apart the CLI's wording is the one to match, since it is what a person reads. Each request carries its own project_path, so one server instance serves every registered project. The version it announces in `initialize` is read from the framework's own `version:` field rather than written here, after a hardcoded one told every client 0.1.0 throughout the 0.10 series.
    functions:
      - id: load_project
        description: "MCP tool `load_project`; calls resolver#load_project and returns the same text as @DuckToolsApp#cli#load-project, both written by @DuckToolsApp#render: the root project file content, a Workflow section carrying the `workflow` note, then Parts and Other terms of this project (term, description, refers to, referred to by), Connected projects, Recipes, Vocabulary from @Duckspec and Rules (project-wide). Primary entry point — call this first when starting work on a project."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
      - id: load_workflow
        description: "MCP tool `load_workflow`; calls resolver#load_workflow; returns the workflow term's name as a heading, the root's own `workflow:` block under `## As this project configures it`, then the same term blocks load_terms returns for it — or the error when no workflow is configured"
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
      - id: list_terms
        description: "MCP tool `list_terms`; calls resolver#list_terms; returns a markdown table with columns Term, File, and Description"
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: all
            description: pass to resolver#list_terms as include_all=true; default false
      - id: load_terms
        description: MCP tool `load_terms`; calls resolver#load_terms; returns formatted term blocks `--- @<TermName> [path] ---\n<content>` for the requested terms and each ancestor of their `extends` chains, with a References line and a `## Rules for @<TermName>` own/inherited breakdown appended for each explicitly requested term
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: term_names
            description: space-separated list of term names (without @) to load
      - id: grep_terms
        description: MCP tool `grep_terms`; calls resolver#grep_terms; returns the same table as the CLI command, written by @DuckToolsApp#components#render, with the same `limit`.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: query
            description: substring to search for (case-insensitive)
          - id: all
            description: pass to resolver#grep_terms as include_all=true; default false
      - id: resolve_path
        description: MCP tool `resolve_path`; calls resolver#resolve_path; returns the narrowed block content for the given `Term#path` reference, a not-found message, or the ambiguity message when a segment matches more than one element.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: ref
            description: "a full path naming every level, `<TermName>#<slot>#<id>...`"
      - id: expand
        description: MCP tool `expand`; calls resolver#expand; returns the same text the CLI command prints.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: ref
            description: a term name, or a full path naming every level, `<TermName>#<slot>#<id>...`
      - id: verify_project
        description: "MCP tool `verify_project`; calls resolver#verify_project; returns a markdown table of Severity, Check, Term, Location, and Message, or `no findings` when the list is empty. Unlike the CLI command it reports no exit status — the findings themselves are the result."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file — a filesystem path, or the identifier of a project registered in the active @Workspace (see _resolve_project)
          - id: unreachable
            description: pass to resolver#verify_project as unreachable=true; default false
          - id: untyped
            description: pass to resolver#verify_project as untyped=true; default false
      - id: verify_source
        description: "MCP tool `verify_source`; calls resolver#verify_source; returns a markdown table of Severity, Check, Term, Location and Message, or `no findings`. Answers only the mechanical half — that declared paths exist and named functions are present; whether the descriptions are true still requires reading the source."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
      - id: set_field
        description: "MCP tool `set_field`; calls resolver#set_field. Prefer it over editing a term file line by line: it addresses the element by `#`-path and refuses an ambiguous one."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`<TermName>`, or a full path naming every level, `<TermName>#<slot>#<id>...`"
          - id: field
            description: the field to set
          - id: value
            description: the value to set it to
      - id: add_entry
        description: "MCP tool `add_entry`; calls resolver#add_entry. Prefer it over hand-writing a new `- id:` block: the item column is derived from the slot rather than guessed, a duplicate id is refused, and `after` or `before` places the entry among its siblings where the slot's order matters."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`TermName#segment...` ending at the slot to append to"
          - id: entry_id
            description: id for the new entry
          - id: fields
            description: mapping of field name to value written under the new entry
          - id: after
            description: id of the sibling entry to insert directly after; the entry goes last when neither this nor `before` is given
          - id: before
            description: id of the sibling entry to insert directly before; cannot be combined with `after`
      - id: remove_element
        description: "MCP tool `remove_element`; calls resolver#remove_element. Prefer it over deleting lines by pattern: boundaries come from indentation, so nothing nested is left behind."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "a full path naming every level, `<TermName>#<slot>#<id>...`"
      - id: add_item
        description: "MCP tool `add_item`; calls resolver#add_item. Prefer it over hand-editing a guideline, instruction or goal list: the item is written at the list's own column and quoted when it would otherwise read as structure."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list to append to
          - id: text
            description: the text to add
          - id: after
            description: substring identifying the item to insert after; appended at the end when omitted
      - id: set_item
        description: "MCP tool `set_item`; calls resolver#set_item."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list holding the item
          - id: match
            description: substring identifying the item
          - id: text
            description: the replacement text
      - id: remove_item
        description: "MCP tool `remove_item`; calls resolver#remove_item."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: TermName#segment... ending at the list holding the item
          - id: match
            description: substring identifying the item
      - id: move_item
        description: "MCP tool `move_item`; calls resolver#move_item."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: from_ref
            description: TermName#segment... the item currently sits in
          - id: to_ref
            description: TermName#segment... to move it to
          - id: match
            description: substring identifying the item
      - id: create_term
        description: "MCP tool `create_term`; calls resolver#create_term."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: CamelCase name, which becomes both the filename and the identity
          - id: description
            description: what the term represents
          - id: extends
            description: parent term name; defaults to Term
      - id: rename_term
        description: "MCP tool `rename_term`; calls resolver#rename_term."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: old_name
            description: current term name
          - id: new_name
            description: new term name
      - id: remove_term
        description: "MCP tool `remove_term`; calls resolver#remove_term."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term to delete
      - id: term_uses
        description: "MCP tool `term_uses`; calls resolver#term_uses; returns one line per relation. Call it before changing a term to see what depends on it."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term to find references to
      - id: term_schema
        description: "MCP tool `term_schema`; calls resolver#term_schema; returns a Member/Declared-by table."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term whose effective schema to resolve
      - id: query_terms
        description: "MCP tool `query_terms`; calls resolver#query_terms; returns the matching term names and their count."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: rootless
            description: only terms declaring no `extends`; default false
          - id: extending
            description: only terms whose `extends` chain includes this term
          - id: declaring
            description: only terms declaring a member of this id
          - id: folder
            description: only terms whose path contains this fragment
      - id: slot_entries
        description: MCP tool `slot_entries`; calls resolver#slot_entries; returns an Element/Fields table, each entry named by its full path.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term holding the slot
          - id: slot
            description: the slot whose entries to list
      - id: create_workspace
        description: "MCP tool `create_workspace`; calls resolver#create_workspace"
        arguments:
          - id: name
            description: unique name for the new workspace
      - id: use_workspace
        description: "MCP tool `use_workspace`; calls resolver#use_workspace; returns the new active workspace or a not-found message"
        arguments:
          - id: name
            description: name of an existing workspace to activate
      - id: list_projects
        description: "MCP tool `list_projects`; calls resolver#list_projects; returns a `## workspace-name` heading per workspace (active one suffixed ` (active)`) followed by a markdown table (Project/Repository/Path/Description) of its projects, or `(empty)` if it has none"
      - id: add_project
        description: "MCP tool `add_project`; calls resolver#add_project"
        arguments:
          - id: project_path
            description: path to the @DuckspecProject file to register
          - id: workspace
            description: workspace to add to; defaults to the active workspace
      - id: remove_project
        description: "MCP tool `remove_project`; calls resolver#remove_project"
        arguments:
          - id: repository
            description: repository URL of the project to remove
          - id: workspace
            description: workspace to remove from; defaults to the active workspace
      - id: normalize
        description: "MCP tool `normalize`; calls resolver#normalize. Run it on a project whose files predate the rule that term files are valid YAML, or whenever verify_project reports `unquoted-scalar`."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
      - id: replace_term
        description: "MCP tool `replace_term`; calls resolver#replace_term. For a rewrite of a whole term; prefer set_field, add_entry and the item tools for anything smaller, since they touch only what they name."
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: term_name
            description: the term whose file to replace
          - id: content
            description: the new content of the file
      - id: edit_field
        description: MCP tool `edit_field`; calls resolver#edit_field. The way to change a sentence in a long value without restating all of it.
        arguments:
          - id: project_path
            description: a @DuckspecProject .yaml file or a registered project identifier
          - id: ref
            description: "`<TermName>`, or a full path naming every level, `<TermName>#<slot>#<id>...`"
          - id: field
            description: the field to edit
          - id: old
            description: the exact text to replace, as the value reads rather than as the file escapes it
          - id: new
            description: the text to put in its place
      - id: batch
        description: MCP tool `batch`; takes `project_path` and `operations`, a list of objects each with `op` and that operation's arguments; calls resolver#batch; returns the same text the CLI prints.
  - id: check-wiring
    type: "@Script"
    interpreter: python3
    src: ducktools/check_wiring.py
    description: "Reachability both ways round. Compares the public methods of resolver.py against the ones cli.py and mcp_server.py actually call, and the CLI commands and MCP tools the front ends define against the function entries of @DuckToolsApp#cli and @DuckToolsApp#mcp_server, failing on anything present on one side only. The first half exists because comparing the spec with the code confirms a method is *described*, not that it is *reachable*: six operations shipped in 0.10.1 and 0.10.2 fully documented and callable from neither front end. The second because verify_source only looks from the spec towards the code, so a command added without a spec entry is invisible to it: eight commands and eight tools went undescribed that way until the code was read by hand."
  - id: install-script
    type: "@Script"
    interpreter: bash
    src: ducktools/install.sh
    description: "Classic, non-interactive installer for Linux, macOS and Windows (under Git Bash) — the scripted equivalent of the bootstrap portion of @Duckspec#install, which asks the user the questions, clones and audits the framework, and then runs this script from the audited clone with the answers. Takes the path to clone the framework into and, optionally, the directory to put the `ducktools` command in. Clones only if the clone path does not exist; reuses it if it already holds `Duckspec.yaml` — idempotent — and refuses any other existing folder, because a user asked for a folder easily names the one that will hold the clone, and installing into that left a wrapper pointing at nothing. Without a bin directory it picks the first of the conventional candidates the script lists that is on `$PATH` and writable — or, inside the home directory, not created yet — covering Linux, both Homebrew layouts and Git Bash's `~/bin` without any OS detection, and skipping a system directory a non-root user cannot write to — falling back to `~/.local/bin`, with a non-fatal warning when the result is not on PATH — and its closing line then names the wrapper by its absolute path as the command to verify with, since the bare `ducktools` it would otherwise suggest is exactly what was just reported missing. This list is also the one @Duckspec#install offers the user. Finds Python 3.10 or newer by running `python3`, then `python`, rather than by their presence: Windows installs it as `python`, and its `python3` may be a stub that only opens the Store. Writes a stdlib-only wrapper whose shebang names the interpreter found by its absolute path — `env` would let whatever PATH holds at run time pick one, and on macOS that can be the system's own Python 3.9, which cannot run @DuckToolsApp. When that path is itself a script — the shim of a version manager such as pyenv, asdf or mise — the shebang names the binary it runs instead (`sys.executable`), since macOS will not run a script as another script's interpreter; and when the path holds a space, as under `C:\\Program Files` on Windows, the shebang falls back to `env`, since a shebang cannot carry one. Updates `ducktools.src`/`ducktools.bin`/`ducktools.python` in `~/.duckspec/settings.json`, `ducktools.python` being the binary itself — reusing resolver#_load_settings/_save_settings via an inline Python call rather than reimplementing JSON handling in bash, so the schema can never drift between the two. Creates a `default` workspace and activates it only if no workspace exists yet; never touches an existing one. Then calls resolver#_register_framework on the active workspace, so a new user's first project finds the framework its `uses:` names. The clone path and the bin directory are made absolute before anything records them, because `ducktools.src`, `ducktools.bin` and the wrapper's import path are all used from whatever directory `ducktools` is later run in, where a relative path points at nothing. Where `cygpath` exists — Git Bash and Cygwin on Windows — recorded paths are converted to the native form, since the Python that reads them is a native Windows program that cannot open `/c/...`, and a `ducktools.cmd` shim is written beside the wrapper so the command also runs from cmd and PowerShell, which ignore shebangs. cmd reads a batch file in the console's legacy code page, so the shim names the interpreter through `%USERPROFILE%` wherever it lies under the user's profile — a non-ASCII user name written out literally would come back garbled. The script itself is kept LF-only by `.gitattributes`: Git for Windows checks text files out with CRLF by default, and bash cannot run a script that way."
  - id: check-operations
    type: "@Script"
    interpreter: python3
    src: ducktools/check_operations.py
    description: "Exercises every public resolver method against a throwaway project built in a temp directory, then runs every CLI command and every MCP tool once over the same project — the stdio server included, fed an initialize and a tools/list — and fails naming the ones whose result was wrong, and any method, command or tool it did not run. Complements check-wiring, which proves a method is reachable but never calls it: the operations that write to term files shipped untested, and every defect found in them so far was found by hand. The front-end half exists because a method can be right while what a reader sees is not: load_project returned a pointer to the workflow that neither front end printed. Redirects the settings path at import so the workspace methods cannot touch the real registry."
