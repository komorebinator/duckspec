description: A body of code that is built, versioned and shipped as a unit — an application, a service, a library, a command-line tool, a container image. What distinguishes it from the @DesignPattern it extends is ownership of a lifecycle: it has a repository it lives in, a platform it is built for, tests that say whether it works, and recipes to build, run and install it. A component inside one is a @SoftwareComponent, not a @Software of its own.
extends: @DesignPattern
guidelines:
  - When reading a @Software, resolve each component's type to its @DesignPattern term to understand what fields it supports
  - Component names within a @Software are local path identifiers; use the `#`-separated path syntax (see @Term) to reference any named element within a component, e.g. `component#function` or `component#signal`
properties:
  - id: repository
    description: URL or path to the @Software's source repository
  - id: platform
    description: language or platform the software is built for (e.g. Python, iOS, web)
  - id: tests
    type: @Test
    description: list of @Test cases for this @Software
recipes:
  - id: build
    description: Creates or updates source files in `src/` to match this @Software's specification
    instructions:
      - Read the @Software term; resolve each component's type to its @DesignPattern term
      - Create the folder at `src` if it does not exist
      - For each component and for the entry point: if the corresponding source file already exists in `src`, read it and apply only the changes needed to bring it in line with the specification; if it does not exist, create it; follow the conventions of `platform`
  - id: test
    description: Runs all @Test cases listed in `tests` and reports results
    instructions:
      - Read the @Software term to get `platform` and `tests`
      - For each @Test: run `command` following `platform` conventions; check output against `expect`; record 🟢 when it ran and matched, 🔴 when it ran and did not, 🟡 when it could not be run at all — and the observed output either way
      - Output a markdown table with columns: Test | Status | Detail, using the same markers @DuckspecProject#validate reports with, since that recipe is where these results end up
  - id: run
    description: Runs the @Software using the conventions of `platform`
    arguments:
      - id: args
        description: command-line arguments to pass to the software
    instructions:
      - Read the @Software term to determine `platform` and `src`
      - Run the software following `platform` conventions (e.g. `python3 -m <package> <args>` for Python)
  - id: install
    description: Installs the @Software as a system command using the conventions of `platform`
    instructions:
      - Read the @Software term to determine `platform` and `src`
      - Run the standard install command for `platform` (e.g. `pip install -e <src>` for Python, `npm install` for Node.js) from the directory containing the project's package descriptor
