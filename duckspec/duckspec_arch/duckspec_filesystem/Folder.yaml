description: A directory in the filesystem created or populated at build or deploy time.
extends: @DesignPattern
properties:
  - id: path
    description: absolute path of this directory in the target filesystem
  - id: permissions
    description: directory permissions (e.g. 0755, owner:group); omit if default
  - id: files
    type: @File
    description: list of @File instances this directory contains. A directory inside it is not listed here — a @Folder carries its own absolute `path`, so nested directories are declared as @Folder entries in their own right rather than embedded, which is what keeps this slot holding one type.
