description: A single visual or interactive component within a @UserInterface.
extends: @DesignPattern
properties:
  - id: label
    description: text displayed on or alongside the element (button text, field label, option caption, etc.)
  - id: disabled
    description: whether the element is non-interactive; defaults to false
    default: false
  - id: visible
    description: whether the element is shown at all; defaults to true. An element that appears only under some condition sets this to false in the states where it is hidden, rather than describing the condition in prose.
    default: true
  - id: states
    type: @ElementState
    description: list of @ElementState the element can be in; each names a condition and the properties that differ while it holds
